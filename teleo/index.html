    <!-- Script Bintang Bergerak (Starfield Animation) -->
    <script>
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];

        function initStars() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            stars = [];
            // Menyesuaikan jumlah bintang agar tidak berat di HP
            const numStars = width < 768 ? 75 : 200;
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        class Star {
            constructor() {
                this.reset();
                this.z = Math.random() * width; // Kedalaman awal diacak
            }
            reset() {
                this.x = (Math.random() - 0.5) * 2 * width;
                this.y = (Math.random() - 0.5) * 2 * height;
                this.z = width;
                this.size = Math.random() * 1.2; // Ukuran bintang bervariasi
            }
            update() {
                this.z -= 0.4; // Kecepatan mendekat (0.4 = pelan dan elegan)
                if (this.z <= 0) {
                    this.reset();
                }
            }
            draw() {
                // Konversi koordinat 3D ke layar 2D
                let x = (this.x / this.z) * width + width / 2;
                let y = (this.y / this.z) * height + height / 2;
                let radius = (1 - this.z / width) * this.size * 2; // Bintang membesar saat dekat
                let opacity = (1 - this.z / width); // Bintang semakin terang saat dekat

                // Jika keluar dari layar, reset ke belakang
                if (x < 0 || x > width || y < 0 || y > height) {
                    this.reset();
                    return;
                }

                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.fill();
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', initStars);
        window.addEventListener('load', () => {
            initStars();
            animateStars();
        });
    </script>
