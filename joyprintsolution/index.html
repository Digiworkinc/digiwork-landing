<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joy Print Solution - Management & POS System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              100: '#cffafe',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
              800: '#155e75',
              900: '#164e63',
              darkBg: '#0f172a',
              darkCard: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
    .dark ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <div id="app" class="flex flex-1 h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col justify-between z-20 shrink-0 transition-all duration-300">
      <div>
        <div class="p-4 flex items-center justify-between border-b border-slate-200 dark:border-slate-700">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-cyan-500 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-cyan-500/30">
              <i data-lucide="printer" class="w-6 h-6"></i>
            </div>
            <div>
              <h1 class="font-bold text-base leading-tight">Joy Print</h1>
              <span class="text-xs text-cyan-600 dark:text-cyan-400 font-semibold">Solution App</span>
            </div>
          </div>
        </div>

        <div class="p-4 mx-3 my-3 rounded-lg bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700/60 flex items-center justify-between">
          <div>
            <span class="text-xs text-slate-500 dark:text-slate-400 block">Hak Akses:</span>
            <span id="role-badge" class="font-bold text-sm text-cyan-500 capitalize">Admin</span>
          </div>
          <button onclick="switchRoleModal()" class="text-xs px-2.5 py-1 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 transition flex items-center space-x-1">
            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
            <span>Ubah</span>
          </button>
        </div>

        <div class="px-4 py-1.5 mx-3 mb-2 rounded text-[11px] font-medium flex items-center justify-between bg-emerald-500/10 text-emerald-500 border border-emerald-500/20" id="db-status">
          <span class="flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="sync-text">Menyambungkan...</span>
          </span>
          <i data-lucide="database" class="w-3.5 h-3.5"></i>
        </div>

        <nav class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-250px)]" id="main-nav">
          <!-- Rendered via JS -->
        </nav>
      </div>

      <div class="p-3 border-t border-slate-200 dark:border-slate-700 space-y-2">
        <button onclick="toggleDarkMode()" class="w-full flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/50 transition">
          <div class="flex items-center space-x-2">
            <i data-lucide="moon" class="w-5 h-5 hidden dark:block text-amber-400"></i>
            <i data-lucide="sun" class="w-5 h-5 block dark:hidden text-amber-500"></i>
            <span class="text-sm font-medium">Tampilan</span>
          </div>
          <span class="text-xs px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 capitalize" id="theme-label">Dark</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 z-10 shrink-0">
        <div class="flex items-center space-x-4">
          <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 md:hidden">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <h2 id="page-title" class="text-lg font-bold text-slate-800 dark:text-slate-100">Dashboard Utama</h2>
        </div>

        <div class="flex items-center space-x-3">
          <button onclick="navigateTo('stok')" class="relative p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" title="Peringatan Stok Tipis">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span id="low-stock-count" class="hidden absolute top-1 right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
          </button>
          <button onclick="navigateTo('pos')" class="px-3.5 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-600 text-white text-sm font-semibold flex items-center space-x-2 shadow-md shadow-cyan-500/20 transition">
            <i data-lucide="shopping-cart" class="w-4 h-4"></i>
            <span>Kasir / POS</span>
          </button>
        </div>
      </header>

      <main id="content-area" class="flex-1 p-6 overflow-y-auto bg-slate-50 dark:bg-slate-900">
        <!-- Content injected here -->
      </main>
    </div>
  </div>

  <!-- Modals -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modal-box" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 transition-all scale-95 opacity-0 relative">
      <!-- Content injected here -->
    </div>
  </div>

  <!-- Print Area -->
  <div id="printable-area" class="hidden p-6 bg-white text-black font-mono"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Application Configuration
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'joy-print-pos-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "demo-key", authDomain: "demo.firebaseapp.com", projectId: "demo", storageBucket: "demo.appspot.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Initial Demo Data (Used only if Database is entirely empty)
    const initialSeedData = {
      pelanggan: [
        { id: 'CUST-001', nama: 'Budi Santoso', telepon: '08123456789', alamat: 'Jl. Merdeka No. 12, Kota' }
      ],
      stok: [
        { id: 'BRG-001', nama: 'Tinta Epson 003 Black', kategori: 'Tinta', hpp: 75000, harga: 95000, jumlah: 15, minStok: 5, satuan: 'Botol' },
        { id: 'BRG-002', nama: 'Printhead Epson L3110', kategori: 'Sparepart', hpp: 450000, harga: 580000, jumlah: 2, minStok: 2, satuan: 'Pcs' }
      ],
      servis: [],
      penjualan: [],
      pembelian: [],
      kas: [],
      operasional: [],
      hutangpiutang: []
    };

    // State Management
    window.state = {
      role: 'admin',
      activeTab: 'dashboard',
      darkMode: true,
      pelanggan: [],
      stok: [],
      servis: [],
      penjualan: [],
      pembelian: [],
      kas: [],
      operasional: [],
      hutangpiutang: [],
      cart: []
    };

    // Firebase Helper Functions (Enforcing Rules)
    const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
    const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

    async function initFirebaseSync() {
      try {
        // Enforce Rule 3: Auth Before Queries
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        if (!auth.currentUser) throw new Error("Gagal login ke sistem cloud.");
        
        document.getElementById('sync-text').innerText = 'Sinkronisasi Aktif';

        const collections = Object.keys(initialSeedData);
        
        // Enforce Rule 2: Fetch all data without complex queries
        collections.forEach(colName => {
          const colRef = getColRef(colName);
          
          onSnapshot(colRef, async (snapshot) => {
            if (snapshot.empty && initialSeedData[colName].length > 0) {
              // Seed data if empty
              for (const item of initialSeedData[colName]) {
                await setDoc(getDocRef(colName, item.id), item);
              }
            } else {
              const dataList = [];
              snapshot.forEach(docSnap => {
                dataList.push({ ...docSnap.data(), id: docSnap.id });
              });
              window.state[colName] = dataList;
              
              if(window.renderPage) window.renderPage();
            }
          }, (err) => {
            console.error(`Error loading ${colName}:`, err);
            document.getElementById('sync-text').innerText = 'Koneksi Terputus';
            document.getElementById('sync-text').classList.add('text-rose-500');
          });
        });

      } catch (err) {
        console.error("Firebase auth error:", err);
        document.getElementById('sync-text').innerText = 'Akses Ditolak';
      }
    }

    window.dbSave = async function(colName, docId, data) {
      if(!auth.currentUser) return window.showAlert("Error", "Belum terkoneksi ke database.");
      try { await setDoc(getDocRef(colName, docId), data); } 
      catch (err) { console.error(err); window.showAlert("Gagal", "Gagal menyimpan data."); }
    };

    window.dbUpdate = async function(colName, docId, data) {
      if(!auth.currentUser) return;
      try { await updateDoc(getDocRef(colName, docId), data); } 
      catch (err) { console.error(err); }
    };

    window.dbDelete = async function(colName, docId) {
      if(!auth.currentUser) return;
      try { await deleteDoc(getDocRef(colName, docId)); } 
      catch (err) { console.error(err); }
    };

    window.navItems = [
      { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['admin', 'user'] },
      { id: 'servis', label: 'Transaksi Servis', icon: 'wrench', roles: ['admin', 'user'] },
      { id: 'pos', label: 'Penjualan / POS', icon: 'shopping-bag', roles: ['admin', 'user'] },
      { id: 'stok', label: 'Stok Sparepart & Barang', icon: 'boxes', roles: ['admin', 'user'] },
      { id: 'pelanggan', label: 'Data Pelanggan', icon: 'users', roles: ['admin', 'user'] },
      { id: 'pembelian', label: 'Pembelian Stock', icon: 'truck', roles: ['admin'] },
      { id: 'kas', label: 'Kas Masuk & Keluar', icon: 'wallet', roles: ['admin', 'user'] },
      { id: 'operasional', label: 'Pengeluaran Operasional', icon: 'receipt', roles: ['admin'] },
      { id: 'hutangpiutang', label: 'Hutang & Piutang', icon: 'file-text', roles: ['admin'] },
      { id: 'laporan', label: 'Laporan Keuangan', icon: 'bar-chart-3', roles: ['admin'] }
    ];

    window.formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);

    window.toggleDarkMode = function() {
      state.darkMode = !state.darkMode;
      const html = document.documentElement;
      if (state.darkMode) {
        html.classList.add('dark');
        document.getElementById('theme-label').innerText = 'Dark';
      } else {
        html.classList.remove('dark');
        document.getElementById('theme-label').innerText = 'Light';
      }
    };

    window.toggleSidebar = function() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    };

    window.openModal = function(contentHtml) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = `
        <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        ${contentHtml}
      `;
      backdrop.classList.remove('hidden');
      setTimeout(() => {
        box.classList.remove('scale-95', 'opacity-0');
        box.classList.add('scale-100', 'opacity-100');
      }, 10);
      if(window.lucide) lucide.createIcons();
    };

    window.closeModal = function() {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.classList.remove('scale-100', 'opacity-100');
      box.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        backdrop.classList.add('hidden');
      }, 200);
    };

    window.showAlert = function(title, message) {
      openModal(`
        <div class="space-y-4 text-center mt-2">
          <div class="mx-auto w-12 h-12 bg-cyan-500/10 text-cyan-500 rounded-full flex items-center justify-center mb-4">
            <i data-lucide="info" class="w-6 h-6"></i>
          </div>
          <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100">${title}</h3>
          <p class="text-sm text-slate-500">${message}</p>
          <div class="pt-4">
            <button onclick="closeModal()" class="px-4 py-2.5 bg-cyan-500 text-white rounded-xl text-sm font-semibold w-full">Tutup</button>
          </div>
        </div>
      `);
    };

    window.showConfirm = function(title, message, onConfirm) {
      window.__tempConfirm = onConfirm;
      openModal(`
        <div class="space-y-4 text-center mt-2">
          <div class="mx-auto w-12 h-12 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mb-4">
            <i data-lucide="help-circle" class="w-6 h-6"></i>
          </div>
          <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100">${title}</h3>
          <p class="text-sm text-slate-500">${message}</p>
          <div class="pt-4 flex space-x-3">
            <button onclick="closeModal()" class="flex-1 px-4 py-2.5 bg-slate-200 dark:bg-slate-700 rounded-xl text-sm font-semibold">Batal</button>
            <button onclick="window.__tempConfirm(); closeModal();" class="flex-1 px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-sm font-semibold">Yakin</button>
          </div>
        </div>
      `);
    };

    window.switchRoleModal = function() {
      openModal(`
        <div class="space-y-4">
          <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center space-x-2">
            <i data-lucide="shield-alert" class="w-5 h-5 text-cyan-500"></i>
            <span>Ganti Hak Akses Pengguna</span>
          </h3>
          <p class="text-sm text-slate-500 dark:text-slate-400">Pilih mode hak akses aplikasi Joy Print Solution:</p>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="setRole('admin')" class="p-4 rounded-xl border-2 ${state.role === 'admin' ? 'border-cyan-500 bg-cyan-500/10' : 'border-slate-200 dark:border-slate-700'} text-left hover:border-cyan-500 transition">
              <span class="font-bold block text-cyan-500">ADMIN</span>
              <span class="text-xs text-slate-500 dark:text-slate-400">Akses Penuh Seluruh Laporan</span>
            </button>
            <button onclick="setRole('user')" class="p-4 rounded-xl border-2 ${state.role === 'user' ? 'border-cyan-500 bg-cyan-500/10' : 'border-slate-200 dark:border-slate-700'} text-left hover:border-cyan-500 transition">
              <span class="font-bold block text-emerald-500">KASIR</span>
              <span class="text-xs text-slate-500 dark:text-slate-400">Terbatas Transaksi Saja</span>
            </button>
          </div>
        </div>
      `);
    };

    window.setRole = function(newRole) {
      state.role = newRole;
      document.getElementById('role-badge').innerText = newRole;
      document.getElementById('role-badge').className = `font-bold text-sm capitalize ${newRole === 'admin' ? 'text-cyan-500' : 'text-emerald-500'}`;
      
      const currentNav = navItems.find(n => n.id === state.activeTab);
      if (currentNav && !currentNav.roles.includes(newRole)) state.activeTab = 'dashboard';

      closeModal();
      renderNav();
      renderPage();
    };

    window.renderNav = function() {
      const navContainer = document.getElementById('main-nav');
      navContainer.innerHTML = navItems
        .filter(item => item.roles.includes(state.role))
        .map(item => `
          <button onclick="navigateTo('${item.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${state.activeTab === item.id ? 'bg-cyan-500 text-white shadow-md shadow-cyan-500/30' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50'}">
            <i data-lucide="${item.icon}" class="w-4 h-4"></i>
            <span>${item.label}</span>
          </button>
        `).join('');
      if(window.lucide) lucide.createIcons();
    };

    window.navigateTo = function(tabId) {
      state.activeTab = tabId;
      renderNav();
      renderPage();
    };

    window.checkNotifications = function() {
      const lowStock = state.stok.filter(s => s.jumlah <= s.minStok).length;
      const badge = document.getElementById('low-stock-count');
      if (lowStock > 0) {
        badge.innerText = lowStock; badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    };

    window.getFinancialMetrics = function() {
      const omsetPenjualan = state.penjualan.reduce((acc, curr) => acc + curr.total, 0);
      const omsetServis = state.servis.reduce((acc, curr) => acc + (curr.bayar || 0), 0);
      const totalOmset = omsetPenjualan + omsetServis;

      const hppPenjualan = state.penjualan.reduce((acc, curr) => acc + (curr.hppTotal || 0), 0);
      const hppSparepartServis = state.servis.reduce((acc, s) => {
        const hppItems = (s.spareparts || []).reduce((sum, sp) => {
          const itemMaster = state.stok.find(b => b.id === sp.id);
          return sum + ((itemMaster ? itemMaster.hpp : sp.harga * 0.7) * sp.qty);
        }, 0);
        return acc + hppItems;
      }, 0);
      const totalHPP = hppPenjualan + hppSparepartServis;

      const labaKotor = totalOmset - totalHPP;
      const totalOperasional = state.operasional.reduce((acc, curr) => acc + curr.jumlah, 0);
      const labaBersih = Math.max(0, labaKotor - totalOperasional);

      return {
        totalOmset, labaKotor, totalOperasional, labaBersih,
        pos70: labaBersih * 0.70, pos20: labaBersih * 0.20, pos10: labaBersih * 0.10
      };
    };

    window.renderPage = function() {
      const container = document.getElementById('content-area');
      const title = document.getElementById('page-title');
      checkNotifications();

      const currentNav = navItems.find(n => n.id === state.activeTab);
      title.innerText = currentNav ? currentNav.label : 'Dashboard';

      switch (state.activeTab) {
        case 'dashboard': container.innerHTML = renderDashboardView(); break;
        case 'servis': container.innerHTML = renderServisView(); break;
        case 'pos': container.innerHTML = renderPOSView(); break;
        case 'stok': container.innerHTML = renderStokView(); break;
        case 'pelanggan': container.innerHTML = renderPelangganView(); break;
        case 'pembelian': container.innerHTML = renderPembelianView(); break;
        case 'kas': container.innerHTML = renderKasView(); break;
        case 'operasional': container.innerHTML = renderOperasionalView(); break;
        case 'hutangpiutang': container.innerHTML = renderHutangPiutangView(); break;
        case 'laporan': container.innerHTML = renderLaporanView(); break;
        default: container.innerHTML = renderDashboardView();
      }
      if(window.lucide) lucide.createIcons();
    };

    function renderDashboardView() {
      const fin = getFinancialMetrics();
      const isUser = state.role === 'user';

      return `
        <div class="space-y-6">
          <div class="p-6 rounded-2xl bg-gradient-to-r from-cyan-600 to-blue-700 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <span class="text-xs font-semibold uppercase tracking-wider bg-white/20 px-3 py-1 rounded-full">Joy Print Management</span>
              <h2 class="text-2xl font-black mt-2">Selamat Datang di Sistem</h2>
              <p class="text-sm opacity-90 text-cyan-100">Pantau performa toko, kasir dan status servis dengan mudah.</p>
            </div>
            <button onclick="navigateTo('servis')" class="px-4 py-2 bg-white text-cyan-700 rounded-xl font-bold text-sm shadow hover:bg-cyan-50 transition flex items-center space-x-2">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Servis Baru</span>
            </button>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
              <div class="flex items-center justify-between text-slate-500">
                <span class="text-xs font-medium uppercase">Total Omset</span>
                <div class="p-2 rounded-lg bg-cyan-500/10 text-cyan-500"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
              </div>
              <h3 class="text-2xl font-bold mt-2">${formatRp(fin.totalOmset)}</h3>
            </div>
            <div class="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
              <div class="flex items-center justify-between text-slate-500">
                <span class="text-xs font-medium uppercase">Laba Kotor</span>
                <div class="p-2 rounded-lg bg-emerald-500/10 text-emerald-500"><i data-lucide="coins" class="w-5 h-5"></i></div>
              </div>

    window.simpanServisBaru = async function(e) {
      e.preventDefault();
      const pelangganId = document.getElementById('srv-pelanggan').value;
      const pel = state.pelanggan.find(p => p.id === pelangganId);
      const biayaJasa = parseFloat(document.getElementById('srv-jasa').value) || 0;
      const dp = parseFloat(document.getElementById('srv-dp').value) || 0;
      const newId = `SRV-${Date.now()}`;
      
      const sisa = biayaJasa - dp;

      await dbSave('servis', newId, {
        id: newId, tanggal: new Date().toISOString().split('T')[0],
        pelangganId, pelangganNama: pel ? pel.nama : 'Umum',
        printer: document.getElementById('srv-printer').value,
        keluhan: document.getElementById('srv-keluhan').value,
        status: 'Diterima', biayaJasa, spareparts: [],
        totalBiaya: biayaJasa, statusBayar: sisa <= 0 ? 'Lunas' : (dp > 0 ? 'DP' : 'Belum Bayar'),
        bayar: dp, sisa: Math.max(0, sisa)
      });

      if (sisa > 0) {
        await dbSave('hutangpiutang', `HP-${Date.now()}`, {
          id: `HP-${Date.now()}`, jenis: 'Piutang', pihak: pel ? pel.nama : 'Pelanggan',
          noRef: newId, jumlah: sisa, jatuhTempo: new Date(Date.now() + 7 * 86400000).toISOString().split('T')[0], status: 'Belum Lunas'
        });
      }
      closeModal();
    };

    window.addToCart = function(id) {
      const b = state.stok.find(item => item.id === id);
      if (!b || b.jumlah <= 0) return showAlert('Habis', 'Stok barang ini sudah habis.');
      const exist = state.cart.find(c => c.id === id);
      if (exist) {
        if(exist.qty < b.jumlah) exist.qty++; else showAlert('Batas Stok', 'Mencapai maksimal stok.');
      } else {
        state.cart.push({ ...b, qty: 1 });
      }
      renderPage();
    };

    window.updateCart = function(idx, change) {
      state.cart[idx].qty += change;
      if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
      renderPage();
    };

    window.checkoutPOS = async function() {
      const total = state.cart.reduce((s, i) => s + (i.harga * i.qty), 0);
      const hpp = state.cart.reduce((s, i) => s + (i.hpp * i.qty), 0);
      const id = `TRX-${Date.now()}`;
      
      await dbSave('penjualan', id, {
        id, tanggal: new Date().toISOString().split('T')[0],
        pelangganNama: 'Umum', items: state.cart, total, hppTotal: hpp, labaKotor: total - hpp, metode: 'Tunai'
      });

      for (const item of state.cart) {
        const s = state.stok.find(x => x.id === item.id);
        if(s) await dbUpdate('stok', item.id, { jumlah: s.jumlah - item.qty });
      }
      
      showAlert('Sukses', 'Transaksi berhasil disimpan!');
      state.cart = [];
      renderPage();
    };

      `;
    }

    window.openModalKas = () => openModal(`<form onsubmit="simpanKas(event)" class="space-y-3"><select id="k-tipe" class="w-full p-2 rounded bg-slate-100 dark:bg-slate-700"><option>Masuk</option><option>Keluar</option></select><input id="k-kat" placeholder="Kategori" class="w-full p-2 rounded bg-slate-100 dark:bg-slate-700" required><input id="k-ket" placeholder="Keterangan" class="w-full p-2 rounded bg-slate-100 dark:bg-slate-700" required><input id="k-jml" type="number" placeholder="Jumlah" class="w-full p-2 rounded bg-slate-100 dark:bg-slate-700" required><button type="submit" class="w-full p-2 bg-cyan-500 text-white rounded font-bold">Simpan</button></form>`);
    
    window.simpanKas = async (e) => {
      e.preventDefault();
      const id = `KAS-${Date.now()}`;
      await dbSave('kas', id, { id, tanggal: new Date().toISOString().split('T')[0], tipe: document.getElementById('k-tipe').value, kategori: document.getElementById('k-kat').value, keterangan: document.getElementById('k-ket').value, jumlah: +document.getElementById('k-jml').value });
      closeModal();
    };

    function renderOperasionalView() {
      return `
        <div class="space-y-4">
          <div class="flex justify-between"><h3 class="text-xl font-bold">Operasional Bulanan</h3><button onclick="openModalOps()" class="px-4 py-2 bg-cyan-500 text-white rounded">Catat Beban</button></div>
          <div class="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 space-y-2">
            ${state.operasional.map(o => `<div class="p-3 flex justify-between bg-slate-50 dark:bg-slate-900 rounded"><span>${o.nama} - ${o.kete}</span><span class="font-bold text-rose-500">${formatRp(o.jumlah)}</span></div>`).join('')}
          </div>
        </div>
      `;
    }

    window.openModalOps = () => openModal(`<form onsubmit="simpanOps(event)" class="space-y-3"><input id="o-nama" placeholder="Nama Beban (Misal: Listrik)" class="w-full p-2 rounded bg-slate-100 dark:bg-slate-700" required><input id="o-ket" placeholder="Keterangan" class="w-full p-2 rounded bg-slate-100 dark:bg-slate-700" required><input id="o-jml" type="number" placeholder="Total Rp" class="w-full p-2 rounded bg-slate-100 dark:bg-slate-700" required><button type="submit" class="w-full p-2 bg-cyan-500 text-white rounded font-bold">Simpan</button></form>`);
    
    window.simpanOps = async (e) => {
      e.preventDefault();
      const id = `OPS-${Date.now()}`;
      await dbSave('operasional', id, { id, tanggal: new Date().toISOString().split('T')[0], nama: document.getElementById('o-nama').value, kete: document.getElementById('o-ket').value, jumlah: +document.getElementById('o-jml').value });
      closeModal();
    };

    function renderHutangPiutangView() {
      return `
        <div class="space-y-6">
          <h3 class="text-xl font-bold">Hutang & Piutang</h3>
          <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 dark:bg-slate-900/40 border-b border-slate-200 dark:border-slate-700">
                <tr><th class="p-4">Jenis</th><th class="p-4">Pihak</th><th class="p-4">Jumlah</th><th class="p-4">Status</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                ${state.hutangpiutang.map(hp => `
                  <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30">
                    <td class="p-4 font-bold ${hp.jenis==='Piutang'?'text-emerald-500':'text-rose-500'}">${hp.jenis}</td>
                    <td class="p-4">${hp.pihak}</td>
                    <td class="p-4 font-bold">${formatRp(hp.jumlah)}</td>
                    <td class="p-4">
                      ${hp.status === 'Lunas' ? 
                        '<span class="text-emerald-500 font-bold text-xs">Lunas</span>' : 
                        `<button onclick="lunasiHP('${hp.id}', '${hp.noRef}')" class="px-3 py-1 bg-cyan-500 text-white text-xs rounded">Tandai Lunas</button>`}
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    window.lunasiHP = (id, ref) => {
      showConfirm('Konfirmasi Lunas', 'Tandai transaksi ini lunas?', async () => {
        await dbUpdate('hutangpiutang', id, { status: 'Lunas' });
        if(ref && ref.startsWith('SRV')) {
          await dbUpdate('servis', ref, { statusBayar: 'Lunas', sisa: 0 });
        }
      });
    };

    function renderLaporanView() {
      const fin = getFinancialMetrics();
      return `
        <div class="space-y-6">
          <h3 class="text-xl font-bold">Laporan Laba Rugi</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-6 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-4">
              <h4 class="font-bold border-b border-slate-200 dark:border-slate-700 pb-2">Rincian Pendapatan</h4>
              <div class="flex justify-between text-sm"><span class="text-slate-500">Omset</span><span class="font-bold">${formatRp(fin.totalOmset)}</span></div>
              <div class="flex justify-between text-sm"><span class="text-slate-500">HPP / Modal Barang</span><span class="font-bold text-rose-500">- ${formatRp(fin.totalOmset - fin.labaKotor)}</span></div>
              <div class="flex justify-between text-sm pt-2 border-t border-slate-200 dark:border-slate-700"><span class="font-bold">Laba Kotor</span><span class="font-bold text-emerald-500">${formatRp(fin.labaKotor)}</span></div>
            </div>
            <div class="p-6 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-4">
              <h4 class="font-bold border-b border-slate-200 dark:border-slate-700 pb-2">Rincian Laba Bersih</h4>
              <div class="flex justify-between text-sm"><span class="text-slate-500">Laba Kotor</span><span class="font-bold">${formatRp(fin.labaKotor)}</span></div>
              <div class="flex justify-between text-sm"><span class="text-slate-500">Beban Operasional Toko</span><span class="font-bold text-rose-500">- ${formatRp(fin.totalOperasional)}</span></div>
              <div class="flex justify-between text-sm pt-2 border-t border-slate-200 dark:border-slate-700"><span class="font-bold">Laba Bersih</span><span class="font-bold text-amber-500">${formatRp(fin.labaBersih)}</span></div>
            </div>
          </div>
          <div class="p-6 bg-cyan-50 dark:bg-cyan-900/20 rounded-2xl border border-cyan-200 dark:border-cyan-800 space-y-4 mt-6">
             <h4 class="font-bold text-cyan-800 dark:text-cyan-200">Saran Pembagian Laba (70:20:10)</h4>
             <div class="grid grid-cols-3 gap-4">
                <div class="p-3 bg-white dark:bg-slate-800 rounded-xl text-center"><span class="block text-[10px] uppercase font-bold text-slate-500">POS Utama (70%)</span><span class="font-black text-cyan-500">${formatRp(fin.pos70)}</span></div>
                <div class="p-3 bg-white dark:bg-slate-800 rounded-xl text-center"><span class="block text-[10px] uppercase font-bold text-slate-500">Stok & Invest (20%)</span><span class="font-black text-indigo-500">${formatRp(fin.pos20)}</span></div>
                <div class="p-3 bg-white dark:bg-slate-800 rounded-xl text-center"><span class="block text-[10px] uppercase font-bold text-slate-500">Cadangan (10%)</span><span class="font-black text-emerald-500">${formatRp(fin.pos10)}</span></div>
             </div>
          </div>
        </div>
      `;
    }

    window.hapusData = async (colName, id) => {
      showConfirm('Hapus Data', 'Yakin ingin menghapus data ini?', async () => {
        await dbDelete(colName, id);
      });
    };

    window.onload = () => {
      renderNav();
      initFirebaseSync();
    };

  </script>
</body>
</html>
