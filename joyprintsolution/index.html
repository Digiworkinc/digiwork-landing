    // 1. IndexedDB Helper (Kapasitas Besar, Ratusan MB / Gigabyte)
    function openIDB() {
      return new Promise((resolve) => {
        if (!window.indexedDB) {
          console.warn('IndexedDB tidak didukung pada browser ini, menggunakan fallback.');
          resolve(null);
          return;
        }
        try {
          const req = window.indexedDB.open(IDB_CONFIG.dbName, IDB_CONFIG.version);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(IDB_CONFIG.storeName)) {
              db.createObjectStore(IDB_CONFIG.storeName);
            }
          };
          req.onsuccess = (e) => resolve(e.target.result);
          req.onerror = (e) => {
            console.warn('IndexedDB open error:', e.target.error);
            resolve(null);
          };
        } catch (err) {
          console.warn('Gagal inisialisasi IndexedDB:', err);
          resolve(null);
        }
      });
    }

    async function idbSaveData(payload, key = IDB_CONFIG.key) {
      try {
        const db = await openIDB();
        if (!db) return false;
        return new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_CONFIG.storeName, 'readwrite');
          const store = tx.objectStore(IDB_CONFIG.storeName);
          const req = store.put(payload, key);
          req.onsuccess = () => resolve(true);
          req.onerror = (e) => reject(e.target.error);
        });
      } catch (err) {
        console.error('IndexedDB save error:', err);
        throw err;
      }
    }

    async function idbLoadData(key = IDB_CONFIG.key) {
      try {
        const db = await openIDB();
        if (!db) return null;
        return new Promise((resolve) => {
          const tx = db.transaction(IDB_CONFIG.storeName, 'readonly');
          const store = tx.objectStore(IDB_CONFIG.storeName);
          const req = store.get(key);
          req.onsuccess = (e) => resolve(e.target.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (err) {
        console.warn('IndexedDB load warning:', err);
        return null;
      }
    }

    // 2. Proteksi Anti-Eviction: Minta Browser Menjaga Penyimpanan Tetap Permanen
    async function requestPersistentStorage() {
      if (navigator.storage && navigator.storage.persist) {
        try {
          const isPersisted = await navigator.storage.persisted();
          if (!isPersisted) {
            const granted = await navigator.storage.persist();
            window.storageCapacityInfo.isPersisted = granted;
            return granted;
          }
          window.storageCapacityInfo.isPersisted = true;
          return true;
        } catch (e) {
          console.warn('Persistent storage request error:', e);
        }
      }
      return false;
    }

    // 3. Monitor Kapasitas Disk & Peringatan Jika Penuh
    async function updateStorageEstimateAndCheck() {
      if (navigator.storage && navigator.storage.estimate) {
        try {
          const estimate = await navigator.storage.estimate();
          const usage = estimate.usage || 0;
          const quota = estimate.quota || 0;
          const percent = quota > 0 ? (usage / quota) * 100 : 0;
          const usageMB = (usage / (1024 * 1024)).toFixed(1);
          const quotaGB = (quota / (1024 * 1024 * 1024)).toFixed(1);

          let isPersisted = false;
          if (navigator.storage.persisted) {
            isPersisted = await navigator.storage.persisted();
          }

          const wasFull = window.storageCapacityInfo.isFull;

          window.storageCapacityInfo = {
            usageBytes: usage,
            quotaBytes: quota,
            usageFormatted: `${usageMB} MB`,
            quotaFormatted: `${quotaGB} GB`,
            percentUsed: Math.round(percent * 10) / 10,
            isFull: percent >= 95,
            isNearFull: percent >= 85,
            isPersisted
          };

          // Jika penyimpanan mencapai 95% penuh, langsung berikan peringatan modal
          if (window.storageCapacityInfo.isFull && !wasFull) {
            showStorageFullModal('Kapasitas penyimpanan browser Anda telah mencapai 95%. Segera unduh file cadangan Excel.');
          }
        } catch (e) {
          console.warn('Storage estimate check error:', e);
        }
      }
    }

    // 4. Pembaca LocalStorage Sinkron Awal (Untuk Booting Cepat 0 ms)
    function loadLocalStorageData() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.warn('Gagal membaca localStorage:', e);
      }
      return null;
    }

    // 5. Penyimpan Data Permanen Dual-Engine (Anti-Hilang Berapa Banyak Pun Data)
    window.persistLocalStorageData = function () {
      persistData();
    };

    async function persistData() {
      const payload = {
        pelanggan: window.state.pelanggan || [],
        stok: window.state.stok || [],
        kategoriStok: window.state.kategoriStok || ['Tinta', 'Sparepart', 'Barang'],
        servis: window.state.servis || [],
        penjualan: window.state.penjualan || [],
        dtf: window.state.dtf || [],
        pembelian: window.state.pembelian || [],
        kas: window.state.kas || [],
        operasional: window.state.operasional || [],
        hutangpiutang: window.state.hutangpiutang || [],
        savedAt: new Date().toISOString()
      };

      // A. Simpan ke IndexedDB (Kapasitas Besar, Aman untuk Data Sangat Banyak)
      try {
        await idbSaveData(payload);
        // Simpan snapshot cadangan internal
        idbSaveData(payload, IDB_CONFIG.snapshotKey).catch(() => { });
      } catch (idbErr) {
        console.error('IndexedDB save error:', idbErr);
        if (idbErr && (idbErr.name === 'QuotaExceededError' || idbErr.code === 22)) {
          showStorageFullModal('Disk penyimpanan komputer / browser penuh! Data tidak dapat ditambah lagi sampai memori dibersihkan.');
        }
      }

      // B. Simpan ke LocalStorage sebagai mirror sinkron cepat
      try {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));
      } catch (lsErr) {
        if (lsErr && (lsErr.name === 'QuotaExceededError' || lsErr.code === 22)) {
          // Jika limit 5MB LocalStorage terlampaui, data tetap tersimpan aman di IndexedDB!
          console.warn('Batas kuota 5MB LocalStorage tercapai. Data tetap aman dan utuh disimpan di IndexedDB.');
        } else {
          console.warn('LocalStorage save warning:', lsErr);
        }
      }

      // C. Evaluasi penggunaan disk & beri peringatan jika mendekati batas
      updateStorageEstimateAndCheck();
    }

    async function initStorageAndSync() {
      try {

        if (idbData) {
          let hasNewer = false;
          const collections = ['pelanggan', 'stok', 'servis', 'penjualan', 'pembelian', 'kas', 'operasional', 'hutangpiutang'];
          collections.forEach(col => {
            if (Array.isArray(idbData[col]) && idbData[col].length > (window.state[col] || []).length) {
              window.state[col] = [...idbData[col]];
              hasNewer = true;
            }

            window.state.kategoriStok = [...idbData.kategoriStok];
          }
          if (hasNewer) {
            window.renderPage();
          }
        } else {
          // Pertama kali jalan, langsung amankan state saat ini ke IndexedDB
          await persistData();
        }
        await updateStorageEstimateAndCheck();
        updateStatusIndicator(isFirebaseActive, isFirebaseActive ? 'Firebase Connected' : 'IndexedDB Aktif • Anti-Hilang');
      } catch (err) {
        console.warn('Storage sync error:', err);

    // Initialize Firebase Realtime Sync with Graceful Local Fallback
    async function initFirebaseSync() {
      const isDemoConfig = !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('DemoKeyOnly');
      if (isDemoConfig) {
        isFirebaseActive = false;
        updateStatusIndicator(false, 'IndexedDB Aktif • Anti-Hilang');
        return;
      }

      try {
        firebaseApp = initializeApp(firebaseConfig);
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        isFirebaseActive = true;
        updateStatusIndicator(true, 'Firebase Connected');

        const collections = ['pelanggan', 'stok', 'servis', 'penjualan', 'pembelian', 'kas', 'operasional', 'hutangpiutang'];

        collections.forEach(colName => {
          const colRef = getColRef(colName);

          onSnapshot(colRef, async (snapshot) => {
            if (snapshot.empty && initialSeedData[colName]) {
              for (const item of initialSeedData[colName]) {
                await setDoc(getDocRef(colName, item.id), item);
              }
            } else if (!snapshot.empty) {
              const dataList = [];
              snapshot.forEach(docSnap => {
                dataList.push({ ...docSnap.data(), id: docSnap.id });
              });
              window.state[colName] = dataList;
              persistLocalStorageData();
              window.renderPage();
            }
          }, (err) => {
            console.warn(`Firestore listener warning for ${colName}:`, err);
          });
        });

      } catch (err) {
        console.warn("Firebase Auth/Firestore tidak aktif, menggunakan Local Storage:", err.message);
        isFirebaseActive = false;
        updateStatusIndicator(false, 'Local Storage Aktif');
      }
    }

    // Database Sync Helper Functions for CRUD Operations
    window.dbSave = async function (colName, docId, data) {
      const items = window.state[colName] || [];
      const idx = items.findIndex(i => i.id === docId);
      if (idx >= 0) {
        items[idx] = { ...items[idx], ...data, id: docId };
      } else {
        items.unshift({ ...data, id: docId });
      }
      window.state[colName] = [...items];
      persistLocalStorageData();
      window.renderPage();

      if (isFirebaseActive && db) {
        try {
          await setDoc(getDocRef(colName, docId), data);
        } catch (err) {
          console.error(`Error saving to Firebase ${colName}:`, err);
        }
      }
    };

      const items = window.state[colName] || [];
      const idx = items.findIndex(i => i.id === docId);
      if (idx >= 0) {
        items[idx] = { ...items[idx], ...data };
        window.state[colName] = [...items];
        persistLocalStorageData();
        window.renderPage();
      }

      if (isFirebaseActive && db) {
        try {
          await updateDoc(getDocRef(colName, docId), data);
        } catch (err) {
          console.error(`Error updating Firebase ${colName}:`, err);
        }
      }
    };

      window.state[colName] = (window.state[colName] || []).filter(i => i.id !== docId);
      persistLocalStorageData();
      window.renderPage();

      if (isFirebaseActive && db) {

    window.executeResetAllData = async function (e) {
      if (e) e.preventDefault();
      const passwordInput = document.getElementById('reset-auth-password');
      const errorEl = document.getElementById('reset-auth-error');
      const errorMsg = document.getElementById('reset-auth-error-msg');
      const enteredPassword = (passwordInput?.value || '').trim();

      const passwords = getRolePasswords();
      const requiredPassword = passwords.admin || 'admin123';

      if (enteredPassword !== requiredPassword) {
        if (errorEl) {
          errorEl.classList.remove('hidden');
          if (errorMsg) errorMsg.innerText = 'Password Admin salah! Silakan periksa kembali.';
        }
        if (passwordInput) {
          passwordInput.classList.add('border-rose-500', 'ring-2', 'ring-rose-500/20');
          passwordInput.select();
          passwordInput.focus();
        }
        return;
      }

      // 1. Auto Backup ke Excel sebelum reset bila dicentang
      const autoBackup = document.getElementById('reset-auto-backup')?.checked;
      if (autoBackup && typeof exportAllDataToExcel === 'function') {
        try {
          exportAllDataToExcel();
        } catch (bErr) {
          console.warn('Auto backup sebelum reset error:', bErr);
        }
      }

      // 2. Tentukan Scope Reset
      const scopeEl = document.querySelector('input[name="reset-scope"]:checked');
      const scope = scopeEl ? scopeEl.value : 'all';

      if (scope === 'all') {
        // Reset Total Bersih (Mulai dari Nol)
        state.stok = [];
        state.pelanggan = [];
        state.servis = [];
        state.penjualan = [];
        state.dtf = [];
        state.pembelian = [];
        state.kas = [];
        state.operasional = [];
        state.hutangpiutang = [];
        state.cart = [];
        state.kategoriStok = ['Tinta', 'Sparepart', 'Barang', 'Bahan DTF'];
      } else if (scope === 'transactions_only') {
        // Hanya reset transaksi keuangan & operasional, pertahankan master stok & pelanggan
        state.servis = [];
        state.penjualan = [];
        state.dtf = [];
        state.pembelian = [];
        state.kas = [];
        state.operasional = [];
        state.hutangpiutang = [];
        state.cart = [];
      } else if (scope === 'sample') {
        // Kembalikan ke seed data awal
        state.stok = JSON.parse(JSON.stringify(initialSeedData.stok || []));
        state.pelanggan = JSON.parse(JSON.stringify(initialSeedData.pelanggan || []));
        state.servis = JSON.parse(JSON.stringify(initialSeedData.servis || []));
        state.penjualan = JSON.parse(JSON.stringify(initialSeedData.penjualan || []));
        state.dtf = JSON.parse(JSON.stringify(initialSeedData.dtf || []));
        state.pembelian = JSON.parse(JSON.stringify(initialSeedData.pembelian || []));
        state.kas = JSON.parse(JSON.stringify(initialSeedData.kas || []));
        state.operasional = JSON.parse(JSON.stringify(initialSeedData.operasional || []));
        state.hutangpiutang = JSON.parse(JSON.stringify(initialSeedData.hutangpiutang || []));
        state.cart = [];
        state.kategoriStok = ['Tinta', 'Sparepart', 'Barang', 'Bahan DTF'];
      }

      // Reset filter dan state temporary
      state.stokFilterCat = 'all';
      state.stokSearchQuery = '';
      state.editingHargaId = null;
      state.dtfFilterStatus = 'all';
      state.dtfSearchQuery = '';
      state.posCustomer = {
        mode: 'new',
        selectedId: '',
        nama: '',
        telepon: '',
        alamat: '',
        saveToPelanggan: true,
        metode: 'Tunai',
        uangDiterima: 0
      };
      state.servisCustomer = {
        mode: 'existing',
        selectedId: '',
        nama: '',
        telepon: '',
        alamat: '',
        saveToPelanggan: true
      };

      // 3. Simpan state bersih ke LocalStorage dan IndexedDB (Permanen & Anti-Hilang)
      const payload = {
        pelanggan: state.pelanggan,
        stok: state.stok,
        kategoriStok: state.kategoriStok,
        servis: state.servis,
        penjualan: state.penjualan,
        dtf: state.dtf,
        pembelian: state.pembelian,
        kas: state.kas,
        operasional: state.operasional,
        hutangpiutang: state.hutangpiutang,
        isResetClean: true,
        savedAt: new Date().toISOString()
      };

      try {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));
      } catch (lsErr) {
        console.warn('LocalStorage reset save warning:', lsErr);
      }

      try {
        await idbSaveData(payload, IDB_CONFIG.key);
        await idbSaveData(payload, IDB_CONFIG.snapshotKey);
      } catch (idbErr) {
        console.warn('IndexedDB reset save warning:', idbErr);
      }

      // 4. Sinkronisasi dengan Firebase jika aktif
      if (isFirebaseActive && db) {
        try {
          const syncCol = async (colName, list) => {
            for (const item of list) {
              await setDoc(getDocRef(colName, item.id), item);
            }
          };
          await syncCol('stok', state.stok);
          await syncCol('pelanggan', state.pelanggan);
          await syncCol('servis', state.servis);
          await syncCol('penjualan', state.penjualan);
          await syncCol('dtf', state.dtf || []);
          await syncCol('pembelian', state.pembelian);
          await syncCol('kas', state.kas);
          await syncCol('operasional', state.operasional);
          await syncCol('hutangpiutang', state.hutangpiutang);
        } catch (fbErr) {
          console.warn('Firebase reset sync warning:', fbErr);
        }
      }

      closeModal();
      await updateStorageEstimateAndCheck();

      let toastMsg = 'Seluruh data berhasil di-reset total! Sistem siap untuk mulai dari awal.';
      if (scope === 'transactions_only') {
        toastMsg = 'Riwayat transaksi berhasil di-reset! Stok barang & pelanggan tetap disimpan.';
      } else if (scope === 'sample') {
        toastMsg = 'Data berhasil di-reset ke data sampel bawaan awal.';
      }
      showNotificationToast(toastMsg);
      renderPage();
    };

    window.getFinancialMetrics = function () {
      const omsetPenjualan = state.penjualan.reduce((acc, curr) => acc + curr.total, 0);
      const omsetServis = state.servis.reduce((acc, curr) => acc + (curr.bayar || 0), 0);
      const omsetDTF = (state.dtf || []).reduce((acc, curr) => acc + (curr.bayar || 0), 0);
      const totalOmset = omsetPenjualan + omsetServis + omsetDTF;

      const hppPenjualan = state.penjualan.reduce((acc, curr) => acc + (curr.hppTotal || 0), 0);
      const hppSparepartServis = state.servis.reduce((acc, s) => {
        const hppItems = (s.spareparts || []).reduce((sum, sp) => {
          const itemMaster = state.stok.find(b => b.id === sp.id);
          return sum + ((itemMaster ? itemMaster.hpp : sp.harga * 0.7) * sp.qty);
        }, 0);
        return acc + hppItems;
      }, 0);
      const hppDTF = (state.dtf || []).reduce((acc, curr) => {
        let modal = 0;
        if (typeof curr.totalModal === 'number') {
          modal = curr.totalModal;
        } else if (typeof curr.hppTotal === 'number') {
          modal = curr.hppTotal;
        } else if (curr.stokId) {
          const itemMaster = (state.stok || []).find(b => b.id === curr.stokId);
          const hpp = itemMaster ? (itemMaster.hpp || 0) : (curr.hppSatuan || 0);
          const qty = curr.qtyStok || curr.jumlah || 0;
          modal = Math.round(hpp * qty);
        }
        return acc + modal;
      }, 0);
      const totalHPP = hppPenjualan + hppSparepartServis + hppDTF;

      const labaKotor = totalOmset - totalHPP;
      const totalOperasional = state.operasional.reduce((acc, curr) => acc + curr.jumlah, 0);
      const labaBersih = Math.max(0, labaKotor - totalOperasional);

      const pos70 = labaBersih * 0.70;
      const pos20 = labaBersih * 0.20;
      const pos10 = labaBersih * 0.10;

      return {
        totalOmset,
        labaKotor,
        totalOperasional,
        labaBersih,
        pos70,
        pos20,
        pos10
      };
    };

    window.switchServisCustomerTab = function (mode) {
      if (!state.servisCustomer) {
        state.servisCustomer = { mode: 'existing', selectedId: '', nama: '', telepon: '', alamat: '', saveToPelanggan: true };
      }
      state.servisCustomer.mode = mode;
      const tabExisting = document.getElementById('srv-tab-existing');
      const tabNew = document.getElementById('srv-tab-new');
      const panelExisting = document.getElementById('srv-panel-existing');
      const panelNew = document.getElementById('srv-panel-new');

      if (!tabExisting || !tabNew || !panelExisting || !panelNew) return;

      if (mode === 'existing') {
        tabExisting.className = "px-2.5 py-1 rounded-md font-semibold transition bg-cyan-500 text-white shadow-sm";
        tabNew.className = "px-2.5 py-1 rounded-md font-semibold transition text-slate-600 dark:text-slate-300 hover:text-cyan-500";
        panelExisting.classList.remove('hidden');
        panelNew.classList.add('hidden');

        tabNew.className = "px-2.5 py-1 rounded-md font-semibold transition bg-cyan-500 text-white shadow-sm";
        tabExisting.className = "px-2.5 py-1 rounded-md font-semibold transition text-slate-600 dark:text-slate-300 hover:text-cyan-500";

        panelExisting.classList.add('hidden');

      lucide.createIcons();
    };

    window.pilihPelangganServis = function (id, switchTabIfNew) {
      if (!state.servisCustomer) {
        state.servisCustomer = { mode: 'existing', selectedId: '', nama: '', telepon: '', alamat: '', saveToPelanggan: true };
      }
      state.servisCustomer.selectedId = id;
      const cust = state.pelanggan.find(p => p.id === id);
      const previousServices = cust ? state.servis.filter(s => s.pelangganId === cust.id || (s.pelangganNama && s.pelangganNama.toLowerCase() === cust.nama.toLowerCase())) : [];

      const selectEl = document.getElementById('srv-cust-select');
      if (selectEl) selectEl.value = id;

      const previewEl = document.getElementById('srv-cust-preview');
      if (previewEl) {
        previewEl.innerHTML = renderServisCustomerPreviewHtml(cust, previousServices);
        lucide.createIcons();
      }

      if (switchTabIfNew) {
        switchServisCustomerTab('existing');
      }
    };

    window.deteksiPelangganServisLive = function () {
      const namaVal = (document.getElementById('srv-cust-nama')?.value || '').trim().toLowerCase();
      const telpVal = (document.getElementById('srv-cust-telp')?.value || '').trim().replace(/\D/g, '');

      const alertBox = document.getElementById('srv-detect-alert');
      const namaEl = document.getElementById('srv-detect-nama');
      const telpEl = document.getElementById('srv-detect-telp');
      const btnEl = document.getElementById('srv-detect-btn');

      if (!alertBox) return;

      if ((namaVal.length >= 3) || (telpVal.length >= 4)) {
        const found = state.pelanggan.find(p => {
          const pTelp = (p.telepon || '').replace(/\D/g, '');
          const matchTelp = telpVal.length >= 4 && pTelp && (pTelp.includes(telpVal) || telpVal.includes(pTelp));
          const matchNama = namaVal.length >= 3 && p.nama.toLowerCase().includes(namaVal);
          return matchTelp || matchNama;
        });

        if (found) {
          namaEl.innerText = found.nama;
          telpEl.innerText = found.telepon || 'Tanpa No. HP';
          btnEl.onclick = () => {
            pilihPelangganServis(found.id, true);
          };
          alertBox.classList.remove('hidden');
          lucide.createIcons();
          return;
        }
      }

      alertBox.classList.add('hidden');
    };

    window.simpanServisBaru = async function (e) {
      e.preventDefault();

      const mode = (state.servisCustomer && state.servisCustomer.mode) ? state.servisCustomer.mode : 'existing';
      let pelangganId = '';
      let pelangganNama = '';
      let pelangganTelepon = '-';
      let pelangganAlamat = '-';
      let isNewCustomerSaved = false;

      if (mode === 'existing') {
        const selectId = document.getElementById('srv-cust-select')?.value || (state.servisCustomer ? state.servisCustomer.selectedId : '');
        const pel = state.pelanggan.find(p => p.id === selectId);
        if (!pel) {
          alert('Silakan pilih pelanggan dari daftar terdaftar, atau beralih ke tab Pelanggan Baru!');
          return;
        }
        pelangganId = pel.id;
        pelangganNama = pel.nama;
        pelangganTelepon = pel.telepon || '-';
        pelangganAlamat = pel.alamat || '-';
      } else {
        // Mode Input Pelanggan Baru
        const namaInput = (document.getElementById('srv-cust-nama')?.value || '').trim();
        const telpInput = (document.getElementById('srv-cust-telp')?.value || '').trim();
        const alamatInput = (document.getElementById('srv-cust-alamat')?.value || '').trim();
        const saveToMaster = document.getElementById('srv-cust-save')?.checked;

        if (!namaInput) {
          alert('Nama pelanggan wajib diisi!');
          return;
        }

        // Cek apakah sudah ada di master data berdasarkan nomor telepon atau nama
        const cleanTelp = telpInput.replace(/\D/g, '');
        const existing = state.pelanggan.find(p => {
          const pTelp = (p.telepon || '').replace(/\D/g, '');
          return (cleanTelp && pTelp && cleanTelp === pTelp) || (p.nama.toLowerCase() === namaInput.toLowerCase());
        });

        if (existing) {
          pelangganId = existing.id;
          pelangganNama = existing.nama;
          let updated = false;
          if ((!existing.telepon || existing.telepon === '-') && telpInput) {
            existing.telepon = telpInput;
            updated = true;
          }
          if ((!existing.alamat || existing.alamat === '-') && alamatInput) {
            existing.alamat = alamatInput;
            updated = true;
          }
          if (updated) {
            await dbUpdate('pelanggan', existing.id, existing);
          }
          pelangganTelepon = existing.telepon || '-';
          pelangganAlamat = existing.alamat || '-';
        } else {
          pelangganId = `CUST-00${state.pelanggan.length + 1}`;
          pelangganNama = namaInput;
          pelangganTelepon = telpInput || '-';
          pelangganAlamat = alamatInput || '-';

          if (saveToMaster) {
            const newCust = {
              id: pelangganId,
              nama: pelangganNama,
              telepon: pelangganTelepon,
              alamat: pelangganAlamat
            };
            await dbSave('pelanggan', pelangganId, newCust);
            isNewCustomerSaved = true;
          }
        }
      }

      const isIndent = document.getElementById('srv-is-indent')?.checked ?? false;
      const printer = (document.getElementById('srv-printer')?.value || '').trim();
      const tanggal = document.getElementById('srv-tanggal')?.value || new Date().toISOString().split('T')[0];
      const keluhan = (document.getElementById('srv-keluhan')?.value || '').trim();
      const kelengkapan = (document.getElementById('srv-kelengkapan')?.value || 'Unit Printer Saja').trim();
      const biayaJasa = parseFloat(document.getElementById('srv-jasa')?.value) || 0;
      const dp = parseFloat(document.getElementById('srv-dp')?.value) || 0;
      const metodeDP = document.getElementById('srv-metode-dp')?.value || 'Tunai';

      const newId = `SRV-2026-00${state.servis.length + 1}`;
      const totalBiaya = biayaJasa;
      const sisa = Math.max(0, totalBiaya - dp);

      const newServis = {
        id: newId,
        tanggal,
        pelangganId,
        pelangganNama,
        pelangganTelepon,
        pelangganAlamat,
        kelengkapan,
        printer,
        keluhan,
        status: isIndent ? 'Menunggu Sparepart' : 'Diterima',
        isIndent,
        biayaJasa,
        spareparts: [],
        totalBiaya,
        statusBayar: sisa <= 0 ? 'Lunas' : (dp > 0 ? 'DP' : 'Belum Bayar'),
        bayar: dp,
        sisa
      };

      await dbSave('servis', newId, newServis);

      // Jika ada DP dan metode tunai, otomatis catat pemasukan kas toko
      if (dp > 0 && metodeDP === 'Tunai') {
        const kasId = `KAS-00${state.kas.length + 1}`;
        await dbSave('kas', kasId, {
          id: kasId,
          tanggal,
          tipe: 'Masuk',
          kategori: 'DP Servis Printer',
          keterangan: `DP Servis #${newId} (${pelangganNama} - ${printer})`,
          jumlah: dp
        });
      }

      // Jika ada sisa tagihan, otomatis catat piutang
      if (sisa > 0) {
        const hpId = `HP-00${state.hutangpiutang.length + 1}`;
        await dbSave('hutangpiutang', hpId, {
          id: hpId,
          jenis: 'Piutang',
          pihak: pelangganNama,
          noRef: newId,
          jumlah: sisa,
          jatuhTempo: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'Belum Lunas'
        });
      }

      if (state.servisCustomer) {
        state.servisCustomer.selectedId = pelangganId;
        state.servisCustomer.mode = 'existing';
      }

      closeModal();

      // Tampilkan popup konfirmasi sukses & opsi cetak nota tanda terima
      setTimeout(() => {
        openModal(`
          <div class="text-center space-y-4 py-3">
            <div class="w-14 h-14 bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center mx-auto shadow-inner">
              <i data-lucide="check-circle" class="w-8 h-8"></i>
            </div>
            <div>
              <span class="text-xs font-bold font-mono bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 px-2.5 py-1 rounded-full">Tiket: ${newId}</span>
              <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mt-2">Penerimaan Servis Berhasil Dicatat!</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                Unit <strong>${printer}</strong> milik <strong>${pelangganNama}</strong> telah masuk antrean servis.
              </p>
              ${isNewCustomerSaved ? `
                <div class="mt-2 text-xs p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 inline-block">
                  ✓ Pelanggan baru otomatis tersimpan ke <strong>Data Pelanggan (ID: ${pelangganId})</strong>
                </div>
              ` : `
                <div class="mt-2 text-xs p-2 rounded-lg bg-cyan-500/10 border border-cyan-500/20 text-cyan-600 dark:text-cyan-400 inline-block">
                  ✓ Menggunakan data pelanggan terdaftar: <strong>${pelangganNama} (${pelangganId})</strong>
                </div>
              `}
            </div>
            <div class="flex justify-center space-x-2 pt-2">
              <button onclick="cetakNotaServis('${newId}')" class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-600 text-white font-bold text-sm shadow-md shadow-cyan-500/25 flex items-center space-x-2 transition">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>Cetak Nota Tanda Terima</span>
              </button>
              <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 font-semibold text-sm hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                Selesai
              </button>
            </div>
          </div>
        `);
      }, 250);
    };

    window.updateStatusServis = async function (id, statusBaru) {
      await dbUpdate('servis', id, { status: statusBaru });
    };

    window.hapusServis = async function (id) {
      const s = (state.servis || []).find(item => item.id === id);
      if (!s) return;

      const confirmMsg = `Yakin ingin menghapus nota masuk servis #${id}?\n\n` +
        `Pelanggan: ${s.pelangganNama || '-'}\n` +
        `Unit Printer: ${s.printer || '-'}\n` +
        `Total Biaya: ${formatRp(s.totalBiaya || 0)}\n\n` +
        `Tindakan ini akan menghapus nota servis secara permanen dan mengembalikan stok sparepart yang terpasang (jika ada).`;

      if (!confirm(confirmMsg)) return;

      // 1. Kembalikan stok sparepart jika pernah digunakan pada servis ini
      if (Array.isArray(s.spareparts) && s.spareparts.length > 0) {
        for (const sp of s.spareparts) {
          const qty = parseInt(sp.qty) || 1;
          const stockItem = (state.stok || []).find(st => (sp.id && st.id === sp.id) || (sp.nama && st.nama.toLowerCase() === sp.nama.toLowerCase()));
          if (stockItem) {
            const curQty = typeof stockItem.jumlah === 'number' ? stockItem.jumlah : 0;
            await dbUpdate('stok', stockItem.id, { jumlah: curQty + qty });
          }
        }
      }

      // 2. Hapus catatan piutang terkait jika ada
      const relatedHP = (state.hutangpiutang || []).filter(hp => hp.noRef === id && hp.jenis === 'Piutang');
      for (const hp of relatedHP) {
        await dbDelete('hutangpiutang', hp.id);
      }

      // 3. Jika modal sedang terbuka untuk nota ini, tutup modal
      if (document.getElementById('modal-backdrop') && !document.getElementById('modal-backdrop').classList.contains('hidden')) {
        closeModal();
      }

      // 4. Hapus data servis dari database
      await dbDelete('servis', id);

      showNotificationToast(`Nota masuk servis #${id} (${s.printer}) berhasil dihapus.`);
    };

    window._currentEditServisId = null;
    window._currentEditServisParts = [];

      }
      return `
        <div class="border border-slate-200 dark:border-slate-700 rounded-lg overflow-hidden shadow-sm">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
              <tr>
                <th class="p-2">Nama Sparepart / Barang</th>
                <th class="p-2 w-16 text-center">Qty</th>

                <th class="p-2 w-28 text-right">Subtotal</th>

              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200 dark:divide-slate-700 bg-white dark:bg-slate-900/50">
              ${window._currentEditServisParts.map((sp, idx) => `
                <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
                  <td class="p-2 font-medium text-slate-800 dark:text-slate-200">
                    <div class="flex items-center space-x-1">
                      <span>${sp.nama}</span>
                      ${sp.isIndent ? '<span class="px-1.5 py-0.2 rounded text-[9px] font-bold bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-500/30">INDENT</span>' : ''}
                    </div>
                    ${sp.id ? `<span class="text-[10px] text-slate-400 font-mono">${sp.id}</span>` : ''}
                  </td>
                  <td class="p-2 text-center">
                    <input type="number" min="1" max="99" value="${sp.qty || 1}"
                      oninput="updateSparepartEditServisQty(${idx}, this.value)"
                      class="w-14 text-center px-1.5 py-1 text-xs font-semibold rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500" title="Ubah Qty" />
                  </td>

    window.onSelectSparepartEditServis = function (sel) {
      const hargaInput = document.getElementById('edit-srv-add-part-harga');
      if (!sel || !sel.value) {
        if (hargaInput) hargaInput.value = '';
        return;
      }
      const opt = sel.selectedOptions[0];
      const defaultHarga = parseFloat(opt.getAttribute('data-harga')) || 0;
      if (hargaInput) {
        hargaInput.value = defaultHarga;
      }
    };

    window.updateSparepartEditServisHarga = function (index, newHargaVal) {
      if (!window._currentEditServisParts || !window._currentEditServisParts[index]) return;
      const newHarga = Math.max(0, parseFloat(newHargaVal) || 0);
      window._currentEditServisParts[index].harga = newHarga;

      const subtotalEl = document.getElementById(`edit-srv-part-subtotal-${index}`);
      if (subtotalEl) {
        const qty = window._currentEditServisParts[index].qty || 1;
        subtotalEl.innerText = formatRp(newHarga * qty);
      }

      hitungEditServisLive(false);
    };

    window.updateSparepartEditServisQty = function (index, newQtyVal) {
      if (!window._currentEditServisParts || !window._currentEditServisParts[index]) return;
      const newQty = Math.max(1, parseInt(newQtyVal) || 1);
      window._currentEditServisParts[index].qty = newQty;

      const subtotalEl = document.getElementById(`edit-srv-part-subtotal-${index}`);
      if (subtotalEl) {
        const harga = window._currentEditServisParts[index].harga || 0;
        subtotalEl.innerText = formatRp(harga * newQty);
      }

      hitungEditServisLive(false);
    };

    window.tambahSparepartEditServis = function () {
      const select = document.getElementById('edit-srv-add-part-select');
      const qtyInput = document.getElementById('edit-srv-add-part-qty');
      const hargaInput = document.getElementById('edit-srv-add-part-harga');
      if (!select || !select.value) {
        alert('Silakan pilih sparepart dari daftar stok terlebih dahulu!');
        return;
      }
      const opt = select.selectedOptions[0];
      const partId = select.value;
      const nama = opt.getAttribute('data-nama') || opt.text;

      // Validasi sisa stok toko
      const stockItem = (state.stok || []).find(st => st.id === partId);
      let isIndentPart = false;
      if (stockItem && (stockItem.jumlah <= 0)) {
        const pesanIndent = confirm(`Peringatan: Stok fisik "${stockItem.nama}" di sistem tercatat 0 (Habis).\n\nApakah Anda ingin menambahkan sparepart ini sebagai part INDENT ke nota servis?`);
        if (!pesanIndent) {
          return;
        }
        isIndentPart = true;
        const srvIndentCheckbox = document.getElementById('edit-srv-is-indent');
        if (srvIndentCheckbox) srvIndentCheckbox.checked = true;
      }

      let harga = 0;
      if (hargaInput && hargaInput.value !== '') {

    window.hitungEditServisLive = function (isTotalManual) {
      const jasaInput = document.getElementById('edit-srv-jasa');
      const totalInput = document.getElementById('edit-srv-total');
      const bayarInput = document.getElementById('edit-srv-bayar');
      const sisaBox = document.getElementById('edit-srv-sisa-box');
      const sisaText = document.getElementById('edit-srv-sisa-text');
      const sisaNominal = document.getElementById('edit-srv-sisa-nominal');
      const statusBayarSelect = document.getElementById('edit-srv-status-bayar');
      const partsSumEl = document.getElementById('edit-srv-sparepart-sum');

      const jasa = parseFloat(jasaInput?.value) || 0;
      const sparepartsTotal = (window._currentEditServisParts || []).reduce((acc, p) => acc + ((p.harga || 0) * (p.qty || 1)), 0);

      if (partsSumEl) {
        partsSumEl.innerText = `Subtotal: ${formatRp(sparepartsTotal)}`;
      }

      let total = 0;
      if (isTotalManual) {
        total = parseFloat(totalInput?.value) || 0;
      } else {
        total = jasa + sparepartsTotal;
        if (totalInput) totalInput.value = total;
      }

      const bayar = parseFloat(bayarInput?.value) || 0;
      const sisa = Math.max(0, total - bayar);
      const isLunas = bayar >= total && total > 0;

      if (statusBayarSelect) {
        if (isLunas || (total === 0 && bayar === 0)) {
          statusBayarSelect.value = 'Lunas';
        } else if (bayar > 0) {
          statusBayarSelect.value = 'DP';
        } else {
          statusBayarSelect.value = 'Belum Bayar';
        }
      }

      if (sisaBox && sisaText && sisaNominal) {
        if (sisa <= 0) {
          const kembalian = bayar - total;
          sisaBox.className = "p-3 rounded-lg border text-xs flex items-center justify-between transition-all bg-emerald-500/10 border-emerald-500/30 text-emerald-700 dark:text-emerald-300";
          sisaText.innerHTML = kembalian > 0 ? `LUNAS (Kelebihan/Kembalian: ${formatRp(kembalian)})` : 'LUNAS - Tidak ada sisa tagihan';
          sisaNominal.innerText = 'Rp 0';
        } else {
          sisaBox.className = "p-3 rounded-lg border text-xs flex items-center justify-between transition-all bg-rose-500/10 border-rose-500/30 text-rose-700 dark:text-rose-300";
          sisaText.innerText = `Sisa Tagihan Belum Dibayar: ${formatRp(sisa)}`;
          sisaNominal.innerText = formatRp(sisa);
        }
      }
    };

    window.simpanEditBiayaServis = async function (e, id) {
      e.preventDefault();
      const s = state.servis.find(item => item.id === id);
      if (!s) {
        alert('Data servis tidak ditemukan!');
        return;
      }

      const biayaJasa = parseFloat(document.getElementById('edit-srv-jasa')?.value) || 0;
      const totalBiaya = parseFloat(document.getElementById('edit-srv-total')?.value) || 0;
      const bayarBaru = parseFloat(document.getElementById('edit-srv-bayar')?.value) || 0;
      const statusBayar = document.getElementById('edit-srv-status-bayar')?.value || (bayarBaru >= totalBiaya ? 'Lunas' : (bayarBaru > 0 ? 'DP' : 'Belum Bayar'));
      const statusServis = document.getElementById('edit-srv-status-pengerjaan')?.value || s.status;
      const metodeBayar = document.getElementById('edit-srv-metode')?.value || 'Tunai';
      const tanggalMasuk = document.getElementById('edit-srv-tanggal-masuk')?.value || s.tanggal || new Date().toISOString().split('T')[0];
      const tanggalUpdate = document.getElementById('edit-srv-tanggal')?.value || new Date().toISOString().split('T')[0];
      const catatan = (document.getElementById('edit-srv-catatan')?.value || '').trim();
      const catatKas = document.getElementById('edit-srv-catat-kas')?.checked;
      const isIndent = document.getElementById('edit-srv-is-indent')?.checked || (window._currentEditServisParts || []).some(p => p.isIndent);

      const bayarLama = typeof s.bayar === 'number' ? s.bayar : 0;
      const selisihBayar = bayarBaru - bayarLama;
      const sisa = Math.max(0, totalBiaya - bayarBaru);

      // =========================================================================
      // 1. SINKRONISASI STOK OTOMATIS: SERVIS PRINTER <-> MASTER STOK SPAREPART
      // =========================================================================
      const oldParts = Array.isArray(s.spareparts) ? s.spareparts : [];
      const newParts = Array.isArray(window._currentEditServisParts) ? window._currentEditServisParts : [];

      const findStockItem = (part) => {
        if (part.id) {
          const byId = (state.stok || []).find(st => st.id === part.id);
          if (byId) return byId;
        }
        if (part.nama) {
          const byNama = (state.stok || []).find(st => st.nama.toLowerCase() === part.nama.toLowerCase());
          if (byNama) return byNama;
        }
        return null;
      };

      const partUsageMap = new Map();
      for (const sp of oldParts) {
        const item = findStockItem(sp);
        if (item) {
          const prev = partUsageMap.get(item.id) || { stockItem: item, oldQty: 0, newQty: 0 };
          prev.oldQty += (parseInt(sp.qty) || 1);
          partUsageMap.set(item.id, prev);
        }
      }

      for (const sp of newParts) {
        const item = findStockItem(sp);
        if (item) {
          const prev = partUsageMap.get(item.id) || { stockItem: item, oldQty: 0, newQty: 0 };
          prev.newQty += (parseInt(sp.qty) || 1);
          partUsageMap.set(item.id, prev);
        }
      }

      let stockSyncDetails = [];
      for (const [stockId, data] of partUsageMap.entries()) {
        const delta = data.newQty - data.oldQty;
        if (delta !== 0) {
          const curQty = typeof data.stockItem.jumlah === 'number' ? data.stockItem.jumlah : 0;
          const newJumlah = Math.max(0, curQty - delta);
          await dbUpdate('stok', stockId, { jumlah: newJumlah });

          if (delta > 0) {
            stockSyncDetails.push(`${data.stockItem.nama} (-${delta})`);
          } else {
            stockSyncDetails.push(`${data.stockItem.nama} (+${Math.abs(delta)} kembali)`);
          }
        }
      }

      const updateData = {
        biayaJasa,
        totalBiaya,
        spareparts: [...(window._currentEditServisParts || [])],
        bayar: bayarBaru,
        sisa,
        statusBayar: sisa <= 0 ? 'Lunas' : statusBayar,
        status: statusServis,
        isIndent: !!isIndent,
        tanggal: tanggalMasuk,
        tanggalLunas: sisa <= 0 ? tanggalUpdate : (s.tanggalLunas || ''),
        catatanPembayaran: catatan
      };

      await dbUpdate('servis', id, updateData);

      // Jika ada penambahan uang bayar dan user memilih catat kas
      if (catatKas && selisihBayar > 0) {
        const kasId = `KAS-00${state.kas.length + 1}`;
        await dbSave('kas', kasId, {
          id: kasId,
          tanggal: tanggalUpdate,
          tipe: 'Masuk',
          kategori: sisa <= 0 ? 'Pelunasan Servis Printer' : 'Pembayaran Servis Printer',
          keterangan: `Bayar Servis #${id} (${s.pelangganNama} - ${s.printer}) via ${metodeBayar}`,
          jumlah: selisihBayar
        });
      }

      // Sinkronisasi Hutang Piutang
      const existingHP = state.hutangpiutang.find(hp => hp.noRef === id && hp.jenis === 'Piutang');
      if (existingHP) {
        if (sisa <= 0) {
          await dbUpdate('hutangpiutang', existingHP.id, {
            status: 'Lunas',
            jumlah: 0,
            totalTagihan: totalBiaya,
            terbayar: bayarBaru
          });
        } else {
          await dbUpdate('hutangpiutang', existingHP.id, {
            totalTagihan: totalBiaya,
            terbayar: bayarBaru,
            jumlah: sisa,
            status: 'Belum Lunas'
          });
        }
      } else if (sisa > 0) {
        const hpId = `HP-00${state.hutangpiutang.length + 1}`;
        await dbSave('hutangpiutang', hpId, {
          id: hpId,
          jenis: 'Piutang',
          pihak: s.pelangganNama,
          noRef: id,
          jumlah: sisa,
          jatuhTempo: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'Belum Lunas'
        });
      }

      closeModal();
      let toastMsg = `Total Biaya & Pembayaran servis #${id} berhasil diperbarui!`;
      if (stockSyncDetails.length > 0) {
        toastMsg += ` [Stok terhubung: ${stockSyncDetails.join(', ')}]`;
      }
      showNotificationToast(toastMsg);
    };

              <div class="space-y-2.5 max-h-[220px] overflow-y-auto pr-1">

                  <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/70 dark:border-slate-700/50">
                    <div class="flex-1 pr-2 min-w-0">
                      <div class="flex items-center space-x-1">
                        <h5 class="font-bold text-xs truncate text-slate-800 dark:text-slate-100">${item.nama}</h5>
                        ${item.isIndent ? '<span class="px-1.5 py-0.2 rounded text-[9px] font-bold bg-amber-500 text-white shrink-0">INDENT</span>' : ''}
                      </div>
                      <span class="text-[11px] text-cyan-600 dark:text-cyan-400 font-semibold">${formatRp(item.harga)}</span>
                    </div>
                    <div class="flex items-center space-x-1.5 shrink-0">
                      <button onclick="updateCartQty(${idx}, -1)" class="w-6 h-6 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 flex items-center justify-center font-bold text-xs transition">-</button>
                      <span class="text-xs font-bold w-6 text-center">${item.qty}</span>
                      <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 flex items-center justify-center font-bold text-xs transition">+</button>

            <!-- 3. PEMBAYARAN, NOMINAL & KEMBALIAN -->
            <div class="pt-3 border-t border-slate-200 dark:border-slate-700 space-y-3">
              <!-- Tanggal Transaksi & Metode Pembayaran -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <div>
                  <label class="text-[11px] font-semibold text-slate-500 dark:text-slate-400 block mb-1">Tanggal Transaksi:</label>

                <span class="text-2xl font-black text-cyan-600 dark:text-cyan-400">${formatRp(totalBelanja)}</span>
              </div>

                    <label class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Uang Diterima (Rp):</label>
                    <div class="flex items-center space-x-1">
                      <button type="button" onclick="setPosCashPreset('pas', ${totalBelanja})" class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 hover:bg-cyan-500 hover:text-white transition font-semibold">Uang Pas</button>
                      <button type="button" onclick="setPosCashPreset(50000, ${totalBelanja})" class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 hover:bg-cyan-500 hover:text-white transition font-semibold">50rb</button>
                      <button type="button" onclick="setPosCashPreset(100000, ${totalBelanja})" class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 hover:bg-cyan-500 hover:text-white transition font-semibold">100rb</button>
                      <button type="button" onclick="setPosCashPreset(200000, ${totalBelanja})" class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 hover:bg-cyan-500 hover:text-white transition font-semibold">200rb</button>
                    </div>
                  </div>
                  <input type="number" id="pos-cash-input" value="${uangBayar || ''}" oninput="updatePosUangDiterima(this.value, ${totalBelanja})" placeholder="0" class="w-full text-sm font-bold p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500" />
                  
                  <div class="flex justify-between items-center text-xs px-1">
                    <span class="text-slate-500 dark:text-slate-400 font-semibold">Kembalian:</span>
                    <span id="pos-kembalian-display" class="font-extrabold text-sm ${kembalian >= 0 ? 'text-emerald-500' : 'text-rose-500'}">
                      ${formatRp(Math.max(0, kembalian))} ${kembalian < 0 ? `(Kurang ${formatRp(Math.abs(kembalian))})` : ''}
                    </span>
                  </div>
                </div>
              ` : ''}

              <!-- Tombol Selesaikan & Cetak Struk -->
              <button type="button" onclick="prosesCheckoutPOS()" ${state.cart.length === 0 ? 'disabled' : ''} class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 disabled:opacity-50 text-white font-bold text-sm shadow-lg shadow-cyan-500/25 transition flex items-center justify-center space-x-2">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>Selesaikan & Cetak Struk</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderPOSGridItems() {
      const keyword = (document.getElementById('search-pos')?.value || '').toLowerCase();
      const cat = state.posFilterCat || 'all';

      const filtered = state.stok.filter(b => {
        const matchCat = cat === 'all' || b.kategori.toLowerCase() === cat.toLowerCase();
        const matchKey = !keyword || b.nama.toLowerCase().includes(keyword) || (b.kategori || '').toLowerCase().includes(keyword);
        return matchCat && matchKey;
      });

      if (filtered.length === 0) {
        return '<div class="col-span-full text-center py-12 text-slate-400 text-sm"><i data-lucide="package-search" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>Barang / sparepart tidak ditemukan.</div>';
      }

      return filtered.map(b => `
        <div onclick="addToCart('${b.id}')" class="p-3.5 rounded-2xl bg-white dark:bg-slate-800 border ${b.jumlah <= 0 ? 'border-amber-300 dark:border-amber-900/60 hover:border-amber-500 cursor-pointer shadow-sm' : 'border-slate-200 dark:border-slate-700 hover:border-cyan-500 cursor-pointer shadow-sm'} transition space-y-2 flex flex-col justify-between group">
          <div>
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 uppercase">${b.kategori}</span>
              ${b.jumlah <= 0
          ? '<span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-amber-500 text-white flex items-center space-x-0.5"><span>Habis (Indent)</span></span>'
          : (b.jumlah <= b.minStok ? '<span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-rose-500/10 text-rose-500">Stok Menipis</span>' : '')}
            </div>
            <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100 mt-1 line-clamp-2 group-hover:text-cyan-500 transition-colors">${b.nama}</h4>
          </div>
          <div class="pt-2 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
            <span class="text-xs text-slate-400 font-normal">Stok: <strong class="${b.jumlah <= 0 ? 'text-amber-600 dark:text-amber-400 font-bold' : (b.jumlah <= b.minStok ? 'text-rose-500 font-bold' : 'text-slate-600 dark:text-slate-300')}">${b.jumlah}</strong> ${b.satuan}</span>
            <span class="font-black text-cyan-600 dark:text-cyan-400 text-sm">${formatRp(b.harga)}</span>
          </div>
        </div>
      `).join('');
    }

    window.filterPOSCategory = function (cat) {
      state.posFilterCat = cat;
      renderPage();
    };

    window.filterPOSItems = function () {
      const grid = document.getElementById('pos-grid');
      if (grid) {
        grid.innerHTML = renderPOSGridItems();
        lucide.createIcons();
      }
    };

    window.setPosCustomerMode = function (mode) {
      state.posCustomer.mode = mode;
      if (mode === 'existing' && !state.posCustomer.selectedId && state.pelanggan.length > 0) {
        selectPosCustomer(state.pelanggan[0].id);
      } else {
        renderPage();
      }
    };

    window.selectPosCustomer = function (customerId) {
      const p = state.pelanggan.find(item => item.id === customerId);
      if (p) {
        state.posCustomer.selectedId = p.id;
        state.posCustomer.nama = p.nama;
        state.posCustomer.telepon = p.telepon;
        state.posCustomer.alamat = p.alamat;
      } else {
        state.posCustomer.selectedId = '';
        state.posCustomer.nama = '';
        state.posCustomer.telepon = '';
        state.posCustomer.alamat = '';
      }
      renderPage();
    };

    window.updatePosCustomerInput = function (field, val) {
      state.posCustomer[field] = val;
    };

    window.togglePosSaveCustomer = function (checked) {
      state.posCustomer.saveToPelanggan = checked;
    };

    window.quickSetUmumCustomer = function () {
      state.posCustomer.mode = 'new';
      state.posCustomer.selectedId = '';
      state.posCustomer.nama = 'Umum / Cash';
      state.posCustomer.telepon = '-';
      state.posCustomer.alamat = '-';
      state.posCustomer.saveToPelanggan = false;
      renderPage();
    };

    window.setPosPaymentMethod = function (method) {
      state.posCustomer.metode = method;
      renderPage();
    };

    window.updatePosUangDiterima = function (amount, total) {
      const bayar = parseFloat(amount) || 0;
      state.posCustomer.uangDiterima = bayar;
      const kembalian = bayar - total;
      const display = document.getElementById('pos-kembalian-display');
      if (display) {
        display.className = `font-extrabold text-sm ${kembalian >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        display.innerText = `${formatRp(Math.max(0, kembalian))} ${kembalian < 0 ? `(Kurang ${formatRp(Math.abs(kembalian))})` : ''}`;
      }
    };

    window.setPosCashPreset = function (preset, total) {
      let bayar = 0;
      if (preset === 'pas') {
        bayar = total;
      } else {
        bayar = preset;
      }
      state.posCustomer.uangDiterima = bayar;
      const cashInput = document.getElementById('pos-cash-input');
      if (cashInput) cashInput.value = bayar;
      updatePosUangDiterima(bayar, total);
    };

    window.togglePosIndentMode = function (checked) {
      state.posCustomer.isIndent = checked;
      if (checked) {
        state.cart.forEach(item => { item.isIndent = true; });
      }
      renderPage();
    };

    window.openTambahItemIndentPOSModal = function () {
      openModal(`
        <form onsubmit="simpanItemIndentKustomPOS(event)" class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-2.5">
            <h3 class="font-bold text-base text-slate-800 dark:text-slate-100 flex items-center space-x-2">
              <i data-lucide="clipboard-plus" class="w-5 h-5 text-amber-500"></i>
              <span>Tambah Barang Indent Kustom</span>
            </h3>
          </div>

          <p class="text-xs text-slate-500 dark:text-slate-400">
            Form ini digunakan untuk memasukkan pesanan barang/sparepart yang belum ada atau belum terdaftar di stok, agar tetap diterbitkan nota transaksi resmi bagi pelanggan.
          </p>

          <div class="space-y-3">
            <div>
              <label class="text-xs font-semibold text-slate-700 dark:text-slate-200 block mb-1">Nama Barang Indent *</label>
              <input type="text" id="custom-indent-nama" placeholder="Contoh: Printhead Epson L1800 Original / Tinta Sublim 1L" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-amber-500 font-semibold" required />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-slate-700 dark:text-slate-200 block mb-1">Harga Jual Nota (Rp) *</label>
                <div class="relative">
                  <span class="absolute left-3 top-2.5 text-xs text-amber-500 font-bold">Rp</span>
                  <input type="number" id="custom-indent-harga" min="0" step="500" placeholder="0" class="w-full pl-9 pr-3 py-2 text-xs font-bold rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-amber-500 text-right" required />
                </div>
              </div>

              <div>
                <label class="text-xs font-semibold text-slate-700 dark:text-slate-200 block mb-1">Estimasi HPP / Modal (Rp)</label>
                <div class="relative">
                  <span class="absolute left-3 top-2.5 text-xs text-slate-400 font-bold">Rp</span>
                  <input type="number" id="custom-indent-hpp" min="0" step="500" placeholder="0" class="w-full pl-9 pr-3 py-2 text-xs font-semibold rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 text-right" />
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-slate-700 dark:text-slate-200 block mb-1">Jumlah (Qty) *</label>
                <input type="number" id="custom-indent-qty" min="1" value="1" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-center font-bold focus:outline-none focus:border-amber-500" required />
              </div>
              <div>
                <label class="text-xs font-semibold text-slate-700 dark:text-slate-200 block mb-1">Satuan</label>
                <input type="text" id="custom-indent-satuan" value="Pcs" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-center focus:outline-none focus:border-amber-500" />
              </div>
            </div>

            <div>
              <label class="text-xs font-semibold text-slate-700 dark:text-slate-200 block mb-1">Catatan Pesanan Indent (Opsional)</label>
              <input type="text" id="custom-indent-catatan" placeholder="Contoh: Barang inden dari supplier, estimasi tiba 2-4 hari" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-amber-500" />
            </div>
          </div>

          <div class="pt-3 border-t border-slate-200 dark:border-slate-700 flex justify-end space-x-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-300 transition">Batal</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-600 text-white shadow-md shadow-amber-500/25 flex items-center space-x-1.5 transition">
              <i data-lucide="plus-circle" class="w-4 h-4"></i>
              <span>Tambahkan ke Keranjang Indent</span>
            </button>
          </div>
        </form>
      `);
      lucide.createIcons();
    };

    window.simpanItemIndentKustomPOS = function (e) {
      e.preventDefault();
      const nama = (document.getElementById('custom-indent-nama')?.value || '').trim();
      const harga = parseFloat(document.getElementById('custom-indent-harga')?.value) || 0;
      const hpp = parseFloat(document.getElementById('custom-indent-hpp')?.value) || 0;
      const qty = parseInt(document.getElementById('custom-indent-qty')?.value) || 1;
      const satuan = (document.getElementById('custom-indent-satuan')?.value || 'Pcs').trim();
      const catatan = (document.getElementById('custom-indent-catatan')?.value || '').trim();

      if (!nama) {
        alert('Nama barang indent wajib diisi!');
        return;
      }

      state.posCustomer.isIndent = true;
      state.cart.push({
        id: `INDENT-${Date.now()}`,
        nama,
        harga,
        hpp,
        qty,
        satuan,
        catatan,
        isIndent: true
      });

      const totalBelanja = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      if (state.posCustomer.metode === 'Tunai') {
        state.posCustomer.uangDiterima = totalBelanja;
      }

      closeModal();
      renderPage();
      showNotificationToast(`Barang indent "${nama}" (${qty} ${satuan}) ditambahkan ke keranjang!`);
    };

    window.addToCart = function (id) {
      const b = state.stok.find(item => item.id === id);
      if (!b) return;

      const isHabis = b.jumlah <= 0;
      let isIndentItem = false;

      if (isHabis) {
        if (!state.posCustomer.isIndent) {
          const pesanIndent = confirm(
            `Perhatian: Stok "${b.nama}" saat ini 0 (Habis).\n\n` +
            `Apakah Anda ingin memasukkan barang ini ke nota sebagai transaksi INDENT / PRE-ORDER?`
          );
          if (!pesanIndent) {
            return;
          }
          state.posCustomer.isIndent = true;
        }
        isIndentItem = true;
      } else if (state.posCustomer.isIndent) {
        isIndentItem = true;
      }

      const existing = state.cart.find(c => c.id === id);
      if (existing) {
        if (!existing.isIndent && !state.posCustomer.isIndent && existing.qty >= b.jumlah) {
          const jadikanIndent = confirm(
            `Stok toko hanya tersedia ${b.jumlah} ${b.satuan}.\n\n` +
            `Apakah penambahan pesanan ini ingin dijadikan transaksi INDENT agar tetap dibuatkan nota?`
          );
          if (jadikanIndent) {
            existing.qty += 1;
            existing.isIndent = true;
            state.posCustomer.isIndent = true;
          } else {
            return;
          }
        } else {
          existing.qty += 1;
        }
      } else {
        state.cart.push({
          id: b.id,
          nama: b.nama,
          harga: b.harga,
          hpp: b.hpp || 0,
          qty: 1,
          isIndent: isIndentItem
        });
      }

      // Default cash received to total if Tunai and was equal to previous total
      const totalBelanja = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      if (state.posCustomer.metode === 'Tunai' && (!state.posCustomer.uangDiterima || state.posCustomer.uangDiterima < totalBelanja)) {
        state.posCustomer.uangDiterima = totalBelanja;
      }
      renderPage();
    };

    window.updateCartQty = function (idx, change) {
      const item = state.cart[idx];
      if (!item) return;
      const stokItem = state.stok.find(b => b.id === item.id);
      item.qty += change;
      if (item.qty <= 0) {
        state.cart.splice(idx, 1);
      } else if (stokItem && !item.isIndent && !state.posCustomer.isIndent && item.qty > stokItem.jumlah) {
        const setIndent = confirm(
          `Jumlah ${item.qty} melebihi sisa stok fisik (${stokItem.jumlah} ${stokItem.satuan}).\n\n` +
          `Jadikan pesanan INDENT agar tetap dapat dibuatkan nota?`
        );
        if (setIndent) {
          item.isIndent = true;
          state.posCustomer.isIndent = true;
        } else {
          item.qty = Math.max(1, stokItem.jumlah);
        }
      }

      const totalBelanja = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      if (state.posCustomer.metode === 'Tunai') {
        state.posCustomer.uangDiterima = totalBelanja;
      }
      renderPage();
    };

    window.removeCartItem = function (idx) {
      state.cart.splice(idx, 1);
      const totalBelanja = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      if (state.posCustomer.metode === 'Tunai') {
        state.posCustomer.uangDiterima = totalBelanja;
      }
      renderPage();
    };

    window.prosesCheckoutPOS = async function () {
      if (state.cart.length === 0) {
        alert('Keranjang belanja masih kosong! Silakan pilih barang terlebih dahulu.');
        return;
      }

      const total = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const hppTotal = state.cart.reduce((sum, item) => sum + ((item.hpp || 0) * item.qty), 0);

      const cust = state.posCustomer || {};
      const namaPembeli = (cust.nama || '').trim() || 'Umum / Cash';
      const teleponPembeli = (cust.telepon || '').trim();
      const alamatPembeli = (cust.alamat || '').trim();
      const metode = cust.metode || 'Tunai';
      const uangDiterima = typeof cust.uangDiterima === 'number' && cust.uangDiterima > 0 ? cust.uangDiterima : total;

      if (metode === 'Tunai' && uangDiterima < total) {
        alert(`Uang diterima (${formatRp(uangDiterima)}) kurang dari total tagihan (${formatRp(total)})!`);
        return;
      }

      let pelangganId = cust.selectedId || null;
      let isNewlyCollected = false;

      // Fitur Koleksi Data Pembeli ke Master Data Pelanggan
      if (cust.saveToPelanggan && namaPembeli && namaPembeli.toLowerCase() !== 'umum / cash') {
        // Cek apakah pelanggan sudah ada berdasarkan no telepon atau nama
        const existing = state.pelanggan.find(p =>
          (teleponPembeli && p.telepon && p.telepon === teleponPembeli) ||
          p.nama.toLowerCase() === namaPembeli.toLowerCase()
        );

        if (existing) {
          pelangganId = existing.id;
          // Perbarui informasi telepon / alamat jika sebelumnya kosong
          let updated = false;
          if ((!existing.telepon || existing.telepon === '-') && teleponPembeli) {
            existing.telepon = teleponPembeli;
            updated = true;
          }
          if ((!existing.alamat || existing.alamat === '-') && alamatPembeli) {
            existing.alamat = alamatPembeli;
            updated = true;
          }
          if (updated) {
            await dbUpdate('pelanggan', existing.id, existing);
          }
        } else {
          // Buat pelanggan baru di Data Pelanggan
          pelangganId = `CUST-00${state.pelanggan.length + 1}`;
          const newCustomer = {
            id: pelangganId,
            nama: namaPembeli,
            telepon: teleponPembeli || '-',
            alamat: alamatPembeli || '-'
          };
          await dbSave('pelanggan', pelangganId, newCustomer);
          isNewlyCollected = true;
        }
      }

      const trxId = `TRX-2026-00${state.penjualan.length + 1}`;
      const kembalian = Math.max(0, uangDiterima - total);
      const tglTrx = document.getElementById('pos-tanggal-input')?.value || state.posCustomer.tanggal || new Date().toISOString().split('T')[0];
      const isIndentTrx = !!(state.posCustomer.isIndent || state.cart.some(i => i.isIndent));

      const newPenjualan = {
        id: trxId,
        tanggal: tglTrx,
        pelangganId: pelangganId || 'UMUM',
        pelangganNama: namaPembeli,
        pelangganTelepon: teleponPembeli || '-',
        pelangganAlamat: alamatPembeli || '-',
        items: state.cart.map(i => ({ ...i, subtotal: i.harga * i.qty })),
        total,
        hppTotal,
        labaKotor: total - hppTotal,
        metode,
        bayar: uangDiterima,
        kembalian,
        isIndent: isIndentTrx,
        statusIndent: isIndentTrx ? 'Menunggu Stok' : null
      };

      // Kurangi stok barang di database jika barang tersedia fisik
      for (const cartItem of state.cart) {
        const stokDoc = state.stok.find(s => s.id === cartItem.id);
        if (stokDoc) {
          const curQty = typeof stokDoc.jumlah === 'number' ? stokDoc.jumlah : 0;
          const newQty = Math.max(0, curQty - cartItem.qty);
          await dbUpdate('stok', cartItem.id, { jumlah: newQty });
        }
      }

      // Catat ke transaksi penjualan
      await dbSave('penjualan', trxId, newPenjualan);

      // Jika tunai, otomatis catat pemasukan di Kas Toko
      if (metode === 'Tunai') {
        const kasId = `KAS-00${state.kas.length + 1}`;
        await dbSave('kas', kasId, {
          id: kasId,
          tanggal: tglTrx,
          tipe: 'Masuk',
          kategori: isIndentTrx ? 'Penjualan Indent POS' : 'Penjualan POS',
          keterangan: `Penjualan Kasir #${trxId} (${namaPembeli}) ${isIndentTrx ? '[INDENT]' : ''}`,
          jumlah: total
        });
      }

      // Cetak struk penjualan
      cetakNotaPOS(newPenjualan);

      // Reset keranjang & form pembeli
      state.cart = [];
      state.posCustomer = {
        mode: 'new',
        selectedId: '',
        nama: '',
        telepon: '',
        alamat: '',
        saveToPelanggan: true,
        metode: 'Tunai',
        uangDiterima: 0,
        isIndent: false,
        tanggal: new Date().toISOString().split('T')[0]
      };

      renderPage();

      if (isNewlyCollected) {
        openModal(`
          <div class="text-center space-y-4 py-3">
            <div class="w-14 h-14 bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center mx-auto">
              <i data-lucide="check-circle" class="w-8 h-8"></i>
            </div>
            <div>
              <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Transaksi Berhasil & Pelanggan Terdaftar!</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                Transaksi <strong>#${trxId}</strong> selesai dicetak. Data pembeli <strong>"${namaPembeli}"</strong> telah otomatis dikumpulkan dan tersimpan ke <strong>Data Pelanggan (ID: ${pelangganId})</strong>.
              </p>
            </div>
            <div class="flex justify-center space-x-2 pt-2">
              <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-cyan-500 text-white font-bold text-sm shadow-md shadow-cyan-500/20">
                Selesai / Transaksi Baru
              </button>
              <button onclick="closeModal(); navigateTo('pelanggan');" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 font-semibold text-sm hover:bg-slate-200">
                Lihat Data Pelanggan
              </button>
            </div>
          </div>
        `);
      }
    };
