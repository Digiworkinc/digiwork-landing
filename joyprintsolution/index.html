              <button onclick="filterDTFStatus('all')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition shrink-0 ${filter === 'all' ? 'bg-cyan-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">Semua</button>
              <button onclick="filterDTFStatus('Antrian')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition shrink-0 ${filter === 'Antrian' ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">🟡 Antrian</button>
              <button onclick="filterDTFStatus('Sedang Cetak')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition shrink-0 ${filter === 'Sedang Cetak' ? 'bg-blue-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">🔵 Sedang Cetak</button>
              <button onclick="filterDTFStatus('Selesai')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition shrink-0 ${filter === 'Selesai' ? 'bg-emerald-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">🟢 Selesai</button>
              <button onclick="filterDTFStatus('Diambil')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition shrink-0 ${filter === 'Diambil' ? 'bg-purple-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">✅ Diambil</button>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full md:w-72">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
              <input type="text" id="dtf-search-input" value="${state.dtfSearchQuery || ''}" onkeyup="searchDTFLive(this.value)" placeholder="Cari pemesan / no order / kode barang..." class="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500 font-semibold" />
            </div>
          </div>

          <!-- Table Container -->
          <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 dark:bg-slate-750 text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-700 font-semibold uppercase tracking-wider text-[11px]">
                  <tr>
                    <th class="p-4">No. Order</th>
                    <th class="p-4">Tanggal</th>
                    <th class="p-4">Pemesan</th>
                    <th class="p-4">Jasa Print & Bahan Stok</th>
                    <th class="p-4 text-center">Ukuran / Qty</th>
                    <th class="p-4 text-right">Harga Satuan</th>
                    <th class="p-4 text-right">Total Biaya</th>
                    <th class="p-4">Status Bayar</th>
                    <th class="p-4">Status Cetak</th>
                    <th class="p-4 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                  ${filtered.length === 0 ? `
                    <tr>
                      <td colspan="10" class="p-8 text-center text-slate-400">
                        <i data-lucide="layers" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                        Belum ada order cetak film DTF ditemukan.
                      </td>
                    </tr>
                  ` : filtered.map(d => {
        const cleanPhone = (d.pelangganTelepon || '').replace(/\D/g, '');
        const waLink = cleanPhone && cleanPhone !== '-' ? `https://wa.me/${cleanPhone.startsWith('0') ? '62' + cleanPhone.slice(1) : cleanPhone}?text=${encodeURIComponent(`Halo ${d.pelangganNama}, update pesanan cetak film DTF (#${d.id}) di Joy Print Solution: Status saat ini "${d.statusPengerjaan}".`)}` : null;

        const satuanLabel = d.satuan === 'cm' ? 'cm' : 'meter';
        const formattedQty = typeof d.jumlah === 'number' ? d.jumlah.toLocaleString('id-ID', { maximumFractionDigits: 2 }) : d.jumlah;
        const totalModalVal = Number(d.totalModal) || 0;
        const labaKotorVal = (Number(d.totalBiaya) || 0) - totalModalVal;

        return `
                      <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                        <td class="p-4 font-mono font-bold text-cyan-500 whitespace-nowrap">
                          ${d.id}
                          ${d.isIndent ? '<span class="ml-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-500/30">INDENT</span>' : ''}
                        </td>
                        <td class="p-4 whitespace-nowrap text-slate-500 dark:text-slate-400 font-mono text-[11px]">
                          <i data-lucide="calendar" class="w-3 h-3 inline mr-1 text-cyan-500"></i>${d.tanggal || '-'}
                        </td>
                        <td class="p-4 whitespace-nowrap">
                          <div class="font-bold text-slate-800 dark:text-slate-100">${d.pelangganNama}</div>
                          ${waLink ? `
                            <a href="${waLink}" target="_blank" class="inline-flex items-center space-x-1 text-[11px] text-emerald-500 hover:underline mt-0.5" title="Chat WhatsApp">
                              <i data-lucide="message-circle" class="w-3 h-3"></i>
                              <span>${d.pelangganTelepon}</span>
                            </a>
                          ` : (d.pelangganTelepon ? `<span class="text-[11px] text-slate-400">${d.pelangganTelepon}</span>` : '')}
                        </td>
                        <td class="p-4 max-w-xs">
                          ${Array.isArray(d.items) && d.items.length > 1 ? `
                            <div class="space-y-1">
                              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 border border-cyan-500/20">
                                📑 ${d.items.length} Item Film
                              </span>
                              <div class="space-y-0.5">
                                ${d.items.map(it => `
                                  <div class="text-[11px] text-slate-700 dark:text-slate-200 flex items-center justify-between gap-1">
                                    <span class="truncate font-medium">• ${it.nama}</span>
                                    <span class="font-mono font-bold text-slate-500 text-[10px] shrink-0">${it.jumlah} ${it.satuan}</span>
                                  </div>
                                `).join('')}
                              </div>
                            </div>
                          ` : `
                            <span class="font-semibold text-slate-800 dark:text-slate-100 block">${d.jasaPrint}</span>
                            ${d.stokId ? `
                              <div class="mt-1 flex items-center space-x-1.5 flex-wrap gap-1">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-mono font-bold bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20" title="Kode Barang dari Stok Toko">
                                  📦 ${d.stokId}
                                </span>
                                <span class="text-[11px] text-slate-600 dark:text-slate-300 font-medium truncate max-w-[160px]" title="${d.stokNama || ''}">
                                ${d.stokNama || 'Bahan Stok'}
                                </span>
                                <span class="text-[10px] text-slate-400">(${d.qtyStok || d.jumlah} ${d.stokSatuan || d.satuan})</span>
                              </div>
                            ` : ''}
                          `}
                          ${d.catatan ? `<span class="text-[11px] text-slate-400 block truncate mt-0.5" title="${d.catatan}">${d.catatan}</span>` : ''}
                        </td>
                        <td class="p-4 text-center whitespace-nowrap">
                          <span class="px-2.5 py-1 rounded-lg text-xs font-black bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 border border-cyan-500/20">
                            ${formattedQty} ${satuanLabel}
                          </span>
                        </td>
                        <td class="p-4 text-right font-mono font-medium text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          ${formatRp(d.hargaSatuan)} / ${satuanLabel}
                        </td>
                        <td class="p-4 text-right whitespace-nowrap font-mono">
                          <span class="font-black text-slate-800 dark:text-slate-100 text-sm block">${formatRp(d.totalBiaya)}</span>
                        </td>
                        <td class="p-4 whitespace-nowrap">
                          <span class="px-2 py-0.5 rounded text-[10px] font-bold ${d.statusBayar === 'Lunas' ? 'bg-emerald-500/10 text-emerald-500 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-500 border border-rose-500/20'}">
                            ${d.statusBayar || 'Belum Lunas'}
                          </span>
                          <div class="text-[10px] text-slate-400 mt-0.5">
                            Bayar: <strong class="text-slate-700 dark:text-slate-200">${formatRp(d.bayar || 0)}</strong>
                            ${(d.sisa || 0) > 0 ? `<span class="text-rose-500 font-bold block">Sisa: ${formatRp(d.sisa)}</span>` : ''}
                          </div>
                        </td>
                        <td class="p-4 whitespace-nowrap">
                          <select onchange="updateStatusDTF('${d.id}', this.value)" class="text-xs px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-700 font-semibold focus:outline-none">
                            <option value="Antrian" ${d.statusPengerjaan === 'Antrian' ? 'selected' : ''}>🟡 Antrian</option>
                            <option value="Sedang Cetak" ${d.statusPengerjaan === 'Sedang Cetak' ? 'selected' : ''}>🔵 Sedang Cetak</option>
                            <option value="Selesai" ${d.statusPengerjaan === 'Selesai' ? 'selected' : ''}>🟢 Selesai (Siap Ambil)</option>
                            <option value="Diambil" ${d.statusPengerjaan === 'Diambil' ? 'selected' : ''}>✅ Sudah Diambil</option>
                          </select>
                        </td>
                        <td class="p-4 text-center whitespace-nowrap space-x-1">
                          <button onclick="cetakNotaDTF('${d.id}')" title="Cetak Nota Order DTF" class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-cyan-500 hover:text-white transition">
                            <i data-lucide="printer" class="w-3.5 h-3.5"></i>
                          </button>
                          <button onclick="openEditDTFModal('${d.id}')" title="Edit Order DTF" class="p-1.5 rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400 hover:bg-amber-500 hover:text-white transition">
                            <i data-lucide="edit" class="w-3.5 h-3.5"></i>
                          </button>
                          <button onclick="hapusOrderDTF('${d.id}')" title="Hapus Order DTF" class="p-1.5 rounded-lg bg-rose-500/10 text-rose-500 hover:bg-rose-500 hover:text-white transition">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        </td>
                      </tr>
                    `;
      }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    };

    window.filterDTFStatus = function (status) {
      state.dtfFilterStatus = status;
      renderPage();
    };

    window.searchDTFLive = function (val) {
      state.dtfSearchQuery = val;
      renderPage();
    };

    window._currentDtfItems = [];

    window.toggleDtfCustomerMode = function (mode) {
      const selectBox = document.getElementById('dtf-cust-select-container');
      const namaInput = document.getElementById('dtf-cust-nama');
      const telpInput = document.getElementById('dtf-cust-telp');
      const selectCust = document.getElementById('dtf-cust-select');

      if (mode === 'lama') {
        if (selectBox) selectBox.classList.remove('hidden');
        if (selectCust && selectCust.value) {
          onSelectDtfExistingCustomer(selectCust);
        }
      } else {
        if (selectBox) selectBox.classList.add('hidden');
        if (selectCust) selectCust.value = '';
        if (namaInput) {
          namaInput.value = '';
          namaInput.readOnly = false;
        }
        if (telpInput) {
          telpInput.value = '';
          telpInput.readOnly = false;
        }
      }
    };

    window.onSelectDtfExistingCustomer = function (el) {
      const opt = el.options[el.selectedIndex];
      const namaInput = document.getElementById('dtf-cust-nama');
      const telpInput = document.getElementById('dtf-cust-telp');
      if (opt && opt.value) {
        const found = (state.pelanggan || []).find(p => p.id === opt.value);
        if (found) {
          if (namaInput) {
            namaInput.value = found.nama;
            namaInput.readOnly = true;
          }
          if (telpInput) {
            telpInput.value = found.telepon || '';
            telpInput.readOnly = true;
          }
        }
      } else {
        if (namaInput) {
          namaInput.value = '';
          namaInput.readOnly = false;
        }
        if (telpInput) {
          telpInput.value = '';
          telpInput.readOnly = false;
        }
      }
    };

    window.buildDtfStokOptions = function (selectedId = '') {
      const stokList = (state.stok || []).filter(s =>
        (s.kategori && s.kategori.toLowerCase().includes('dtf')) ||
        (s.nama && s.nama.toLowerCase().includes('dtf')) ||
        (s.nama && s.nama.toLowerCase().includes('film'))
      );
      const otherList = (state.stok || []).filter(s => !stokList.includes(s));

      let html = '<option value="__custom__">⚙️ Jasa Cetak Khusus (Tanpa Potong Stok)</option>';
      if (stokList.length > 0) {
        html += '<optgroup label="Bahan Film & DTF Tersedia">';
        html += stokList.map(s => `
          <option value="${s.id}" data-nama="${s.nama}" data-harga="${s.harga || 55000}" data-hpp="${s.hpp || 0}" data-satuan="${s.satuan || 'meter'}" data-stok="${s.jumlah || 0}" ${s.id === selectedId ? 'selected' : ''}>
            ${s.nama} (${s.id}) - Stok: ${s.jumlah || 0} ${s.satuan || 'm'} [${formatRp(s.harga || 55000)}]
          </option>
        `).join('');
        html += '</optgroup>';
      }
      if (otherList.length > 0) {
        html += '<optgroup label="Stok Lainnya">';
        html += otherList.map(s => `
          <option value="${s.id}" data-nama="${s.nama}" data-harga="${s.harga || 0}" data-hpp="${s.hpp || 0}" data-satuan="${s.satuan || 'pcs'}" data-stok="${s.jumlah || 0}" ${s.id === selectedId ? 'selected' : ''}>
            ${s.nama} (${s.id}) - Stok: ${s.jumlah || 0}
          </option>
        `).join('');
        html += '</optgroup>';
      }
      return html;
    };

    window.onSelectDtfAddItem = function (selectEl, isEdit = false) {
      const prefix = isEdit ? 'dtf-edit-add' : 'dtf-add';
      const val = selectEl.value;
      const customBox = document.getElementById(`${prefix}-custom-box`);
      const stockBadge = document.getElementById(`${prefix}-stock-badge`);
      const hppHidden = document.getElementById(`${prefix}-hpp-hidden`);
      const hargaInput = document.getElementById(`${prefix}-harga`);
      const satuanSelect = document.getElementById(`${prefix}-satuan`);

      if (val === '__custom__') {
        if (customBox) customBox.classList.remove('hidden');
        if (stockBadge) stockBadge.classList.add('hidden');
        if (hppHidden) hppHidden.value = 0;
        updateDtfAddPreview(isEdit);
        return;
      }

      if (customBox) customBox.classList.add('hidden');
      const item = (state.stok || []).find(s => s.id === val);
      if (item) {
        if (hppHidden) hppHidden.value = item.hpp || 0;
        if (hargaInput && (!hargaInput.value || hargaInput.value === '0' || hargaInput.value === '55000')) {
          hargaInput.value = item.harga || 55000;
        }
        if (satuanSelect && item.satuan) {
          const sLower = item.satuan.toLowerCase();
          if (sLower.includes('meter') || sLower === 'm') satuanSelect.value = 'meter';
          else if (sLower.includes('cm')) satuanSelect.value = 'cm';
          else if (sLower.includes('roll')) satuanSelect.value = 'roll';
          else satuanSelect.value = 'pcs';
          onDtfAddSatuanChange(satuanSelect.value, isEdit);
        }

        const isLow = (item.jumlah || 0) <= (item.minStok || 0);
        if (stockBadge) {
          stockBadge.classList.remove('hidden');
          stockBadge.innerHTML = `
            <div class="p-2.5 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-xs flex flex-col sm:flex-row justify-between items-start sm:items-center gap-1.5">
              <div class="flex items-center space-x-2">
                <span class="px-2 py-0.5 rounded-md font-mono font-bold text-xs bg-cyan-500/20 text-cyan-700 dark:text-cyan-300">📦 ${item.id}</span>
                <span class="font-bold text-slate-800 dark:text-slate-100">${item.nama}</span>
                <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-semibold">${item.kategori || 'Bahan'}</span>
              </div>
              <div class="flex items-center space-x-3 text-[11px]">
                <span class="text-slate-500">Stok Tersedia: <strong class="${isLow ? 'text-rose-500 font-black' : 'text-emerald-500 font-bold'}">${item.jumlah || 0} ${item.satuan || 'meter'}</strong></span>
              </div>
            </div>
          `;
        }
      }
      updateDtfAddPreview(isEdit);
      updateGrandTotalDtf(isEdit);
    };

    window.onDtfAddSatuanChange = function (satuan, isEdit = false) {
      const prefix = isEdit ? 'dtf-edit-add' : 'dtf-add';
      const badge = document.getElementById(`${prefix}-satuan-badge`);
      const chips = document.getElementById(`${prefix}-preset-chips`);
      const hargaInput = document.getElementById(`${prefix}-harga`);

      if (satuan === 'meter') {
        if (badge) badge.innerText = 'm';
        if (chips) {
          chips.innerHTML = `
            <button type="button" onclick="setDtfUkuranPreset(0.5, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">0.5 m</button>
            <button type="button" onclick="setDtfUkuranPreset(1.0, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">1.0 m</button>
            <button type="button" onclick="setDtfUkuranPreset(1.3, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">1.3 m</button>
            <button type="button" onclick="setDtfUkuranPreset(2.0, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">2.0 m</button>
            <button type="button" onclick="setDtfUkuranPreset(3.2, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">3.2 m</button>
            <button type="button" onclick="setDtfUkuranPreset(5.0, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">5.0 m</button>
          `;
        }
        if (hargaInput && (hargaInput.value === '550' || hargaInput.value === '500')) {
          hargaInput.value = '55000';
        }
      } else if (satuan === 'cm') {
        if (badge) badge.innerText = 'cm';
        if (chips) {
          chips.innerHTML = `
            <button type="button" onclick="setDtfUkuranPreset(50, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">50 cm</button>
            <button type="button" onclick="setDtfUkuranPreset(100, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">100 cm</button>
            <button type="button" onclick="setDtfUkuranPreset(130, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">130 cm</button>
            <button type="button" onclick="setDtfUkuranPreset(200, ${isEdit})" class="px-1.5 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-[10px] font-semibold hover:bg-cyan-500 hover:text-white transition">200 cm</button>
          `;
        }
        if (hargaInput && (hargaInput.value === '55000' || hargaInput.value === '50000')) {
          hargaInput.value = '550';
        }
      } else {
        if (badge) badge.innerText = satuan;
        if (chips) chips.innerHTML = '';
      }
      updateDtfAddPreview(isEdit);
      updateGrandTotalDtf(isEdit);
    };

    window.setDtfUkuranPreset = function (val, isEdit = false) {
      const prefix = isEdit ? 'dtf-edit-add' : 'dtf-add';
      const input = document.getElementById(`${prefix}-jumlah`);
      if (input) {
        input.value = val;
        updateDtfAddPreview(isEdit);
        updateGrandTotalDtf(isEdit);
      }
    };
    function renderDtfItemsTableHtml(items, isEdit = false) {
      if (!items || items.length === 0) {
        return `
          <div class="p-4 text-center text-xs text-slate-400 italic bg-slate-900 rounded-xl border border-dashed border-slate-700/80">
            Belum ada item film. Tambahkan minimal 1 item film menggunakan form di bawah.
          </div>
        `;
      }

      const totalQty = items.reduce((sum, i) => sum + (parseFloat(i.jumlah) || 0), 0);
      const totalOmset = items.reduce((sum, i) => sum + (i.subtotal || 0), 0);
      const totalModal = items.reduce((sum, i) => sum + (i.subtotalModal || 0), 0);

      return `
        <div class="border border-slate-700/80 rounded-xl overflow-hidden bg-slate-900 shadow-md">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-950 text-cyan-400 font-bold border-b border-slate-800 text-[11px] uppercase tracking-wider">
              <tr>
                <th class="p-2.5">Bahan / Film DTF</th>
                <th class="p-2.5 text-center w-28">Ukuran / Qty</th>
                <th class="p-2.5 text-right w-28">Harga Satuan</th>
                <th class="p-2.5 text-right w-32">Subtotal</th>
                <th class="p-2.5 text-center w-10"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800 bg-slate-900 text-slate-100 font-medium">
              ${items.map((it, idx) => `
                <tr class="hover:bg-slate-800/60 transition">
                  <td class="p-2.5 font-semibold text-slate-100">
                    <div class="flex items-center space-x-1.5 flex-wrap">

    window.updateDtfAddPreview = function (isEdit = false) {
      const prefix = isEdit ? 'dtf-edit-add' : 'dtf-add';
      const jumlahInput = document.getElementById(`${prefix}-jumlah`);
      const hargaInput = document.getElementById(`${prefix}-harga`);
      const hppHidden = document.getElementById(`${prefix}-hpp-hidden`);
      const selectEl = document.getElementById(`${prefix}-item-select`);
      const warningEl = document.getElementById(`${prefix}-stock-warning`);
      const warningText = document.getElementById(`${prefix}-stock-warning-text`);

      const jumlah = parseFloat(jumlahInput?.value) || 0;
      const harga = parseFloat(hargaInput?.value) || 0;
      const hpp = parseFloat(hppHidden?.value) || 0;

      const subtotal = Math.round(jumlah * harga);
      const subtotalModal = Math.round(jumlah * hpp);
      const laba = subtotal - subtotalModal;

      const subtotalEl = document.getElementById(`${prefix}-subtotal-preview`);
      const modalEl = document.getElementById(`${prefix}-modal-preview`);
      const labaEl = document.getElementById(`${prefix}-laba-preview`);

      if (subtotalEl) subtotalEl.innerText = formatRp(subtotal);
      if (modalEl) modalEl.innerText = formatRp(subtotalModal);
      if (labaEl) {
        labaEl.innerText = formatRp(laba);
        labaEl.className = `font-mono font-bold ${laba >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
      }

      // Deteksi & Peringatan Jika Pesanan Melebihi Sisa Stok Fisik
      if (selectEl && selectEl.value !== '__custom__') {
        const stokId = selectEl.value;
        const itemStok = (state.stok || []).find(s => s.id === stokId);
        const sisaStok = itemStok ? (parseFloat(itemStok.jumlah) || 0) : 0;
        const sudahDiKeranjang = (window._currentDtfItems || [])
          .filter(i => i.stokId === stokId)
          .reduce((sum, i) => sum + (parseFloat(i.jumlah) || 0), 0);
        const totalDiminta = sudahDiKeranjang + jumlah;

        if (totalDiminta > sisaStok) {
          if (warningEl && warningText) {
            const satuan = document.getElementById(`${prefix}-satuan`)?.value || itemStok?.satuan || 'meter';
            const selisih = (totalDiminta - sisaStok).toLocaleString('id-ID', { maximumFractionDigits: 2 });
            warningText.innerHTML = `⚠️ <strong>Peringatan Stok Kurang:</strong> Pesanan (${totalDiminta} ${satuan}${sudahDiKeranjang > 0 ? ` [${sudahDiKeranjang} di daftar + ${jumlah} baru]` : ''}) MELEBIHI sisa stok fisik (<strong>${sisaStok} ${satuan}</strong>). Kurang ${selisih} ${satuan}!`;
            warningEl.classList.remove('hidden');
          }
          if (jumlahInput) {
            jumlahInput.classList.add('border-amber-500', 'bg-amber-500/10', 'text-amber-600', 'dark:text-amber-400');
            jumlahInput.classList.remove('border-cyan-500/50');
          }
        } else {
          if (warningEl) warningEl.classList.add('hidden');
          if (jumlahInput) {
            jumlahInput.classList.remove('border-amber-500', 'bg-amber-500/10', 'text-amber-600', 'dark:text-amber-400');
            jumlahInput.classList.add('border-cyan-500/50');
          }
        }
      } else {
        if (warningEl) warningEl.classList.add('hidden');
        if (jumlahInput) {
          jumlahInput.classList.remove('border-amber-500', 'bg-amber-500/10', 'text-amber-600', 'dark:text-amber-400');
          jumlahInput.classList.add('border-cyan-500/50');
        }
      }
    };

    window.tambahItemDtf = function (isEdit = false) {
      const prefix = isEdit ? 'dtf-edit-add' : 'dtf-add';
      const selectEl = document.getElementById(`${prefix}-item-select`);
      const customNamaInput = document.getElementById(`${prefix}-custom-nama`);
      const hppHidden = document.getElementById(`${prefix}-hpp-hidden`);
      const satuanSelect = document.getElementById(`${prefix}-satuan`);
      const jumlahInput = document.getElementById(`${prefix}-jumlah`);
      const hargaInput = document.getElementById(`${prefix}-harga`);
      const catatanInput = document.getElementById(`${prefix}-catatan`);

      let stokId = '';
      let nama = '';
      let hppSatuan = parseFloat(hppHidden?.value) || 0;

      if (selectEl && selectEl.value === '__custom__') {
        nama = (customNamaInput?.value || '').trim() || 'Cetak Film DTF Khusus';
        stokId = '';
        hppSatuan = 0;
      } else if (selectEl) {
        stokId = selectEl.value;
        const opt = selectEl.options[selectEl.selectedIndex];
        nama = opt ? (opt.getAttribute('data-nama') || opt.text) : 'Bahan Film DTF';
        const optHpp = parseFloat(opt?.getAttribute('data-hpp'));
        if (!isNaN(optHpp)) hppSatuan = optHpp;
      }

      const jumlah = parseFloat(jumlahInput?.value) || 0;
      if (jumlah <= 0) {
        alert('Ukuran / jumlah cetak harus lebih dari 0!');
        if (jumlahInput) jumlahInput.focus();
        return;
      }

      const satuan = satuanSelect?.value || 'meter';
      const hargaSatuan = parseFloat(hargaInput?.value) || 0;
      const catatanDesain = (catatanInput?.value || '').trim();

      // Cek Peringatan Stok Melebihi saat tombol tambah item ditekan
      if (stokId) {
        const itemStok = (state.stok || []).find(s => s.id === stokId);
        if (itemStok) {
          const sisaStok = parseFloat(itemStok.jumlah) || 0;
          const sudahDiKeranjang = (window._currentDtfItems || [])
            .filter(i => i.stokId === stokId)
            .reduce((sum, i) => sum + (parseFloat(i.jumlah) || 0), 0);
          const totalDiminta = sudahDiKeranjang + jumlah;

          if (totalDiminta > sisaStok) {
            const satuanLabel = itemStok.satuan || satuan;
            const selisih = (totalDiminta - sisaStok).toLocaleString('id-ID', { maximumFractionDigits: 2 });
            alert(
              `❌ PEMESANAN TIDAK DAPAT DIPROSES!\n\n` +
              `Jumlah pesanan melebihi stok yang tersedia di toko:\n` +
              `• Bahan: ${itemStok.nama} (${stokId})\n` +
              `• Sisa Stok Toko: ${sisaStok} ${satuanLabel}\n` +
              `• Total Diminta: ${totalDiminta} ${satuanLabel}` + (sudahDiKeranjang > 0 ? ` (${sudahDiKeranjang} di daftar + ${jumlah} baru)` : '') + `\n` +
              `• Kekurangan: ${selisih} ${satuanLabel}\n\n` +
              `Pemesanan melebihi stok tidak dapat diproses. Silakan sesuaikan jumlah pesanan dengan stok yang ada.`
            );
            if (jumlahInput) jumlahInput.focus();
            return;
          }
        }
      }

      const subtotal = Math.round(jumlah * hargaSatuan);
      const subtotalModal = Math.round(jumlah * hppSatuan);
      const labaKotor = subtotal - subtotalModal;

      if (!window._currentDtfItems) {
        window._currentDtfItems = [];
      }

      window._currentDtfItems.push({
        stokId,
        nama,
        satuan,
        jumlah,
        hargaSatuan,
        subtotal,
        hppSatuan,
        subtotalModal,
        labaKotor,
        catatanDesain
      });

      // Reset input form tambah
      if (catatanInput) catatanInput.value = '';
      if (customNamaInput) customNamaInput.value = '';
      if (jumlahInput) jumlahInput.value = '1.0';

      const container = document.getElementById(isEdit ? 'dtf-edit-items-container' : 'dtf-items-container');
      if (container) {
        container.innerHTML = renderDtfItemsTableHtml(window._currentDtfItems, isEdit);
        lucide.createIcons();
      }

      updateGrandTotalDtf(isEdit);
      showNotificationToast(`Item "${nama}" (+${jumlah} ${satuan}) berhasil ditambahkan ke daftar!`);
    };

    window.hapusItemDtf = function (idx, isEdit = false) {
      if (window._currentDtfItems && window._currentDtfItems[idx] !== undefined) {
        const removed = window._currentDtfItems[idx];
        window._currentDtfItems.splice(idx, 1);

        const container = document.getElementById(isEdit ? 'dtf-edit-items-container' : 'dtf-items-container');
        if (container) {
          container.innerHTML = renderDtfItemsTableHtml(window._currentDtfItems, isEdit);
          lucide.createIcons();
        }

        updateGrandTotalDtf(isEdit);
        showNotificationToast(`Item "${removed.nama}" dihapus.`);
      }
    };

    window.updateGrandTotalDtf = function (isEdit = false) {
      const prefix = isEdit ? 'dtf-edit' : 'dtf';
      const addPrefix = isEdit ? 'dtf-edit-add' : 'dtf-add';

      const items = window._currentDtfItems || [];
      let totalOmset = 0;
      let totalModal = 0;
      let formulaText = '';

      if (items.length > 0) {
        totalOmset = items.reduce((sum, it) => sum + (it.subtotal || 0), 0);
        totalModal = items.reduce((sum, it) => sum + (it.subtotalModal || 0), 0);
        const totalQty = items.reduce((sum, it) => sum + (parseFloat(it.jumlah) || 0), 0);
        formulaText = `${items.length} Item Film (${totalQty.toLocaleString('id-ID', { maximumFractionDigits: 2 })} Total Ukuran)`;
      } else {
        const jumlahInput = document.getElementById(`${addPrefix}-jumlah`);
        const hargaInput = document.getElementById(`${addPrefix}-harga`);
        const hppHidden = document.getElementById(`${addPrefix}-hpp-hidden`);
        const satuanSelect = document.getElementById(`${addPrefix}-satuan`);

        const jumlah = parseFloat(jumlahInput?.value) || 0;
        const harga = parseFloat(hargaInput?.value) || 0;
        const hpp = parseFloat(hppHidden?.value) || 0;
        const satuan = satuanSelect?.value || 'meter';

        totalOmset = Math.round(jumlah * harga);
        totalModal = Math.round(jumlah * hpp);
        formulaText = `${jumlah} ${satuan} @ ${formatRp(harga)}`;
      }

      const totalPreview = document.getElementById(`${prefix}-total-preview`);
      const calcFormula = document.getElementById(`${prefix}-calc-formula`);
      const totalVal = document.getElementById(`${prefix}-total-val`);

      const modalPreview = document.getElementById(`${prefix}-modal-preview`);
      const modalFormula = document.getElementById(`${prefix}-modal-formula`);
      const totalModalVal = document.getElementById(`${prefix}-total-modal-val`);

      const labaPreview = document.getElementById(`${prefix}-laba-preview`);
      const marginPreview = document.getElementById(`${prefix}-margin-preview`);

      if (totalPreview) totalPreview.innerText = formatRp(totalOmset);
      if (calcFormula) calcFormula.innerText = formulaText;
      if (totalVal) totalVal.value = totalOmset;

      if (modalPreview) modalPreview.innerText = formatRp(totalModal);
      if (modalFormula) modalFormula.innerText = `Bahan fisik & HPP`;
      if (totalModalVal) totalModalVal.value = totalModal;

      const totalLaba = totalOmset - totalModal;
      const marginPersen = totalOmset > 0 ? Math.round((totalLaba / totalOmset) * 100) : 0;
      if (labaPreview) labaPreview.innerText = formatRp(totalLaba);
      if (marginPreview) marginPreview.innerText = `Margin: ${marginPersen}%`;

      // Pembayaran & Sisa
      const bayarInput = document.getElementById(`${prefix}-bayar`);
      if (!isEdit && window._dtfBayarAutoSync && bayarInput) {
        bayarInput.value = totalOmset;
      }
      const bayar = parseFloat(bayarInput?.value) || 0;
      const sisa = Math.max(0, totalOmset - bayar);

      const sisaBox = document.getElementById(`${prefix}-sisa-box`);
      const sisaText = document.getElementById(`${prefix}-sisa-text`);
      const sisaNominal = document.getElementById(`${prefix}-sisa-nominal`);

      if (sisaBox && sisaText && sisaNominal) {
        if (sisa <= 0) {
          sisaBox.className = "p-2.5 rounded-lg border text-xs flex items-center justify-between bg-emerald-500/10 border-emerald-500/30 text-emerald-700 dark:text-emerald-300";
          sisaText.innerText = "LUNAS (Tidak ada sisa tagihan)";
          sisaNominal.innerText = "Rp 0";
        } else if (bayar > 0) {
          sisaBox.className = "p-2.5 rounded-lg border text-xs flex items-center justify-between bg-cyan-500/10 border-cyan-500/30 text-cyan-700 dark:text-cyan-300";
          sisaText.innerText = "DP / TITIP BAYAR (Sisa Piutang):";
          sisaNominal.innerText = formatRp(sisa);
        } else {
          sisaBox.className = "p-2.5 rounded-lg border text-xs flex items-center justify-between bg-rose-500/10 border-rose-500/30 text-rose-700 dark:text-rose-300";
          sisaText.innerText = "BELUM BAYAR (Sisa Piutang):";
          sisaNominal.innerText = formatRp(sisa);
        }
      }
    };

    window.simpanOrderDTF = async function (e) {
      e.preventDefault();

      const nama = (document.getElementById('dtf-cust-nama')?.value || '').trim();
      if (!nama) {
        alert('Nama pemesan harus diisi!');
        return;
      }
      const telepon = (document.getElementById('dtf-cust-telp')?.value || '').trim();
      const selectCust = document.getElementById('dtf-cust-select');
      let pelangganId = selectCust ? selectCust.value : '';

      if (!pelangganId) {
        const foundCust = (state.pelanggan || []).find(p => p.nama.toLowerCase() === nama.toLowerCase());
        if (foundCust) {
          pelangganId = foundCust.id;
        } else {
          pelangganId = `CUST-00${state.pelanggan.length + 1}`;
          await dbSave('pelanggan', pelangganId, {
            id: pelangganId,
            nama,
            telepon: telepon || '-',
            alamat: '-'
          });
        }
      }

      let items = [...(window._currentDtfItems || [])];

      // Jika belum ada item di daftar tapi baris input terisi, otomatis masukkan item tersebut
      if (items.length === 0) {
        const selectEl = document.getElementById('dtf-add-item-select');
        const customNamaInput = document.getElementById('dtf-add-custom-nama');
        const hppHidden = document.getElementById('dtf-add-hpp-hidden');
        const satuanSelect = document.getElementById('dtf-add-satuan');
        const jumlahInput = document.getElementById('dtf-add-jumlah');
        const hargaInput = document.getElementById('dtf-add-harga');
        const catatanDesainInput = document.getElementById('dtf-add-catatan');

        let stokId = '';
        let namaItem = '';
        let hppSatuan = parseFloat(hppHidden?.value) || 0;

        if (selectEl && selectEl.value === '__custom__') {
          namaItem = (customNamaInput?.value || '').trim() || 'Cetak Film DTF Khusus';
          stokId = '';
          hppSatuan = 0;
        } else if (selectEl) {
          stokId = selectEl.value;
          const opt = selectEl.options[selectEl.selectedIndex];
          namaItem = opt ? (opt.getAttribute('data-nama') || opt.text.split('(')[0].trim()) : 'Bahan Film DTF';
          const optHpp = parseFloat(opt?.getAttribute('data-hpp'));
          if (!isNaN(optHpp)) hppSatuan = optHpp;
        }

        const jumlah = parseFloat(jumlahInput?.value) || 0;
        if (jumlah > 0) {
          const satuan = satuanSelect?.value || 'meter';
          const hargaSatuan = parseFloat(hargaInput?.value) || 0;
          const catatanDesain = (catatanDesainInput?.value || '').trim();
          const subtotal = Math.round(jumlah * hargaSatuan);
          const subtotalModal = Math.round(jumlah * hppSatuan);

          items.push({
            stokId,
            nama: namaItem,
            satuan,
            jumlah,
            hargaSatuan,
            subtotal,
            hppSatuan,
            subtotalModal,
            labaKotor: subtotal - subtotalModal,
            catatanDesain
          });
        }
      }

      if (items.length === 0) {
        alert('Mohon masukkan atau tambahkan minimal 1 item cetak film DTF!');
        return;
      }

      const totalBiaya = items.reduce((sum, it) => sum + (it.subtotal || 0), 0);
      const totalModal = items.reduce((sum, it) => sum + (it.subtotalModal || 0), 0);
      const labaKotor = totalBiaya - totalModal;
      const totalJumlah = items.reduce((sum, it) => sum + (parseFloat(it.jumlah) || 0), 0);
      const potongStok = document.getElementById('dtf-potong-stok')?.checked ?? true;
      const isIndent = document.getElementById('dtf-is-indent')?.checked ?? false;

      const bayar = parseFloat(document.getElementById('dtf-bayar')?.value) || 0;
      const sisa = Math.max(0, totalBiaya - bayar);
      const statusBayar = sisa <= 0 ? 'Lunas' : (bayar > 0 ? 'DP' : 'Belum Bayar');
      const metode = document.getElementById('dtf-metode')?.value || 'Tunai';
      const catatKas = document.getElementById('dtf-catat-kas')?.checked;
      const statusPengerjaan = document.getElementById('dtf-status-pengerjaan')?.value || (isIndent ? 'Antrian (Indent)' : 'Antrian');
      const catatanUmum = (document.getElementById('dtf-catatan-order')?.value || '').trim();

      const dtfId = `DTF-2026-00${(state.dtf || []).length + 1}`;
      const tanggal = document.getElementById('dtf-tanggal')?.value || new Date().toISOString().split('T')[0];

      // Cek peringatan apakah ada item yang melebihi stok fisik toko (Hanya jika bukan pesanan indent)
      if (potongStok && !isIndent) {
        const overStockItems = [];
        for (const it of items) {
          if (it.stokId && it.jumlah > 0) {
            const st = (state.stok || []).find(s => s.id === it.stokId);
            if (st && parseFloat(it.jumlah) > (parseFloat(st.jumlah) || 0)) {
              overStockItems.push({
                nama: st.nama,
                id: st.id,
                tersedia: parseFloat(st.jumlah) || 0,
                diminta: parseFloat(it.jumlah) || 0,
                satuan: it.satuan || st.satuan || 'meter'
              });
            }
          }
        }

        if (overStockItems.length > 0) {
          const detailList = overStockItems.map(o =>
            `• ${o.nama} (${o.id}): Tersedia ${o.tersedia} ${o.satuan}, Dipesan ${o.diminta} ${o.satuan} (Kurang ${(o.diminta - o.tersedia).toLocaleString('id-ID', { maximumFractionDigits: 2 })} ${o.satuan})`
          ).join('\n');

          alert(
            `❌ PEMESANAN TIDAK DAPAT DIPROSES!\n\n` +
            `Pemesanan melebihi stok fisik yang tersedia di toko:\n\n${detailList}\n\n` +
            `Aktifkan centang "Opsi Order Indent" jika ingin tetap menerbitkan nota resmi untuk pesanan ini.`
          );
          return;
        }
      }

      // Potong stok fisik untuk setiap item yang terhubung dengan master stok (maksimal sampai 0)
      if (potongStok) {
        for (const it of items) {
          if (it.stokId && it.jumlah > 0) {
            const itemStok = (state.stok || []).find(s => s.id === it.stokId);
            if (itemStok) {
              const curQty = typeof itemStok.jumlah === 'number' ? itemStok.jumlah : 0;
              const newQty = Math.max(0, curQty - parseFloat(it.jumlah));
              await dbUpdate('stok', it.stokId, { jumlah: newQty });
            }
          }
        }
      }

      const firstItem = items[0];
      const combinedCatatan = items.map(it => it.catatanDesain).filter(Boolean).join('; ');

      const newOrder = {
        id: dtfId,
        tanggal,
        pelangganId,
        pelangganNama: nama,
        pelangganTelepon: telepon,
        items,
        isIndent: !!isIndent,
        statusIndent: isIndent ? 'Menunggu Stok Bahan' : null,
        jasaPrint: items.length === 1 ? firstItem.nama : `Cetak DTF (${items.length} Item)`,
        stokId: items.length === 1 ? firstItem.stokId : '',
        stokNama: items.length === 1 ? firstItem.nama : `Multi-Item DTF (${items.length} Item)`,
        stokSatuan: items.length === 1 ? firstItem.satuan : 'item',
        qtyStok: totalJumlah,
        hppSatuan: items.length === 1 ? firstItem.hppSatuan : (totalJumlah > 0 ? Math.round(totalModal / totalJumlah) : 0),
        totalModal,
        labaKotor,
        potongStok,
        satuan: items.length === 1 ? firstItem.satuan : 'item',
        jumlah: totalJumlah,
        hargaSatuan: items.length === 1 ? firstItem.hargaSatuan : totalBiaya,
        totalBiaya,
        statusBayar,
        bayar,
        sisa,
        metode,
        statusPengerjaan,
        catatan: catatanUmum || combinedCatatan
      };

      await dbSave('dtf', dtfId, newOrder);

      if (catatKas && bayar > 0 && metode === 'Tunai') {
        const kasId = `KAS-00${state.kas.length + 1}`;
        const itemDesc = items.length === 1 ? `${firstItem.jumlah} ${firstItem.satuan} ${firstItem.nama}` : `${items.length} item film`;
        await dbSave('kas', kasId, {
          id: kasId,
          tanggal,
          tipe: 'Masuk',
          kategori: 'Order Cetak Film DTF',
          keterangan: `Bayar DTF #${dtfId} (${nama} - ${itemDesc}) via ${metode}`,
          jumlah: bayar
        });
      }

      if (sisa > 0) {
        const hpId = `HP-00${state.hutangpiutang.length + 1}`;
        await dbSave('hutangpiutang', hpId, {
          id: hpId,
          jenis: 'Piutang',
          pihak: nama,
          noRef: dtfId,
          tanggal,
          totalTagihan: totalBiaya,
          terbayar: bayar,
          jumlah: sisa,
          jatuhTempo: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'Belum Lunas'
        });
      }

      closeModal();
      showNotificationToast(`Order Cetak Film DTF #${dtfId} (${jumlah} ${satuan}) berhasil dibuat!`);
    };

    window.openEditDTFModal = function (id) {
      const d = (state.dtf || []).find(item => item.id === id);
      if (!d) return;

      // Salin items yang sudah ada (atau konversi dari format tunggal jika order lama)
      if (Array.isArray(d.items) && d.items.length > 0) {
        window._currentDtfItems = JSON.parse(JSON.stringify(d.items));
      } else {
        window._currentDtfItems = [{
          stokId: d.stokId || '',
          nama: d.jasaPrint || 'Cetak Film DTF Meteran',
          satuan: d.satuan || 'meter',
          jumlah: parseFloat(d.jumlah) || 1.0,
          hargaSatuan: parseFloat(d.hargaSatuan) || 0,
          subtotal: parseFloat(d.totalBiaya) || 0,
          hppSatuan: parseFloat(d.hppSatuan) || 0,
          subtotalModal: parseFloat(d.totalModal) || 0,
          labaKotor: parseFloat(d.labaKotor) || 0,
          catatanDesain: d.catatan || ''
        }];
      }

      const defaultItem = (state.stok || []).find(s =>
        (s.kategori && s.kategori.toLowerCase().includes('dtf')) ||
        (s.nama && s.nama.toLowerCase().includes('dtf')) ||
        (s.nama && s.nama.toLowerCase().includes('film'))
      ) || ((state.stok || []).length > 0 ? state.stok[0] : null);

      const defaultHarga = defaultItem && defaultItem.harga ? defaultItem.harga : 55000;
      const defaultHpp = defaultItem && defaultItem.hpp ? defaultItem.hpp : 18000;
      const defaultStokId = defaultItem ? defaultItem.id : '';
      const isLow = defaultItem ? (defaultItem.jumlah || 0) <= (defaultItem.minStok || 0) : false;

      openModal(`
        <form onsubmit="simpanEditDTF(event, '${d.id}')" class="space-y-4 max-h-[85vh] overflow-y-auto pr-1">
          <!-- Header Modal -->

    window.simpanEditDTF = async function (e, id) {
      e.preventDefault();
      const d = (state.dtf || []).find(item => item.id === id);
      if (!d) return;

      let newItems = [...(window._currentDtfItems || [])];

      // Jika belum ada item di daftar tapi baris input terisi, otomatis masukkan item tersebut
      if (newItems.length === 0) {
        const selectEl = document.getElementById('dtf-edit-add-item-select');
        const customNamaInput = document.getElementById('dtf-edit-add-custom-nama');
        const hppHidden = document.getElementById('dtf-edit-add-hpp-hidden');
        const satuanSelect = document.getElementById('dtf-edit-add-satuan');
        const jumlahInput = document.getElementById('dtf-edit-add-jumlah');
        const hargaInput = document.getElementById('dtf-edit-add-harga');
        const catatanDesainInput = document.getElementById('dtf-edit-add-catatan');

        let stokId = '';
        let namaItem = '';
        let hppSatuan = parseFloat(hppHidden?.value) || 0;

        if (selectEl && selectEl.value === '__custom__') {
          namaItem = (customNamaInput?.value || '').trim() || 'Cetak Film DTF Khusus';
          stokId = '';
          hppSatuan = 0;
        } else if (selectEl) {
          stokId = selectEl.value;
          const opt = selectEl.options[selectEl.selectedIndex];
          namaItem = opt ? (opt.getAttribute('data-nama') || opt.text.split('(')[0].trim()) : 'Bahan Film DTF';
          const optHpp = parseFloat(opt?.getAttribute('data-hpp'));
          if (!isNaN(optHpp)) hppSatuan = optHpp;
        }

        const jumlah = parseFloat(jumlahInput?.value) || 0;
        if (jumlah > 0) {
          const satuan = satuanSelect?.value || 'meter';
          const hargaSatuan = parseFloat(hargaInput?.value) || 0;
          const catatanDesain = (catatanDesainInput?.value || '').trim();
          const subtotal = Math.round(jumlah * hargaSatuan);
          const subtotalModal = Math.round(jumlah * hppSatuan);

          newItems.push({
            stokId,
            nama: namaItem,
            satuan,
            jumlah,
            hargaSatuan,
            subtotal,
            hppSatuan,
            subtotalModal,
            labaKotor: subtotal - subtotalModal,
            catatanDesain
          });
        }
      }

      if (newItems.length === 0) {
        alert('Mohon masukkan atau tambahkan minimal 1 item cetak film DTF!');
        return;
      }

      const nama = (document.getElementById('dtf-edit-nama')?.value || '').trim();
      const telepon = (document.getElementById('dtf-edit-telp')?.value || '').trim();

      const newTotalBiaya = newItems.reduce((sum, i) => sum + (i.subtotal || 0), 0);
      const newTotalModal = newItems.reduce((sum, i) => sum + (i.subtotalModal || 0), 0);
      const newLabaKotor = newTotalBiaya - newTotalModal;
      const newTotalJumlah = newItems.reduce((sum, i) => sum + (parseFloat(i.jumlah) || 0), 0);
      const newPotongStok = document.getElementById('dtf-edit-potong-stok')?.checked ?? true;
      const newIsIndent = document.getElementById('dtf-edit-is-indent')?.checked ?? !!d.isIndent;

      const oldItems = d.potongStok !== false
        ? (Array.isArray(d.items) && d.items.length > 0
          ? d.items
          : (d.stokId ? [{ stokId: d.stokId, jumlah: d.qtyStok || d.jumlah || 0 }] : []))
        : [];

      // Validasi: Cek apakah ada item yang melebihi stok yang tersedia di toko (hanya jika potongStok aktif dan BUKAN pesanan Indent)
      if (newPotongStok && !newIsIndent) {
        const overStockEditItems = [];
        for (const newIt of newItems) {
          if (newIt.stokId && newIt.jumlah > 0) {
            const stItem = (state.stok || []).find(s => s.id === newIt.stokId);
            const cur = stItem && typeof stItem.jumlah === 'number' ? stItem.jumlah : 0;
            const oldQty = oldItems
              .filter(o => o.stokId === newIt.stokId)
              .reduce((sum, o) => sum + (parseFloat(o.jumlah) || 0), 0);
            const maxAvailable = cur + oldQty;
            if (parseFloat(newIt.jumlah) > maxAvailable) {
              overStockEditItems.push({
                nama: newIt.nama,
                id: newIt.stokId,
                tersedia: maxAvailable,
                diminta: parseFloat(newIt.jumlah),
                satuan: newIt.satuan || 'meter'
              });
            }
          }
        }

        if (overStockEditItems.length > 0) {
          const detailList = overStockEditItems.map(o =>
            `• ${o.nama} (${o.id}): Tersedia ${o.tersedia} ${o.satuan}, Dipesan ${o.diminta} ${o.satuan} (Kurang ${(o.diminta - o.tersedia).toLocaleString('id-ID', { maximumFractionDigits: 2 })} ${o.satuan})`
          ).join('\n');

          alert(
            `❌ PEMESANAN TIDAK DAPAT DIPROSES!\n\n` +
            `Pembaruan order melebihi sisa stok fisik di toko:\n\n${detailList}\n\n` +
            `Silakan kurangi jumlah pesanan sesuai stok yang tersedia.`
          );
          return;
        }
      }

      // Revert stok item lama yang pernah dipotong
      if (d.potongStok !== false && oldItems.length > 0) {
        for (const oldIt of oldItems) {
          if (oldIt.stokId && oldIt.jumlah > 0) {
            const stItem = (state.stok || []).find(s => s.id === oldIt.stokId);
            if (stItem) {
              const cur = typeof stItem.jumlah === 'number' ? stItem.jumlah : 0;
              await dbUpdate('stok', oldIt.stokId, { jumlah: cur + parseFloat(oldIt.jumlah) });
            }
          }
        }
      }

      // Potong stok item baru
      if (newPotongStok) {
        for (const newIt of newItems) {
          if (newIt.stokId && newIt.jumlah > 0) {
            const stItem = (state.stok || []).find(s => s.id === newIt.stokId);
            if (stItem) {
              const cur = typeof stItem.jumlah === 'number' ? stItem.jumlah : 0;
              await dbUpdate('stok', newIt.stokId, { jumlah: Math.max(0, cur - parseFloat(newIt.jumlah)) });
            }
          }
        }
      }

      const bayarBaru = parseFloat(document.getElementById('dtf-edit-bayar')?.value) || 0;
      const sisa = Math.max(0, newTotalBiaya - bayarBaru);
      const statusBayar = sisa <= 0 ? 'Lunas' : (bayarBaru > 0 ? 'DP' : 'Belum Bayar');
      const statusPengerjaan = document.getElementById('dtf-edit-status-pengerjaan')?.value || d.statusPengerjaan;
      const catatanUmum = (document.getElementById('dtf-edit-catatan-order')?.value || '').trim();

      const jasaPrint = newItems.length === 1 ? newItems[0].nama : `${newItems.length} Item Film (${newItems.map(i => `${i.jumlah}${i.satuan} ${i.nama}`).join(', ')})`;
      const primaryItem = newItems[0] || {};

      const updateTanggal = document.getElementById('dtf-edit-tanggal')?.value || d.tanggal || new Date().toISOString().split('T')[0];

      const updateData = {
        tanggal: updateTanggal,
        pelangganNama: nama,
        pelangganTelepon: telepon,
        items: newItems,
        jasaPrint,
        stokId: newItems.length === 1 ? primaryItem.stokId : newItems.map(i => i.stokId).filter(Boolean).join(', '),
        stokNama: newItems.length === 1 ? primaryItem.nama : newItems.map(i => i.nama).filter(Boolean).join(', '),
        stokSatuan: primaryItem.satuan || 'meter',
        qtyStok: newTotalJumlah,
        hppSatuan: newItems.length === 1 ? (primaryItem.hppSatuan || 0) : Math.round(newTotalModal / (newTotalJumlah || 1)),
        totalModal: newTotalModal,
        labaKotor: newLabaKotor,
        potongStok: newPotongStok,
        isIndent: !!newIsIndent,
        statusIndent: newIsIndent ? (d.statusIndent || 'Menunggu Stok Bahan') : undefined,
        satuan: primaryItem.satuan || 'meter',
        jumlah: newTotalJumlah,
        hargaSatuan: newItems.length === 1 ? (primaryItem.hargaSatuan || 0) : Math.round(newTotalBiaya / (newTotalJumlah || 1)),
        totalBiaya: newTotalBiaya,
        bayar: bayarBaru,
        sisa,
        statusBayar,
        statusPengerjaan,
        catatan: catatanUmum
      };

      await dbUpdate('dtf', id, updateData);

      // Sinkronisasi Piutang
      const existingHP = (state.hutangpiutang || []).find(hp => hp.noRef === id && hp.jenis === 'Piutang');
      if (existingHP) {
        if (sisa <= 0) {
          await dbUpdate('hutangpiutang', existingHP.id, {
            status: 'Lunas',
            jumlah: 0,
            totalTagihan: newTotalBiaya,
            terbayar: bayarBaru
          });
        } else {
          await dbUpdate('hutangpiutang', existingHP.id, {
            totalTagihan: newTotalBiaya,
            terbayar: bayarBaru,
            jumlah: sisa,
            status: 'Belum Lunas'
          });
        }
      }

      closeModal();
      showNotificationToast(`Order DTF #${id} berhasil diperbarui!`);
    };

        target = Math.ceil(target / 500) * 500;

      }
      input.value = target;
      updateMarginPreviewQuickEdit(hpp);

      const newHarga = parseFloat(input.value);
      if (isNaN(newHarga) || newHarga < 0) {
        alert('Harga jual harus berupa angka valid dan minimal 0!');
        return;
      }
      const item = state.stok.find(s => s.id === id);
      const nama = item ? item.nama : id;
      await dbUpdate('stok', id, { harga: newHarga });
      closeModal();
      showNotificationToast(`Harga jual "${nama}" berhasil diubah menjadi ${formatRp(newHarga)}!`);
    };

      const input = document.getElementById(isEdit ? 'edit-stk-satuan' : 'stk-satuan');
      if (input) {
        input.value = val;
        input.focus();
        const container = input.closest('.stk-satuan-wrapper');
        if (container) {
          container.querySelectorAll('.satuan-btn').forEach(btn => {
            const isMatch = (btn.getAttribute('data-val') || '').toLowerCase() === val.toLowerCase();
            if (isMatch) {
              btn.className = "satuan-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-cyan-500 text-white shadow-sm border border-cyan-500 transition flex items-center space-x-1";
            } else {
              btn.className = "satuan-btn px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition flex items-center space-x-1";
            }
          });
        }
      }
    };

    window.suggestSatuanStok = function (isEdit = false) {
      const inputNama = document.getElementById(isEdit ? 'edit-stk-nama' : 'stk-nama');
      const inputSatuan = document.getElementById(isEdit ? 'edit-stk-satuan' : 'stk-satuan');
      const inputKat = document.getElementById(isEdit ? 'edit-stk-kategori' : 'stk-kategori');
      if (!inputNama || !inputSatuan) return;

      const current = inputSatuan.value.trim().toLowerCase();
      // Hanya auto-suggest jika belum diubah user dari default 'pcs' atau masih kosong
      if (!current || current === 'pcs') {
        const text = ((inputNama.value || '') + ' ' + (inputKat?.value || '')).toLowerCase();
        if (text.includes('tinta') || text.includes('cleaner') || text.includes('ink') || text.includes('cairan')) {
          setSatuanStokPreset('Botol', isEdit);
        } else if (text.includes('dtf') || text.includes('film') || text.includes('banner') || text.includes('meter') || text.includes('kain') || text.includes('vinyl') || text.includes('polyflex')) {
          setSatuanStokPreset('Meter', isEdit);
        } else if (text.includes('kertas') || text.includes('hvs') || text.includes('paper')) {
          setSatuanStokPreset('Rim', isEdit);
        } else if (text.includes('roll') || text.includes('gulung')) {
          setSatuanStokPreset('Roll', isEdit);
        }
      }
    };

    window.updateNewStokMarginPreview = function () {
      const preview = document.getElementById('new-stk-margin-preview');
      const hppInput = document.getElementById('stk-hpp');
      const hargaInput = document.getElementById('stk-harga');
      if (!preview || !hppInput || !hargaInput) return;

      const hpp = parseFloat(hppInput.value) || 0;
      const harga = parseFloat(hargaInput.value) || 0;
      if (hpp === 0 && harga === 0) {
        preview.classList.add('hidden');
        return;
      }
      preview.classList.remove('hidden');
      const profit = harga - hpp;
      const marginPct = hpp > 0 ? ((profit / hpp) * 100).toFixed(1) : (harga > 0 ? 100 : 0);

      if (profit > 0) {
        preview.className = "text-xs p-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-between";
        preview.innerHTML = `<span>Estimasi Keuntungan: <strong>+${formatRp(profit)}</strong> / item</span><span class="font-bold">+${marginPct}% Margin</span>`;
      } else if (profit === 0) {
        preview.className = "text-xs p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-between";
        preview.innerHTML = `<span>Titik Impas: Harga jual sama dengan HPP</span><span class="font-bold">0% Margin</span>`;
      } else {
        preview.className = "text-xs p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-500 flex items-center justify-between";
        preview.innerHTML = `<span>⚠️ Peringatan: Harga jual di bawah modal HPP (Rugi ${formatRp(Math.abs(profit))})</span><span class="font-bold">${marginPct}%</span>`;

      const profit = harga - hpp;

      if (profit > 0) {
        preview.className = "text-xs p-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-between";
        preview.innerHTML = `<span>Estimasi Keuntungan: <strong>+${formatRp(profit)}</strong> / item</span><span class="font-bold">+${marginPct}% Margin</span>`;

    window.tambahKategoriBaru = function (e) {
      e.preventDefault();
      const name = (document.getElementById('new-kat-name')?.value || '').trim();
      if (!name) return;
      if (!state.kategoriStok) state.kategoriStok = ['Tinta', 'Sparepart', 'Barang'];
      const exists = state.kategoriStok.some(k => k.toLowerCase() === name.toLowerCase());
      if (exists) {
        alert(`Kategori "${name}" sudah ada dalam daftar!`);
        return;
      }
      state.kategoriStok.push(name);
      persistLocalStorageData();
      openKelolaKategoriModal();
      renderPage();
    };

    window.hapusKategori = function (katName) {
      const count = state.stok.filter(s => s.kategori && s.kategori.toLowerCase() === katName.toLowerCase()).length;
      let msg = `Yakin ingin menghapus / membuang kategori "${katName}"?`;
      if (count > 0) {
        msg = `Kategori "${katName}" sedang digunakan oleh ${count} item barang di stok!\n\nJika dihapus, kategori pada ${count} barang tersebut akan diubah menjadi "Lainnya".\n\nLanjutkan menghapus?`;
      }
      if (confirm(msg)) {
        state.kategoriStok = (state.kategoriStok || []).filter(k => k.toLowerCase() !== katName.toLowerCase());
        if (count > 0) {
          state.stok.forEach(s => {
            if (s.kategori && s.kategori.toLowerCase() === katName.toLowerCase()) {
              s.kategori = 'Lainnya';
            }
          });
          if (!state.kategoriStok.some(k => k.toLowerCase() === 'lainnya')) {
            state.kategoriStok.push('Lainnya');
          }
        }
        if (state.stokFilterCat && state.stokFilterCat.toLowerCase() === katName.toLowerCase()) {
          state.stokFilterCat = 'all';
        }
        persistLocalStorageData();
        openKelolaKategoriModal();
        renderPage();
      }
    };

    window.onBuyItemSelectChange = function () {
      const input = document.getElementById('buy-item-name');
      const hargaInput = document.getElementById('buy-item-harga');
      if (!input || !hargaInput) return;

      const val = input.value.trim().toLowerCase();
      if (!val) return;

      const found = (state.stok || []).find(s => s.nama.toLowerCase() === val || s.id.toLowerCase() === val);
      if (found) {
        if (typeof found.hpp === 'number' && found.hpp > 0) {
          hargaInput.value = found.hpp;
        } else if (typeof found.harga === 'number' && found.harga > 0) {
          hargaInput.value = found.harga;
        }
      }
      updateBuyItemSubtotalPreview();
    };

    window.updateBuyItemSubtotalPreview = function () {
      const qtyInput = document.getElementById('buy-item-qty');
      const hargaInput = document.getElementById('buy-item-harga');
      const preview = document.getElementById('buy-item-subtotal-preview');
      if (!preview) return;

      const qty = parseInt(qtyInput?.value) || 0;
      const harga = parseFloat(hargaInput?.value) || 0;
      const subtotal = Math.max(0, qty * harga);
      preview.innerText = formatRp(subtotal);
    };

    window.tambahItemPembelian = function () {
      const nameInput = document.getElementById('buy-item-name');
      const qtyInput = document.getElementById('buy-item-qty');
      const hargaInput = document.getElementById('buy-item-harga');
      if (!nameInput) return;

      const nama = nameInput.value.trim();
      const qty = parseInt(qtyInput?.value) || 1;
      const hargaSatuan = parseFloat(hargaInput?.value) || 0;

      if (!nama) {
        alert('Silakan pilih dari stok atau ketik nama barang / sparepart yang dibeli!');
        nameInput.focus();
        return;
      }
      if (qty <= 0) {
        alert('Jumlah (Qty) minimal 1!');
        if (qtyInput) qtyInput.focus();
        return;
      }

      const found = (state.stok || []).find(s => s.nama.toLowerCase() === nama.toLowerCase());
      const subtotal = qty * hargaSatuan;

      window._currentPembelianItems.push({
        id: found ? found.id : '',
        nama: found ? found.nama : nama,
        qty,
        hargaSatuan,
        subtotal
      });

      // Clear adder inputs
      nameInput.value = '';
      if (qtyInput) qtyInput.value = '1';
      if (hargaInput) hargaInput.value = '0';
      updateBuyItemSubtotalPreview();

      const container = document.getElementById('buy-items-container');
      if (container) {
        container.innerHTML = renderPembelianItemsTableHtml(window._currentPembelianItems);
        lucide.createIcons();
      }

      updateGrandTotalPembelian();
      nameInput.focus();
    };

    window.hapusItemPembelian = function (idx) {
      if (window._currentPembelianItems && window._currentPembelianItems[idx] !== undefined) {
        window._currentPembelianItems.splice(idx, 1);

    window.simpanPembelianBaru = async function (e) {
      e.preventDefault();

      if (!window._currentPembelianItems || window._currentPembelianItems.length === 0) {
        alert('Daftar item pembelian masih kosong! Tambahkan minimal 1 item barang/sparepart dengan klik tombol +.');
        return;
      }

      const tanggal = document.getElementById('buy-tanggal')?.value || new Date().toISOString().split('T')[0];
      const supplier = (document.getElementById('buy-supplier')?.value || '').trim();
      const status = document.getElementById('buy-status')?.value || 'Lunas';
      const catatan = (document.getElementById('buy-catatan')?.value || '').trim();
      const autoStok = document.getElementById('buy-auto-stok')?.checked;
      const catatKas = document.getElementById('buy-catat-kas')?.checked;
      const isIndent = document.getElementById('buy-is-indent')?.checked ?? false;

      const total = window._currentPembelianItems.reduce((sum, item) => sum + item.subtotal, 0);
      const rincianBarang = window._currentPembelianItems.map(i => `${i.qty}x ${i.nama}`).join(', ');
      const id = `BUY-2026-00${state.pembelian.length + 1}`;

      // 1. Simpan record pembelian
      const newPembelian = {
        id,
        tanggal,
        supplier,
        barang: rincianBarang,
        items: [...window._currentPembelianItems],
        total,
        status,
        isIndent: !!isIndent,
        statusIndent: isIndent ? 'Pesanan Supplier (PO)' : undefined,
        catatan
      };
      await dbSave('pembelian', id, newPembelian);

      // 2. Otomatis restok jumlah stok barang/sparepart
      if (autoStok) {
        for (const item of window._currentPembelianItems) {
          const found = state.stok.find(s => (item.id && s.id === item.id) || s.nama.toLowerCase() === item.nama.toLowerCase());
          if (found) {
            const newQty = (found.jumlah || 0) + item.qty;
            const updatePayload = { jumlah: newQty };
            if (item.hargaSatuan > 0) {
              updatePayload.hpp = item.hargaSatuan;
            }
            await dbUpdate('stok', found.id, updatePayload);
          } else {
            // Tambahkan sebagai barang baru di master stok
            const newStockId = `BRG-00${state.stok.length + 1}`;
            const newItem = {
              id: newStockId,
              nama: item.nama,
              kategori: 'Barang',
              satuan: 'Pcs',
              hpp: item.hargaSatuan,
              harga: Math.round(item.hargaSatuan * 1.25),
              jumlah: item.qty,
              minStok: 3
            };
            await dbSave('stok', newStockId, newItem);
          }
        }
      }

      // 3. Pencatatan Keuangan (Kas Keluar atau Hutang)
      if (catatKas) {
        if (status === 'Lunas') {
          const kasId = `KAS-00${state.kas.length + 1}`;
          await dbSave('kas', kasId, {
            id: kasId,
            tanggal,
            tipe: 'Keluar',
            kategori: 'Pembelian Stock',
            keterangan: `Restok #${id} (${supplier} - ${rincianBarang})`,
            jumlah: total
          });
        } else if (status === 'DP') {
          const dp = parseFloat(document.getElementById('buy-dp')?.value) || 0;
          if (dp > 0) {
            const kasId = `KAS-00${state.kas.length + 1}`;
            await dbSave('kas', kasId, {
              id: kasId,
              tanggal,
              tipe: 'Keluar',
              kategori: 'DP Pembelian Stock',
              keterangan: `DP Restok #${id} (${supplier} - ${rincianBarang})`,
              jumlah: dp
            });
          }
          const hpId = `HP-${String((state.hutangpiutang || []).length + 1).padStart(3, '0')}`;
          const sisaHutang = Math.max(0, total - dp);
          await dbSave('hutangpiutang', hpId, {
            id: hpId,
            jenis: 'Hutang',
            pihak: supplier,
            noRef: id,
            tanggal,
            totalTagihan: total,
            terbayar: dp,
            jumlah: sisaHutang,
            jatuhTempo: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
            status: sisaHutang <= 0 ? 'Lunas' : 'Dicicil',
            keterangan: `Restok barang #${id} (${supplier}) - DP: ${formatRp(dp)}`,
            riwayatCicilan: dp > 0 ? [{
              id: `CICIL-${Date.now()}`,
              tanggal,
              jumlah: dp,
              metode: 'Tunai',
              catatan: 'DP Pembelian Awal'
            }] : []
          });
        } else {
          // Catat ke Hutang Toko (Belum Lunas)
          const hpId = `HP-${String((state.hutangpiutang || []).length + 1).padStart(3, '0')}`;
          await dbSave('hutangpiutang', hpId, {
            id: hpId,
            jenis: 'Hutang',
            pihak: supplier,
            noRef: id,
            tanggal,
            totalTagihan: total,
            terbayar: 0,
            jumlah: total,
            jatuhTempo: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
            status: 'Belum Lunas',
            keterangan: `Restok barang #${id} (${supplier})`,
            riwayatCicilan: []
          });
        }
      }

      closeModal();
      showNotificationToast(`Nota pembelian restok #${id} (${formatRp(total)}) berhasil disimpan!`);
    };

    window.simpanEditPembelian = async function (e, id) {
      e.preventDefault();
      const p = state.pembelian.find(item => item.id === id);
      if (!p) {
        alert('Data pembelian tidak ditemukan!');
        return;
      }

      const items = window._currentPembelianItems || [];
      const total = items.length > 0
        ? items.reduce((sum, item) => sum + item.subtotal, 0)
        : (parseFloat(document.getElementById('buy-total-hidden')?.value) || 0);

      const rincianBarang = items.length > 0
        ? items.map(i => `${i.qty}x ${i.nama}`).join(', ')
        : (document.getElementById('edit-buy-supplier')?.value || 'Barang');

      const isIndent = document.getElementById('edit-buy-is-indent')?.checked ?? !!p.isIndent;

      const updateData = {
        tanggal: document.getElementById('edit-buy-tanggal')?.value || new Date().toISOString().split('T')[0],
        supplier: document.getElementById('edit-buy-supplier')?.value.trim() || 'Supplier',
        barang: rincianBarang,
        items: [...items],
        total,
        status: document.getElementById('edit-buy-status')?.value || 'Lunas',
        isIndent: !!isIndent,
        statusIndent: isIndent ? (p.statusIndent || 'Pesanan Supplier (PO)') : undefined,
        catatan: document.getElementById('edit-buy-catatan')?.value.trim() || ''
      };

      // Sinkronisasi selisih stok pembelian dengan master stok
      const oldItems = Array.isArray(p.items) && p.items.length > 0
        ? p.items
        : (p.barang ? [{ nama: p.barang, qty: 1 }] : []);
      const newItems = updateData.items;

      const buyUsageMap = new Map();
      const findStockBuy = (it) => {
        if (it.id) {
          const byId = (state.stok || []).find(st => st.id === it.id);
          if (byId) return byId;
        }
        if (it.nama) {
          const byNama = (state.stok || []).find(st => st.nama.toLowerCase() === it.nama.toLowerCase());
          if (byNama) return byNama;
        }
        return null;
      };

      for (const it of oldItems) {
        const stock = findStockBuy(it);
        if (stock) {
          const prev = buyUsageMap.get(stock.id) || { stockItem: stock, oldQty: 0, newQty: 0 };
          prev.oldQty += (parseInt(it.qty) || 1);
          buyUsageMap.set(stock.id, prev);
        }
      }

      for (const it of newItems) {
        const stock = findStockBuy(it);
        if (stock) {
          const prev = buyUsageMap.get(stock.id) || { stockItem: stock, oldQty: 0, newQty: 0 };
          prev.newQty += (parseInt(it.qty) || 1);
          buyUsageMap.set(stock.id, prev);
        }
      }

      for (const [stockId, data] of buyUsageMap.entries()) {
        const delta = data.newQty - data.oldQty;
        if (delta !== 0) {
          const curQty = typeof data.stockItem.jumlah === 'number' ? data.stockItem.jumlah : 0;
          const updatedJumlah = Math.max(0, curQty + delta);
          await dbUpdate('stok', stockId, { jumlah: updatedJumlah });
        }
      }

      await dbUpdate('pembelian', id, updateData);

      // Sinkronisasi dengan Catatan Hutang Toko jika ada
      const existingHP = (state.hutangpiutang || []).find(hp => hp.noRef === id && hp.jenis === 'Hutang');
      if (existingHP) {
        if (updateData.status === 'Lunas') {
          await dbUpdate('hutangpiutang', existingHP.id, {
            status: 'Lunas',
            totalTagihan: total,
            terbayar: total,
            jumlah: 0,
            pihak: updateData.supplier
          });
        } else {
          const terbayar = existingHP.terbayar || 0;
          const sisa = Math.max(0, total - terbayar);
          await dbUpdate('hutangpiutang', existingHP.id, {
            totalTagihan: total,
            jumlah: sisa,
            pihak: updateData.supplier,
            status: sisa <= 0 ? 'Lunas' : (terbayar > 0 ? 'Dicicil' : updateData.status)
          });
        }
      }

      closeModal();
      showNotificationToast(`Perubahan nota pembelian #${id} berhasil disimpan dan stok disinkronkan!`);
    };

    window.hapusPembelian = async function (id) {
      const p = state.pembelian.find(item => item.id === id);
      if (!p) return;
      if (confirm('Yakin ingin menghapus catatan pembelian ini? Stok barang yang pernah masuk dari nota ini akan otomatis disesuaikan (dikurangi kembali).')) {
        const items = Array.isArray(p.items) && p.items.length > 0
          ? p.items
          : (p.barang ? [{ nama: p.barang, qty: 1 }] : []);
        for (const it of items) {
          const found = (state.stok || []).find(s => (it.id && s.id === it.id) || (it.nama && s.nama.toLowerCase() === it.nama.toLowerCase()));
          if (found) {
            const newQty = Math.max(0, (found.jumlah || 0) - (parseInt(it.qty) || 1));
            await dbUpdate('stok', found.id, { jumlah: newQty });
          }
        }
        await dbDelete('pembelian', id);
        showNotificationToast(`Catatan pembelian #${id} berhasil dihapus & stok telah disesuaikan.`);
      }
    };

        alert('Nominal jumlah kas harus lebih dari 0!');

        tipe,
        kategori,
        keterangan,
        jumlah
      });

      closeModal();
      showNotificationToast('Transaksi kas berhasil diperbarui!');

      const k = (state.kas || []).find(item => item.id === id);
      if (!k) return;

      if (confirm(`Hapus catatan transaksi kas #${id} (${k.tipe}: ${formatRp(k.jumlah)})?`)) {

    window.simpanOperasionalBaru = async function (e) {
      e.preventDefault();
      const id = `OPS-00${state.operasional.length + 1}`;
      const tanggal = document.getElementById('ops-tanggal')?.value || new Date().toISOString().split('T')[0];
      const newOps = {
