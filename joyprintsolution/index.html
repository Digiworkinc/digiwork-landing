<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy Print Solution - Management & POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef8ff',
                            100: '#d9f0ff',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            750: '#0369a1',
                            900: '#0c4a6e',
                        },
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 flex h-screen overflow-hidden">

    <!-- PASSWORD MODAL (Otorisasi) -->
    <div id="authModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md p-6 rounded-2xl shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="shield-alert" class="text-cyan-400 w-5 h-5"></i> Otorisasi Akses Peran
                </h3>
                <button onclick="closeAuthModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-sm text-slate-400 mb-4">Masukkan password untuk beralih ke peran <span id="targetRoleName" class="text-cyan-400 font-semibold"></span>:</p>
            <form id="authForm" onsubmit="verifyPassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password Akses</label>
                    <input type="password" id="authPasswordInput" required placeholder="Masukkan password..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-cyan-500 text-sm">
                </div>
                <div id="authErrorMsg" class="text-rose-400 text-xs hidden">Password salah! (Default Admin: admin123, Kasir: kasir123, Teknisi: teknisi123)</div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAuthModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-medium">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-sm font-medium">Verifikasi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col transition-all duration-300 z-25">
        <div class="p-5 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-500/10 p-2 rounded-xl border border-cyan-500/20 text-cyan-400">
                    <i data-lucide="printer" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-white text-base leading-tight">Joy Print</h1>
                    <span class="text-xs text-slate-400">Solution App</span>
                </div>
            </div>
        </div>

        <!-- Role Badge -->
        <div class="p-4 mx-3 my-2 bg-slate-800/50 rounded-xl border border-slate-800 flex items-center justify-between">
            <div>
                <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold block">Peran Aktif</span>
                <span id="currentRoleBadge" class="text-sm font-bold text-cyan-400">Admin Utama</span>
            </div>
            <button onclick="promptChangeRole()" class="text-xs bg-cyan-500/10 text-cyan-400 hover:bg-cyan-500/20 px-2.5 py-1.5 rounded-lg font-medium transition flex items-center gap-1">
                <i data-lucide="shield" class="w-3.5 h-3.5"></i> Ubah
            </button>
        </div>

        <!-- Database Indicator & Excel Tools -->
        <div class="px-4 py-2 border-b border-slate-800/60 flex flex-col gap-2">
            <div class="flex items-center justify-between text-xs text-slate-400">
                <span class="flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> DB Storage Active
                </span>
            </div>
            <div class="grid grid-cols-2 gap-1.5">
                <button onclick="exportToExcel()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 font-medium transition">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Export
                </button>
                <label class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 font-medium cursor-pointer transition">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import
                    <input type="file" id="importFile" accept=".xlsx, .xls" onchange="importFromExcel(event)" class="hidden">
                </label>
            </div>
        </div>

        <!-- Navigation Menu -->
        <nav id="navMenu" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-1 text-sm font-medium">
            <!-- Rendered by JS -->
        </nav>

        <!-- Theme Toggle Footer -->
        <div class="p-3 border-t border-slate-800">
            <button onclick="toggleDarkMode()" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                <span class="flex items-center gap-2 text-xs font-medium">
                    <i data-lucide="moon" id="themeIcon" class="w-4 h-4"></i> Mode Tampilan
                </span>
                <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-400" id="themeText">Dark</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-slate-950">
        <!-- Header Top -->
        <header class="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between z-10">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white transition">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <h2 id="pageTitle" class="text-lg font-bold text-white">Dashboard Utama</h2>
            </div>
            <div class="flex items-center gap-3">
                <div class="relative">
                    <button onclick="switchTab('stok')" class="text-slate-400 hover:text-white p-2 rounded-lg bg-slate-800/50 hover:bg-slate-800 transition relative">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span id="lowStockBadge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                    </button>
                </div>
                <button onclick="switchTab('pos')" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-lg shadow-cyan-900/20 transition">
                    <i data-lucide="shopping-cart" class="w-4 h-4"></i> Kasir / POS
                </button>
            </div>
        </header>

        <!-- Dynamic Content Body -->
        <div id="mainContent" class="flex-1 overflow-y-auto custom-scrollbar p-6">
            <!-- Rendered Tab Content -->
        </div>
    </main>

    <!-- UNIVERSAL MODAL CONTAINER -->
    <div id="globalModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center hidden">
        <div id="modalContentWrapper" class="bg-slate-900 border border-slate-800 w-full max-w-lg p-6 rounded-2xl shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scrollbar">
            <!-- Modal Content Injected Dynamically -->
        </div>
    </div>

    <!-- NOTIFICATION ALERT POPUP -->
    <div id="toastAlert" class="fixed bottom-5 right-5 z-50 bg-slate-800 border border-slate-700 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300">
        <i id="toastIcon" data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
        <span id="toastMessage" class="text-sm font-medium">Notifikasi berhasil!</span>
    </div>

    <!-- SCRIPT UTAMA APLIKASI -->
    <script>
        let appState = {
            role: 'Admin', // Admin, Kasir, Teknisi
            activeTab: 'dashboard',
            theme: 'dark',
            
            // Data Master
            products: [
                { id: 'P001', code: 'BRG-001', name: 'Tinta Epson 664 Black Original', category: 'Tinta & Toner', unit: 'Botol', hpp: 65000, price: 85000, stock: 15, minStock: 3 },
                { id: 'P002', code: 'BRG-002', name: 'Kertas A4 Sinar Dunia 75gsm', category: 'Kertas & ATK', unit: 'Rim', hpp: 40000, price: 52000, stock: 8, minStock: 2 },
                { id: 'P003', code: 'BRG-003', name: 'Banner Flexi China 280gsm (Meter)', category: 'Cetak & Banner', unit: 'Meter', hpp: 12000, price: 20000, stock: 45, minStock: 10 },
                { id: 'P004', code: 'BRG-004', name: 'Print Head L3110 / L120 Original', category: 'Sparepart', unit: 'Pcs', hpp: 650000, price: 780000, stock: 2, minStock: 1 }
            ],
            customers: [
                { id: 'C001', name: 'Budi Santoso', phone: '081234567890', address: 'Jl. Merdeka No. 12' },
                { id: 'C002', name: 'Siti Aminah', phone: '089876543210', address: 'Jl. Melati Blok A3' }
            ],
            services: [
                { id: 'SRV-001', date: '2026-06-01', customerName: 'Budi Santoso', phone: '081234567890', device: 'Epson L3110', complaint: 'Hasil cetak bergaris putih / head buntu', technician: 'Rian Teknisi', estCost: 150000, dp: 50000, status: 'Pengerjaan', paymentStatus: 'Belum Lunas' }
            ],
            transactions: [
                { id: 'TRX-101', date: '2026-06-01 10:30', customer: 'Siti Aminah', items: [{name: 'Kertas A4 Sinar Dunia 75gsm', qty: 2, price: 52000}], total: 104000, payMethod: 'QRIS (BCA)', cashReceived: 104000, change: 0 }
            ],
            debts: [
                { id: 'DBT-001', type: 'Piutang Servis', target: 'Budi Santoso', refId: 'SRV-001', amount: 100000, status: 'Belum Lunas', date: '2026-06-01' },
                { id: 'DBT-002', type: 'Hutang Suplier', target: 'PT Jaya Sparepartindo', refId: 'SUP-09', amount: 1300000, status: 'Belum Lunas', date: '2026-05-28' }
            ],
            
            // POS Cart State
            posCart: [],
            posCustomer: '',
            posDiscount: 0,
            posPayMethod: 'Tunai',
            posBank: 'BCA',
            posCashGiven: 0
        };

        const passwords = {
            'Admin': 'admin123',
            'Kasir': 'kasir123',
            'Teknisi': 'teknisi123'
        };

        let pendingRole = '';

        // --- INISIALISASI ---
        window.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            renderNavigation();
            renderActiveTab();
            lucide.createIcons();
            checkLowStock();
        });

        function saveToLocalStorage() {
            localStorage.setItem('joyprint_state', JSON.stringify(appState));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('joyprint_state');
            if (saved) {
                try {
                    appState = JSON.parse(saved);
                } catch(e) { console.error(e); }
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toastAlert');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = document.getElementById('toastIcon');
            
            msgEl.innerText = msg;
            iconEl.setAttribute('data-lucide', type === 'success' ? 'check-circle' : 'alert-circle');
            lucide.createIcons();
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function promptChangeRole() {
            const roles = ['Admin', 'Kasir', 'Teknisi'];
            const currentIndex = roles.indexOf(appState.role);
            pendingRole = roles[(currentIndex + 1) % roles.length];
            
            document.getElementById('targetRoleName').innerText = pendingRole;
            document.getElementById('authPasswordInput').value = '';
            document.getElementById('authErrorMsg').classList.add('hidden');
            document.getElementById('authModal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.add('hidden');
        }

        function verifyPassword(e) {
            e.preventDefault();
            const pass = document.getElementById('authPasswordInput').value;
            if (pass === passwords[pendingRole]) {
                appState.role = pendingRole;
                closeAuthModal();
                renderNavigation();
                renderActiveTab();
                document.getElementById('currentRoleBadge').innerText = appState.role + (appState.role === 'Admin' ? ' Utama' : '');
                showToast(`Berhasil beralih ke peran ${appState.role}`);
                saveToLocalStorage();
            } else {
                document.getElementById('authErrorMsg').classList.remove('hidden');
            }
        }

        // --- NAVIGASI & MENU ---
        const menuConfig = [
            { id: 'dashboard', name: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['Admin', 'Kasir', 'Teknisi'] },
            { id: 'pos', name: 'Kasir / POS', icon: 'shopping-cart', roles: ['Admin', 'Kasir'] },
            { id: 'servis', name: 'Order Servis', icon: 'wrench', roles: ['Admin', 'Kasir', 'Teknisi'] },
            { id: 'stok', name: 'Stok & Sparepart', icon: 'package', roles: ['Admin', 'Kasir', 'Teknisi'] },
            { id: 'pelanggan', name: 'Data Pelanggan', icon: 'users', roles: ['Admin', 'Kasir', 'Teknisi'] },
            { id: 'hutang', name: 'Hutang & Piutang', icon: 'receipt', roles: ['Admin', 'Kasir'] },
            { id: 'riwayat', name: 'Riwayat Transaksi', icon: 'history', roles: ['Admin', 'Kasir'] },
        ];

        function renderNavigation() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = '';
            
            const allowedMenus = menuConfig.filter(m => m.roles.includes(appState.role));
            
            allowedMenus.forEach(m => {
                const isActive = appState.activeTab === m.id;
                const btn = document.createElement('button');
                btn.onclick = () => switchTab(m.id);
                btn.className = `w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${isActive ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/25' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`;
                btn.innerHTML = `<i data-lucide="${m.icon}" class="w-4 h-4"></i> ${m.name}`;
                nav.appendChild(btn);
            });
            lucide.createIcons();
        }

        function switchTab(tabId) {
            const menu = menuConfig.find(m => m.id === tabId);
            if (menu && !menu.roles.includes(appState.role)) {
                showToast('Akses ditolak untuk peran ini!', 'error');
                return;
            }
            appState.activeTab = tabId;
            document.getElementById('pageTitle').innerText = menu ? menu.name : 'Dashboard';
            renderNavigation();
            renderActiveTab();
        }

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('w-64');
            sb.classList.toggle('w-20');
        }

        function toggleDarkMode() {
            showToast('Mode tema tersimpan');
        }

        function checkLowStock() {
            const lowCount = appState.products.filter(p => p.stock <= p.minStock).length;
            const badge = document.getElementById('lowStockBadge');
            if (lowCount > 0) {
                badge.innerText = lowCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- EXPORT & IMPORT EXCEL MENGGUNAKAN SHEETJS ---
        function exportToExcel() {
            const wb = XLSX.utils.book_new();
            
            // Sheet Produk
            const wsProducts = XLSX.utils.json_to_sheet(appState.products);
            XLSX.utils.book_append_sheet(wb, wsProducts, "Stok Barang");
            
            // Sheet Pelanggan
            const wsCustomers = XLSX.utils.json_to_sheet(appState.customers);
            XLSX.utils.book_append_sheet(wb, wsCustomers, "Pelanggan");

            // Sheet Servis
            const wsServices = XLSX.utils.json_to_sheet(appState.services);
            XLSX.utils.book_append_sheet(wb, wsServices, "Servis");

            // Sheet Transaksi
            const wsTrans = XLSX.utils.json_to_sheet(appState.transactions.map(t => ({
                id: t.id, date: t.date, customer: t.customer, total: t.total, payMethod: t.payMethod
            })));
            XLSX.utils.book_append_sheet(wb, wsTrans, "Transaksi POS");

            XLSX.writeFile(wb, `JoyPrint_Backup_${new Date().toISOString().slice(0,10)}.xlsx`);
            showToast('Data berhasil diexport ke Excel!');
        }

        function importFromExcel(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    if (workbook.Sheets["Stok Barang"]) {
                        appState.products = XLSX.utils.sheet_to_json(workbook.Sheets["Stok Barang"]);
                    }
                    if (workbook.Sheets["Pelanggan"]) {
                        appState.customers = XLSX.utils.sheet_to_json(workbook.Sheets["Pelanggan"]);
                    }
                    if (workbook.Sheets["Servis"]) {
                        appState.services = XLSX.utils.sheet_to_json(workbook.Sheets["Servis"]);
                    }
                    
                    saveToLocalStorage();
                    renderActiveTab();
                    checkLowStock();
                    showToast('Data berhasil diimport dari Excel!');
                } catch(err) {
                    console.error(err);
                    showToast('Gagal membaca file Excel!', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderActiveTab() {
            const container = document.getElementById('mainContent');
            container.innerHTML = '';

            switch(appState.activeTab) {
                case 'dashboard': renderDashboard(container); break;
                case 'pos': renderPOS(container); break;
                case 'servis': renderServis(container); break;
                case 'stok': renderStok(container); break;
                case 'pelanggan': renderPelanggan(container); break;
                case 'hutang': renderHutang(container); break;
                case 'riwayat': renderRiwayat(container); break;
            }
            lucide.createIcons();
        }

        // --- 1. DASHBOARD ---
        function renderDashboard(el) {
            const totalOmset = appState.transactions.reduce((acc, t) => acc + t.total, 0);
            const activeServicesCount = appState.services.filter(s => s.status !== 'Sudah Diambil').length;
            const lowStockCount = appState.products.filter(p => p.stock <= p.minStock).length;
            const totalPiutang = appState.debts.filter(d => d.type.includes('Piutang') && d.status === 'Belum Lunas').reduce((a,b)=>a+b.amount,0);

            el.innerHTML = `
                <div class="space-y-6">
                    <!-- Stats Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                            <div class="flex items-center justify-between text-slate-400 mb-2">
                                <span class="text-xs font-medium uppercase">Total Omset Penjualan</span>
                                <i data-lucide="trending-up" class="w-5 h-5 text-emerald-400"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">Rp ${totalOmset.toLocaleString('id-ID')}</div>
                            <span class="text-[10px] text-emerald-400 mt-1 block">Real-time update sistem</span>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                            <div class="flex items-center justify-between text-slate-400 mb-2">
                                <span class="text-xs font-medium uppercase">Servis Aktif / Masuk</span>
                                <i data-lucide="wrench" class="w-5 h-5 text-cyan-400"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">${activeServicesCount} Unit</div>
                            <span class="text-[10px] text-cyan-400 mt-1 block">Perlu pengerjaan / konfirmasi</span>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                            <div class="flex items-center justify-between text-slate-400 mb-2">
                                <span class="text-xs font-medium uppercase">Stok Menipis</span>
                                <i data-lucide="alert-triangle" class="w-5 h-5 text-rose-400"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">${lowStockCount} Item</div>
                            <span class="text-[10px] text-rose-400 mt-1 block">Segera lakukan restock</span>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                            <div class="flex items-center justify-between text-slate-400 mb-2">
                                <span class="text-xs font-medium uppercase">Piutang Pelanggan</span>
                                <i data-lucide="file-text" class="w-5 h-5 text-amber-400"></i>
                            </div>
                            <div class="text-2xl font-bold text-white">Rp ${totalPiutang.toLocaleString('id-ID')}</div>
                            <span class="text-[10px] text-amber-400 mt-1 block">Belum lunas dari servis & penjualan</span>
                        </div>
                    </div>

                    <!-- Quick Action & Recent Activities -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5">
                            <h3 class="text-base font-bold text-white mb-4 flex items-center gap-2">
                                <i data-lucide="activity" class="w-5 h-5 text-cyan-400"></i> Ringkasan Aktivitas Terkini
                            </h3>
                            <div class="space-y-3">
                                ${appState.transactions.slice(0, 5).map(t => `
                                    <div class="flex items-center justify-between p-3 bg-slate-800/40 rounded-xl border border-slate-800 text-sm">
                                        <div class="flex items-center gap-3">
                                            <div class="bg-emerald-500/10 p-2 rounded-lg text-emerald-400"><i data-lucide="shopping-cart" class="w-4 h-4"></i></div>
                                            <div>
                                                <div class="font-semibold text-white">Penjualan POS (${t.id})</div>
                                                <div class="text-xs text-slate-400">${t.customer} • Pembayaran: ${t.payMethod}</div>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <div class="font-bold text-emerald-400">+Rp ${t.total.toLocaleString('id-ID')}</div>
                                            <div class="text-[10px] text-slate-400">${t.date}</div>
                                        </div>
                                    </div>
                                `).join('')}
                                ${appState.transactions.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">Belum ada transaksi tercatat.</p>' : ''}
                            </div>
                        </div>

        function filterPOSProducts() {

            const filtered = appState.products.filter(p => {
                const matchQ = p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query);

                return matchQ && matchC;
            });

            grid.innerHTML = filtered.map(p => `
                <div onclick="addToPOSCart('${p.id}')" class="bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 hover:border-cyan-500/50 rounded-xl p-3 flex flex-col justify-between cursor-pointer transition group">

        function addToPOSCart(productId) {
            const prod = appState.products.find(p => p.id === productId);
            if (!prod) return;
            if (prod.stock <= 0) {
                showToast('Stok barang habis!', 'error');
                return;
            }

            const existing = appState.posCart.find(item => item.id === productId);
            if (existing) {
                if (existing.qty + 1 > prod.stock) {
                    showToast('Jumlah melebihi stok tersedia!', 'error');
                    return;
                }
                existing.qty += 1;
            } else {
                appState.posCart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1, stock: prod.stock });
            }
            renderPOSCart();
        }

        function updateCartQty(productId, delta) {
            const item = appState.posCart.find(i => i.id === productId);
            if (!item) return;
            const prod = appState.products.find(p => p.id === productId);
            
            const newQty = item.qty + delta;
            if (newQty <= 0) {
                appState.posCart = appState.posCart.filter(i => i.id !== productId);
            } else if (newQty > prod.stock) {
                showToast('Stok tidak mencukupi!', 'error');
                return;
            } else {
                item.qty = newQty;
            }
            renderPOSCart();
        }

        function clearPOSCart() {
            appState.posCart = [];
            renderPOSCart();
        }

        function renderPOSCart() {
            const list = document.getElementById('posCartList');
            if (!list) return;

            if (appState.posCart.length === 0) {
                list.innerHTML = '<div class="text-center text-xs text-slate-500 py-6">Keranjang kosong. Pilih barang di sebelah kiri.</div>';
            } else {
                list.innerHTML = appState.posCart.map(i => `
                    <div class="flex items-center justify-between bg-slate-800/40 p-2 rounded-lg text-xs">
                        <div class="flex-1 pr-2">
                            <div class="font-semibold text-white line-clamp-1">${i.name}</div>
                            <div class="text-[10px] text-slate-400">Rp ${i.price.toLocaleString('id-ID')} x ${i.qty}</div>
                        </div>

                            <button onclick="updateCartQty('${i.id}', -1)" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded flex items-center justify-center text-white">-</button>

                            <button onclick="updateCartQty('${i.id}', 1)" class="w-6 h-6 bg-slate-700 hover:bg-slate-600 rounded flex items-center justify-center text-white">+</button>
                        </div>
                    </div>
                `).join('');
            }
            updatePOSCalculation();
        }

        function updatePOSCalculation() {
            const subtotal = appState.posCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const discInput = document.getElementById('posDiscountInput');
            const discount = discInput ? parseFloat(discInput.value) || 0 : 0;
            appState.posDiscount = discount;

            const grandTotal = Math.max(0, subtotal - discount);

            const subEl = document.getElementById('posSubtotal');
            const totEl = document.getElementById('posGrandTotal');
            if (subEl) subEl.innerText = `Rp ${subtotal.toLocaleString('id-ID')}`;
            if (totEl) totEl.innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;

            calculateChange();
        }

        function changePayMethod(method) {
            appState.posPayMethod = method;
            const cashContainer = document.getElementById('cashInputContainer');
            const changeContainer = document.getElementById('changeDisplayContainer');
            if (method === 'Piutang / Tempo') {
                if (cashContainer) cashContainer.style.display = 'none';
                if (changeContainer) changeContainer.style.display = 'none';
            } else {
                if (cashContainer) cashContainer.style.display = 'block';
                if (changeContainer) changeContainer.style.display = 'flex';
            }
        }

        function calculateChange() {
            const subtotal = appState.posCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const grandTotal = Math.max(0, subtotal - appState.posDiscount);
            const cashInput = document.getElementById('posCashInput');
            const cash = cashInput ? parseFloat(cashInput.value) || 0 : 0;
            appState.posCashGiven = cash;

            const change = cash - grandTotal;
            const changeText = document.getElementById('posChangeText');
            if (changeText) {
                changeText.innerText = `Rp ${Math.max(0, change).toLocaleString('id-ID')}`;
            }
        }

        function processCheckout() {
            if (appState.posCart.length === 0) {
                showToast('Keranjang masih kosong!', 'error');
                return;
            }

            const subtotal = appState.posCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const grandTotal = Math.max(0, subtotal - appState.posDiscount);

            if (appState.posPayMethod === 'Tunai' && appState.posCashGiven < grandTotal) {
                showToast('Uang tunai kurang dari total belanja!', 'error');
                return;
            }

            // Kurangi stok produk
            appState.posCart.forEach(cartItem => {
                const p = appState.products.find(prod => prod.id === cartItem.id);
                if (p) {
                    p.stock -= cartItem.qty;
                }
            });

            const trxId = 'TRX-' + Math.floor(1000 + Math.random() * 9000);
            const now = new Date().toISOString().replace('T', ' ').slice(0, 16);

            const newTrx = {
                id: trxId,
                date: now,
                customer: document.getElementById('posCustomerSelect')?.value || 'Umum / Guest',
                items: [...appState.posCart],
                total: grandTotal,
                payMethod: appState.posPayMethod,
                cashReceived: appState.posPayMethod === 'Piutang / Tempo' ? 0 : appState.posCashGiven,
                change: appState.posPayMethod === 'Piutang / Tempo' ? 0 : Math.max(0, appState.posCashGiven - grandTotal)
            };

            appState.transactions.unshift(newTrx);

            // Jika Piutang, catat ke tabel hutang
            if (appState.posPayMethod === 'Piutang / Tempo') {
                appState.debts.unshift({
                    id: 'DBT-' + Math.floor(1000 + Math.random() * 9000),
                    type: 'Piutang Penjualan',
                    target: newTrx.customer,
                    refId: trxId,
                    amount: grandTotal,
                    status: 'Belum Lunas',
                    date: now.slice(0, 10)
                });
            }

            appState.posCart = [];
            saveToLocalStorage();
            checkLowStock();
            showToast(`Transaksi ${trxId} berhasil!`);
            renderPOS();
        }

        function saveNewServis(e) {
            e.preventDefault();
            const srvId = 'SRV-' + Math.floor(1000 + Math.random() * 9000);
            const date = new Date().toISOString().slice(0, 10);
            const name = document.getElementById('srvCustName').value;
            const phone = document.getElementById('srvPhone').value;
            const estCost = parseFloat(document.getElementById('srvEstCost').value) || 0;
            const dp = parseFloat(document.getElementById('srvDp').value) || 0;

            const newSrv = {
                id: srvId,
                date: date,
                customerName: name,
                phone: phone,
                device: document.getElementById('srvDevice').value,
                complaint: document.getElementById('srvComplaint').value,
                technician: document.getElementById('srvTech').value,
                estCost: estCost,
                dp: dp,
                status: 'Menunggu Antrian',
                paymentStatus: estCost - dp <= 0 ? 'Lunas' : 'Belum Lunas'
            };

            appState.services.unshift(newSrv);

            // Jika ada sisa pembayaran, masukkan ke piutang
            if (estCost - dp > 0) {
                appState.debts.unshift({
                    id: 'DBT-' + Math.floor(1000 + Math.random() * 9000),
                    type: 'Piutang Servis',
                    target: name,
                    refId: srvId,
                    amount: estCost - dp,
                    status: 'Belum Lunas',
                    date: date
                });
            }

            saveToLocalStorage();
            closeModal();
            showToast('Order servis berhasil disimpan!');
            renderServisTable();
        }

                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-800/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                                        <th class="p-4">Jenis / Ref</th>
                                        <th class="p-4">Target / Pihak</th>
                                        <th class="p-4">Tanggal</th>
                                        <th class="p-4">Jumlah Nominal</th>
                                        <th class="p-4">Status</th>
                                        <th class="p-4 text-center">Aksi Pelunasan</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/60">
                                    ${appState.debts.map(d => `
                                        <tr class="hover:bg-slate-800/40 transition">
                                            <td class="p-4 font-semibold text-white">${d.type} <div class="text-xs text-slate-400">${d.refId}</div></td>
                                            <td class="p-4 text-slate-200">${d.target}</td>
                                            <td class="p-4 text-slate-400 text-xs">${d.date}</td>
                                            <td class="p-4 font-bold text-amber-400">Rp ${d.amount.toLocaleString('id-ID')}</td>
                                            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${d.status === 'Lunas' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20'}">${d.status}</span></td>
                                            <td class="p-4 text-center">
                                                ${d.status === 'Belum Lunas' ? `<button onclick="markDebtPaid('${d.id}')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium transition">Lunasi Dari Kas</button>` : '<span class="text-xs text-emerald-400 font-semibold">Lunas</span>'}
                                            </td>
                                        </tr>
                                    `).join('') || '<tr><td colspan="6" class="text-center py-8 text-slate-500 text-xs">Tidak ada catatan hutang/piutang aktif.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function openSupplierPurchaseModal() {
            const modal = document.getElementById('globalModal');
            const wrapper = document.getElementById('modalContentWrapper');
            
            wrapper.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2">
                        <i data-lucide="truck" class="text-cyan-400 w-5 h-5"></i> Catat Pembelian Barang dari Suplier
                    </h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <form onsubmit="saveSupplierPurchase(event)" class="space-y-4 text-sm">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Nama Suplier / PT</label>
                        <input type="text" id="supName" required placeholder="Contoh: PT Jaya Sparepartindo" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Keterangan / Item Barang Pembelian</label>
                        <input type="text" id="supDesc" required placeholder="Contoh: Pembelian Tinta & Sparepart Printer" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Total Tagihan (Rp)</label>
                            <input type="number" id="supAmount" required placeholder="1500000" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Status Pembayaran Awal</label>
                            <select id="supStatusPay" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-white">
                                <option value="Belum Lunas">Hutang (Belum Lunas)</option>
                                <option value="Lunas">Tunai (Langsung Lunas dari Kas)</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm">Batal</button>
                        <button type="submit" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-sm font-semibold">Simpan Transaksi Suplier</button>
                    </div>
                </form>
            `;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function saveSupplierPurchase(e) {
            e.preventDefault();
            const supName = document.getElementById('supName').value;
            const supDesc = document.getElementById('supDesc').value;
            const amount = parseFloat(document.getElementById('supAmount').value) || 0;
            const statusPay = document.getElementById('supStatusPay').value;
            const date = new Date().toISOString().slice(0, 10);
            const refId = 'SUP-' + Math.floor(100 + Math.random() * 900);

            // Tambahkan ke buku hutang
            appState.debts.unshift({
                id: 'DBT-' + Math.floor(1000 + Math.random() * 9000),
                type: 'Hutang Suplier (' + supDesc + ')',
                target: supName,
                refId: refId,
                amount: amount,
                status: statusPay,
                date: date
            });

            // Jika langsung lunas, catat juga sebagai pengeluaran / transaksi kas jika diinginkan
            saveToLocalStorage();
            closeModal();
            showToast('Pembelian suplier berhasil dicatat!');
            renderHutang(document.getElementById('mainContent'));
        }

        function markDebtPaid(id) {
            const d = appState.debts.find(item => item.id === id);
            if (d) {
                d.status = 'Lunas';
                saveToLocalStorage();
                showToast(`Pelunasan "${d.target}" berhasil dicatat dari kas!`);
                renderHutang(document.getElementById('mainContent'));
            }
        }

        // --- 7. RIWAYAT TRANSAKSI ---
        function renderRiwayat(el) {
            el.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                        <div class="p-4 border-b border-slate-800">
                            <h3 class="font-bold text-white">Riwayat Transaksi Penjualan Kasir (POS)</h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-800/60 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                                        <th class="p-4">ID Transaksi / Waktu</th>
                                        <th class="p-4">Pelanggan</th>
                                        <th class="p-4">Detail Pembelian</th>
                                        <th class="p-4">Metode Bayar</th>
                                        <th class="p-4">Total</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/60">
                                    ${appState.transactions.map(t => `
                                        <tr class="hover:bg-slate-800/40 transition">
                                            <td class="p-4 font-bold text-white">${t.id} <div class="text-xs text-slate-400">${t.date}</div></td>
                                            <td class="p-4 text-slate-200">${t.customer}</td>
                                            <td class="p-4 text-xs text-slate-300">
                                                ${t.items.map(i => `${i.name} (x${i.qty})`).join(', ')}
                                            </td>
                                            <td class="p-4 text-xs text-cyan-400 font-semibold">${t.payMethod}</td>
                                            <td class="p-4 font-bold text-emerald-400">Rp ${t.total.toLocaleString('id-ID')}</td>
                                        </tr>
                                    `).join('') || '<tr><td colspan="5" class="text-center py-8 text-slate-500 text-xs">Belum ada riwayat transaksi.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('globalModal').classList.add('hidden');
        }
    </script>
</body>
</html>
