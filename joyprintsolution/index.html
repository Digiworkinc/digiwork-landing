    // =========================================================================
    // MODUL HUTANG & PIUTANG FLEKSIBEL (MANUAL INPUT, EDIT & CICILAN/BERTAHAP)
    // =========================================================================

    window.normalizeHPItem = function (hp) {
      const total = Number(hp.totalTagihan !== undefined ? hp.totalTagihan : hp.jumlah) || 0;
      const isLunas = hp.status === 'Lunas';
      const terbayar = Number(hp.terbayar !== undefined ? hp.terbayar : (isLunas ? total : 0)) || 0;
      const sisa = isLunas ? 0 : Math.max(0, total - terbayar);
      const status = isLunas ? 'Lunas' : (terbayar > 0 ? 'Dicicil' : (hp.status || 'Belum Lunas'));
      const riwayat = Array.isArray(hp.riwayatCicilan) ? hp.riwayatCicilan : [];
      return {
        ...hp,
        totalTagihan: total,
        terbayar,
        sisa,
        status,
        riwayatCicilan: riwayat,
        tanggal: hp.tanggal || (riwayat.length > 0 ? riwayat[0].tanggal : '') || hp.jatuhTempo || new Date().toISOString().split('T')[0],
        keterangan: hp.keterangan || ''
      };
    };

    window._hpFilterJenis = window._hpFilterJenis || 'all';
    window._hpFilterStatus = window._hpFilterStatus || 'all';
    window._hpSearchQuery = window._hpSearchQuery || '';

    window.setHPFilterJenis = function (jenis) {
      window._hpFilterJenis = jenis;
      window.renderPage();
    };

    window.setHPFilterStatus = function (status) {
      window._hpFilterStatus = status;
      window.renderPage();
    };

    window.onHPSearchInput = function (q) {
      window._hpSearchQuery = (q || '').trim().toLowerCase();
      const tbody = document.getElementById('hp-table-body');
      if (tbody) {
        tbody.innerHTML = renderHutangPiutangRows();
        lucide.createIcons();
      }
    };

    function renderHutangPiutangRows() {
      const todayStr = new Date().toISOString().split('T')[0];
      const items = (state.hutangpiutang || []).map(normalizeHPItem);

      const filtered = items.filter(hp => {
        if (window._hpFilterJenis !== 'all' && hp.jenis !== window._hpFilterJenis) return false;
        if (window._hpFilterStatus !== 'all') {
          if (window._hpFilterStatus === 'Belum Lunas' && hp.status !== 'Belum Lunas') return false;
          if (window._hpFilterStatus === 'Dicicil' && hp.status !== 'Dicicil') return false;
          if (window._hpFilterStatus === 'Lunas' && hp.status !== 'Lunas') return false;
        }
        if (window._hpSearchQuery) {
          const q = window._hpSearchQuery;
          const matchPihak = (hp.pihak || '').toLowerCase().includes(q);
          const matchRef = (hp.noRef || '').toLowerCase().includes(q);
          const matchId = (hp.id || '').toLowerCase().includes(q);
          const matchKete = (hp.keterangan || '').toLowerCase().includes(q);
          if (!matchPihak && !matchRef && !matchId && !matchKete) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        return `
          <tr>
            <td colspan="10" class="p-8 text-center text-slate-400">
              <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40"></i>
              <p class="font-semibold text-sm">Tidak ada data hutang / piutang yang sesuai filter atau pencarian.</p>
            </td>
          </tr>
        `;
      }

      return filtered.map(hp => {
        const percent = hp.totalTagihan > 0 ? Math.min(100, Math.round((hp.terbayar / hp.totalTagihan) * 100)) : (hp.status === 'Lunas' ? 100 : 0);
        const isOverdue = hp.status !== 'Lunas' && hp.jatuhTempo && hp.jatuhTempo !== '-' && hp.jatuhTempo < todayStr;
        const cicilanCount = (hp.riwayatCicilan || []).length;

        return `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition text-sm">
            <td class="p-3.5">
              <span class="font-mono font-bold text-cyan-600 dark:text-cyan-400 block">${hp.id}</span>

            ? 'bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 border border-cyan-500/20'

          }">

            <td class="p-3.5">
              <div class="font-bold text-slate-800 dark:text-slate-100">${hp.pihak}</div>
              ${hp.keterangan ? `<div class="text-[11px] text-slate-500 line-clamp-1 italic">${hp.keterangan}</div>` : ''}
            </td>
            <td class="p-3.5">
              <span class="font-mono text-xs px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-300 font-medium">
                ${hp.noRef || '-'}
              </span>
            </td>
            <td class="p-3.5 font-bold text-slate-700 dark:text-slate-200">
              ${formatRp(hp.totalTagihan)}
            </td>
            <td class="p-3.5">
              <div class="flex items-center justify-between text-xs font-bold text-emerald-600 dark:text-emerald-400 mb-1">
                <span>${formatRp(hp.terbayar)}</span>
                <span class="text-[10px] text-slate-400">(${percent}%)</span>
              </div>
              <div class="w-28 bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                <div class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: ${percent}%;"></div>
              </div>
              ${cicilanCount > 0 ? `
                <span class="text-[10px] text-slate-400 mt-0.5 block">${cicilanCount}x Pembayaran</span>
              ` : ''}
            </td>
            <td class="p-3.5">
              <span class="font-extrabold ${hp.sisa > 0 ? 'text-rose-600 dark:text-rose-400' : 'text-emerald-500'}">
                ${formatRp(hp.sisa)}
              </span>
            </td>
            <td class="p-3.5">
              <span class="text-xs ${isOverdue ? 'font-bold text-rose-500' : 'text-slate-600 dark:text-slate-400'} block">
                ${hp.jatuhTempo || '-'}
              </span>
              ${isOverdue ? `
                <span class="text-[10px] px-1.5 py-0.5 rounded bg-rose-500/10 text-rose-500 font-semibold border border-rose-500/20 inline-block mt-0.5">
                  Jatuh Tempo!
                </span>
              ` : ''}
            </td>
            <td class="p-3.5">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold inline-block ${hp.status === 'Lunas'
            ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20'
            : hp.status === 'Dicicil'
              ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20'
              : 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20'
          }">
                ${hp.status}

            <td class="p-3.5 text-center">
              <div class="flex items-center justify-center space-x-1.5">
                ${hp.status !== 'Lunas' ? `
                  <button onclick="openBayarCicilanModal('${hp.id}')" title="Bayar Cicilan / Pelunasan"

                  <i data-lucide="eye" class="w-4 h-4"></i>
                </button>
                <button onclick="openEditHutangPiutangModal('${hp.id}')" title="Edit Data"
                  class="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-cyan-600 dark:text-cyan-400 transition">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                </button>
                <button onclick="hapusHutangPiutang('${hp.id}')" title="Hapus Catatan"
                  class="p-1.5 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 transition">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    window.setTempoPreset = function (days) {
      const input = document.getElementById('hp-jatuh-tempo') || document.getElementById('edit-hp-jatuh-tempo');
      if (input) {
        const d = new Date(Date.now() + days * 24 * 60 * 60 * 1000);
        input.value = d.toISOString().split('T')[0];
      }
    };

    window.hitungHPSisaPreview = function () {
      const total = parseFloat(document.getElementById('hp-total')?.value) || 0;
      const bayar = parseFloat(document.getElementById('hp-bayar-awal')?.value) || 0;
      const sisa = Math.max(0, total - bayar);
      const sisaEl = document.getElementById('hp-sisa-preview');
      const detailWrap = document.getElementById('hp-bayar-detail-wrapper');

      if (sisaEl) {
        sisaEl.innerText = formatRp(sisa);
        if (sisa === 0 && total > 0) {
          sisaEl.className = 'font-black text-emerald-500 text-sm';
        } else {
          sisaEl.className = 'font-black text-rose-500 text-sm';
        }
      }

      if (detailWrap) {
        detailWrap.classList.toggle('hidden', bayar <= 0);
      }
    };

    window.simpanHutangPiutangBaru = async function (e) {
      e.preventDefault();
      const jenisRadio = document.querySelector('input[name="hp-jenis"]:checked');
      const jenis = jenisRadio ? jenisRadio.value : 'Piutang';
      const pihak = (document.getElementById('hp-pihak')?.value || '').trim();
      const noRef = (document.getElementById('hp-noref')?.value || '').trim();
      const tanggal = document.getElementById('hp-tanggal')?.value || new Date().toISOString().split('T')[0];
      const jatuhTempo = document.getElementById('hp-jatuh-tempo')?.value || '';
      const total = parseFloat(document.getElementById('hp-total')?.value) || 0;
      const bayarAwal = parseFloat(document.getElementById('hp-bayar-awal')?.value) || 0;
      const keterangan = (document.getElementById('hp-keterangan')?.value || '').trim();
      const catatKas = document.getElementById('hp-catat-kas')?.checked || false;
      const metodeAwal = document.getElementById('hp-metode-awal')?.value || 'Tunai';
      const catatanAwal = (document.getElementById('hp-catatan-awal')?.value || '').trim();

      if (!pihak) {
        alert('Nama pihak terkait / pelanggan wajib diisi!');
        return;
      }
      if (total <= 0) {
        alert('Total nominal tagihan pokok harus lebih besar dari 0!');
        return;
      }

      const sisa = Math.max(0, total - bayarAwal);
      const status = (sisa <= 0) ? 'Lunas' : (bayarAwal > 0 ? 'Dicicil' : 'Belum Lunas');

      // Riwayat cicilan awal jika ada pembayaran DP / cicilan pertama
      const riwayatCicilan = [];
      if (bayarAwal > 0) {
        riwayatCicilan.push({
          id: `CICIL-${Date.now()}`,
          tanggal,
          jumlah: bayarAwal,
          metode: metodeAwal,
          catatan: catatanAwal || (sisa <= 0 ? 'Pelunasan Penuh' : 'Pembayaran Awal / DP')
        });
      }

      // Generate ID Unik
      const hpId = `HP-${String((state.hutangpiutang || []).length + 1).padStart(3, '0')}`;

      const newHP = {
        id: hpId,
        jenis,
        pihak,
        noRef: noRef || hpId,
        tanggal,
        jatuhTempo: jatuhTempo || tanggal,
        totalTagihan: total,
        terbayar: bayarAwal,
        jumlah: sisa, // Sisa tagihan
        status,
        keterangan,
        riwayatCicilan
      };

      await dbSave('hutangpiutang', hpId, newHP);

      // Sinkronisasi ke Buku Kas jika dicentang dan ada pembayaran awal
      if (catatKas && bayarAwal > 0) {
        const kasId = `KAS-00${(state.kas || []).length + 1}`;
        if (jenis === 'Piutang') {
          await dbSave('kas', kasId, {
            id: kasId,
            tanggal,
            tipe: 'Masuk',
            kategori: sisa <= 0 ? 'Pelunasan Piutang' : 'Cicilan Piutang',
            keterangan: `${sisa <= 0 ? 'Pelunasan' : 'DP/Cicilan'} Piutang #${hpId} (${pihak} - Ref: ${noRef || '-'}) via ${metodeAwal}`,
            jumlah: bayarAwal
          });
        } else {
          await dbSave('kas', kasId, {
            id: kasId,
            tanggal,
            tipe: 'Keluar',
            kategori: sisa <= 0 ? 'Pelunasan Hutang' : 'Cicilan Hutang',
            keterangan: `${sisa <= 0 ? 'Pelunasan' : 'DP/Cicilan'} Hutang Toko #${hpId} ke ${pihak} (Ref: ${noRef || '-'}) via ${metodeAwal}`,
            jumlah: bayarAwal
          });
        }
      }

      closeModal();
      showNotificationToast(`Catatan ${jenis} #${hpId} (${formatRp(total)}) berhasil disimpan!`);
    };

    window.hitungEditHPSisa = function () {
      const total = parseFloat(document.getElementById('edit-hp-total')?.value) || 0;
      const terbayar = parseFloat(document.getElementById('edit-hp-terbayar')?.value) || 0;
      const sisa = Math.max(0, total - terbayar);
      const sisaEl = document.getElementById('edit-hp-sisa-preview');
      const statusSelect = document.getElementById('edit-hp-status');

      if (sisaEl) {
        sisaEl.innerText = formatRp(sisa);
        sisaEl.className = sisa === 0 && total > 0 ? 'font-black text-emerald-500 text-sm' : 'font-black text-rose-500 text-sm';
      }

      if (statusSelect) {
        if (sisa <= 0 && total > 0) {
          statusSelect.value = 'Lunas';
        } else if (terbayar > 0) {
          statusSelect.value = 'Dicicil';
        } else {
          statusSelect.value = 'Belum Lunas';
        }
      }
    };

    window.hapusCicilanRow = async function (hpId, cicilIndex) {
      if (!confirm('Hapus rincian pembayaran cicilan ini? Total sudah terbayar akan disesuaikan.')) return;
      const raw = (state.hutangpiutang || []).find(h => h.id === hpId);
      if (!raw) return;

      const hp = normalizeHPItem(raw);
      const riwayat = [...hp.riwayatCicilan];
      riwayat.splice(cicilIndex, 1);

      const terbayarBaru = riwayat.reduce((sum, c) => sum + (Number(c.jumlah) || 0), 0);
      const sisaBaru = Math.max(0, hp.totalTagihan - terbayarBaru);
      const statusBaru = (sisaBaru <= 0 && hp.totalTagihan > 0) ? 'Lunas' : (terbayarBaru > 0 ? 'Dicicil' : 'Belum Lunas');

      await dbUpdate('hutangpiutang', hpId, {
        riwayatCicilan: riwayat,
        terbayar: terbayarBaru,
        jumlah: sisaBaru,
        status: statusBaru
      });

      // Buka kembali modal edit dengan data terupdate
      openEditHutangPiutangModal(hpId);
      showNotificationToast('Rincian cicilan berhasil dihapus.');
    };

    window.simpanEditHutangPiutang = async function (e, id) {
      e.preventDefault();
      const jenis = document.getElementById('edit-hp-jenis')?.value || 'Piutang';
      const pihak = (document.getElementById('edit-hp-pihak')?.value || '').trim();
      const noRef = (document.getElementById('edit-hp-noref')?.value || '').trim();
      const tanggal = document.getElementById('edit-hp-tanggal')?.value || '';
      const jatuhTempo = document.getElementById('edit-hp-jatuh-tempo')?.value || '';
      const total = parseFloat(document.getElementById('edit-hp-total')?.value) || 0;
      const terbayar = parseFloat(document.getElementById('edit-hp-terbayar')?.value) || 0;
      const statusPilihan = document.getElementById('edit-hp-status')?.value || 'Belum Lunas';
      const keterangan = (document.getElementById('edit-hp-keterangan')?.value || '').trim();

      if (!pihak) {
        alert('Nama pihak terkait tidak boleh kosong!');
        return;
      }
      if (total <= 0) {
        alert('Total nominal tagihan pokok harus lebih dari 0!');
        return;
      }

      const sisa = statusPilihan === 'Lunas' ? 0 : Math.max(0, total - terbayar);
      const statusFinal = statusPilihan === 'Lunas' ? 'Lunas' : (sisa <= 0 ? 'Lunas' : (terbayar > 0 ? 'Dicicil' : statusPilihan));

      await dbUpdate('hutangpiutang', id, {
        jenis,
        pihak,
        noRef,
        tanggal,
        jatuhTempo,
        totalTagihan: total,
        terbayar: statusFinal === 'Lunas' && terbayar < total ? total : terbayar,
        jumlah: sisa,
        status: statusFinal,
        keterangan
      });

      closeModal();
      showNotificationToast(`Perubahan data #${id} berhasil disimpan!`);
    };

              <span class="font-black text-rose-600 dark:text-rose-400 text-base">${formatRp(hp.sisa)}</span>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden mt-1">
              <div class="bg-emerald-500 h-full rounded-full transition-all" style="width: ${percent}%;"></div>
            </div>

          <!-- Form Input Cicilan Baru -->
          <div class="space-y-3">

    window.simpanPembayaranCicilan = async function (e, id) {
      e.preventDefault();
      const raw = (state.hutangpiutang || []).find(h => h.id === id);
      if (!raw) return;
      const hp = normalizeHPItem(raw);

      const nominal = parseFloat(document.getElementById('cicil-nominal')?.value) || 0;
      const tanggal = document.getElementById('cicil-tanggal')?.value || new Date().toISOString().split('T')[0];
      const metode = document.getElementById('cicil-metode')?.value || 'Tunai';
      const catatan = (document.getElementById('cicil-catatan')?.value || '').trim();
      const catatKas = document.getElementById('cicil-catat-kas')?.checked || false;

      if (nominal <= 0) {
        alert('Nominal pembayaran cicilan harus lebih dari 0!');
        return;
      }
      if (nominal > hp.sisa) {
        alert(`Nominal pembayaran (${formatRp(nominal)}) melebihi sisa tagihan (${formatRp(hp.sisa)})!`);
        return;
      }

      const riwayatBaru = [...hp.riwayatCicilan];
      const cicilItem = {
        id: `CICIL-${Date.now()}`,
        tanggal,
        jumlah: nominal,
        metode,
        catatan: catatan || (nominal >= hp.sisa ? 'Pelunasan Sisa' : `Cicilan ke-${riwayatBaru.length + 1}`)
      };
      riwayatBaru.push(cicilItem);

      const terbayarBaru = hp.terbayar + nominal;
      const sisaBaru = Math.max(0, hp.totalTagihan - terbayarBaru);
      const statusBaru = (sisaBaru <= 0) ? 'Lunas' : 'Dicicil';

      await dbUpdate('hutangpiutang', id, {
        terbayar: terbayarBaru,
        jumlah: sisaBaru,
        status: statusBaru,
        riwayatCicilan: riwayatBaru
      });

      // Sinkronisasi ke Buku Kas

    window.exportAllDataToExcel = function () {
      if (typeof XLSX === 'undefined') {
        alert('Library SheetJS (XLSX) belum selesai dimuat. Pastikan koneksi internet aktif.');
        return;
      }

      try {
        const wb = XLSX.utils.book_new();

        // 1. STOK BARANG
        const stokRows = (state.stok || []).map(s => ({
          'Kode ID': s.id,
          'Nama Barang': s.nama,
          'Kategori': s.kategori,
          'Satuan': s.satuan || 'Pcs',
          'HPP Modal (Rp)': Number(s.hpp) || 0,
          'Harga Jual (Rp)': Number(s.harga) || 0,
          'Jumlah Stok': Number(s.jumlah) || 0,
          'Batas Min Stok': Number(s.minStok) || 0
        }));
        const wsStok = XLSX.utils.json_to_sheet(stokRows);
        wsStok['!cols'] = [{ wch: 15 }, { wch: 36 }, { wch: 18 }, { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 14 }, { wch: 16 }];
        XLSX.utils.book_append_sheet(wb, wsStok, 'Stok_Barang');

        // 2. DATA PELANGGAN
        const custRows = (state.pelanggan || []).map(p => ({
          'ID Pelanggan': p.id,
          'Nama Pelanggan': p.nama,
          'No Telepon': p.telepon || '',
          'Alamat': p.alamat || ''
        }));
        const wsCust = XLSX.utils.json_to_sheet(custRows);
        wsCust['!cols'] = [{ wch: 16 }, { wch: 28 }, { wch: 20 }, { wch: 40 }];
        XLSX.utils.book_append_sheet(wb, wsCust, 'Data_Pelanggan');

        // 3. KATEGORI STOK
        const katRows = (getKategoriStokList() || []).map(k => ({
          'Nama Kategori': k
        }));
        const wsKat = XLSX.utils.json_to_sheet(katRows);
        wsKat['!cols'] = [{ wch: 25 }];
        XLSX.utils.book_append_sheet(wb, wsKat, 'Kategori_Stok');

        // 4. TRANSAKSI SERVIS
        const srvRows = (state.servis || []).map(s => {
          const spSummary = (s.spareparts || []).map(sp => `${sp.nama} (${sp.qty}x @${sp.harga})`).join('; ');
          return {
            'ID Servis': s.id,
            'Tanggal': s.tanggal,
            'ID Pelanggan': s.pelangganId || '',
            'Nama Pelanggan': s.pelangganNama || '',
            'No Telepon': s.pelangganTelepon || '',
            'Alamat': s.pelangganAlamat || '',
            'Tipe Printer': s.printer || '',
            'Kelengkapan': s.kelengkapan || '',
            'Keluhan Kerusakan': s.keluhan || '',
            'Status Servis': s.status || '',
            'Biaya Jasa (Rp)': Number(s.biayaJasa) || 0,
            'Total Biaya (Rp)': Number(s.totalBiaya) || 0,
            'Status Bayar': s.statusBayar || '',
            'Bayar / DP (Rp)': Number(s.bayar) || 0,
            'Sisa Tagihan (Rp)': Number(s.sisa) || 0,
            'Ringkasan Sparepart': spSummary,
            'Raw Spareparts JSON': JSON.stringify(s.spareparts || [])
          };
        });
        const wsSrv = XLSX.utils.json_to_sheet(srvRows);
        wsSrv['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 16 }, { wch: 24 }, { wch: 18 }, { wch: 30 }, { wch: 20 }, { wch: 20 }, { wch: 30 }, { wch: 18 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 35 }, { wch: 40 }];
        XLSX.utils.book_append_sheet(wb, wsSrv, 'Transaksi_Servis');

        // 5. PENJUALAN POS
        const posRows = (state.penjualan || []).map(p => {
          const itemSummary = (p.items || []).map(i => `${i.nama} (${i.qty}x @${i.harga})`).join('; ');

            'ID Transaksi': p.id,
            'Tanggal': p.tanggal,
            'Pelanggan': p.pelangganNama || 'Umum / Cash',
            'Metode Bayar': p.metode || 'Tunai',

            'Laba Kotor (Rp)': Number(p.labaKotor) || 0,
            'Ringkasan Barang': itemSummary,
            'Raw Items JSON': JSON.stringify(p.items || [])

        const wsPos = XLSX.utils.json_to_sheet(posRows);

          'ID Pelanggan': d.pelangganId || '',

          'Nama Bahan Stok': d.stokNama || '',

          'Modal HPP Satuan (Rp)': Number(d.hppSatuan) || 0,
          'Total Modal HPP (Rp)': Number(d.totalModal) || 0,
          'Satuan': d.satuan || 'meter',

    window.handleExcelFileUpload = function (event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      if (typeof XLSX === 'undefined') {
        alert('Library SheetJS (XLSX) belum selesai dimuat. Pastikan Anda terhubung ke internet.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          parseAndPreviewExcelWorkbook(wb, file.name);
        } catch (err) {
          console.error('Error parsing Excel:', err);
          alert('Gagal membaca file Excel. Pastikan file berformat .xlsx atau .xls yang valid.');
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    };

    window.parseAndPreviewExcelWorkbook = function (wb, fileName) {
      const getCol = (row, ...keys) => {
        for (const k of keys) {
          if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
            return row[k];
          }
          const normK = k.toLowerCase().replace(/[^a-z0-9]/g, '');
          for (const actualKey of Object.keys(row)) {
            if (actualKey.toLowerCase().replace(/[^a-z0-9]/g, '') === normK) {
              const val = row[actualKey];
              if (val !== undefined && val !== null && String(val).trim() !== '') {
                return val;
              }
            }
          }
        }
        return null;
      };

      const parseNum = (val, defaultVal = 0) => {
        if (val === undefined || val === null) return defaultVal;
        if (typeof val === 'number') return isNaN(val) ? defaultVal : val;
        let s = String(val).replace(/Rp|\.|\s/gi, '').replace(',', '.').trim();
        let n = parseFloat(s);
        return isNaN(n) ? defaultVal : n;
      };

      const parsed = {
        stok: [],
        pelanggan: [],
        kategoriStok: [],
        servis: [],
        penjualan: [],
        dtf: [],
        pembelian: [],
        kas: [],
        operasional: [],
        hutangpiutang: []
      };

      wb.SheetNames.forEach(sheetName => {
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
        const sName = sheetName.toLowerCase().replace(/[^a-z]/g, '');

        if (sName.includes('stok') || sName.includes('barang') || sName.includes('sparepart') || sName.includes('item')) {
          rows.forEach((r, idx) => {
            const nama = getCol(r, 'Nama Barang', 'nama', 'Nama', 'Barang', 'Item', 'Deskripsi');
            if (!nama) return;
            const id = getCol(r, 'Kode ID', 'id', 'ID', 'Kode', 'Barcode') || `BRG-${String(state.stok.length + idx + 1).padStart(3, '0')}`;
            const kategori = getCol(r, 'Kategori', 'kategori', 'Category') || 'Barang';
            const satuan = getCol(r, 'Satuan', 'satuan', 'Unit') || 'Pcs';
            const hpp = parseNum(getCol(r, 'HPP Modal (Rp)', 'HPP Modal', 'hpp', 'HPP', 'Modal', 'cost'), 0);
            const harga = parseNum(getCol(r, 'Harga Jual (Rp)', 'Harga Jual', 'harga', 'Harga', 'price'), 0);
            const jumlah = parseInt(parseNum(getCol(r, 'Jumlah Stok', 'jumlah', 'Stok', 'qty', 'Qty', 'Stock'), 0));
            const minStok = parseInt(parseNum(getCol(r, 'Batas Min Stok', 'minStok', 'min', 'Min Stok'), 3));

            parsed.stok.push({
              id: String(id).trim(),
              nama: String(nama).trim(),
              kategori: String(kategori).trim(),
              satuan: String(satuan).trim(),
              hpp,
              harga,
              jumlah,
              minStok
            });
          });
        } else if (sName.includes('pelanggan') || sName.includes('customer') || sName.includes('cust') || sName.includes('kontak')) {
          rows.forEach((r, idx) => {
            const nama = getCol(r, 'Nama Pelanggan', 'nama', 'Nama', 'Customer', 'Client');
            if (!nama) return;
            const id = getCol(r, 'ID Pelanggan', 'id', 'ID', 'Kode') || `CUST-${String(state.pelanggan.length + idx + 1).padStart(3, '0')}`;
            const telepon = getCol(r, 'No Telepon', 'telepon', 'Telepon', 'No HP', 'No WA', 'HP', 'WA', 'Phone') || '';
            const alamat = getCol(r, 'Alamat', 'alamat', 'Address') || '';

            parsed.pelanggan.push({
              id: String(id).trim(),
              nama: String(nama).trim(),
              telepon: String(telepon).trim(),
              alamat: String(alamat).trim()
            });
          });
        } else if (sName.includes('kategori') || sName.includes('category')) {
          rows.forEach(r => {
            const kat = getCol(r, 'Nama Kategori', 'kategori', 'Kategori', 'Category');
            if (kat && typeof kat === 'string' && !parsed.kategoriStok.includes(kat.trim())) {
              parsed.kategoriStok.push(kat.trim());
            }
          });
        } else if (sName.includes('servis') || sName.includes('service')) {
          rows.forEach((r, idx) => {
            const id = getCol(r, 'ID Servis', 'id', 'ID', 'No Servis') || `SRV-${Date.now()}-${idx}`;

              try { sp = JSON.parse(rawSP); } catch (e) { }
            }
            parsed.servis.push({
              id: String(id).trim(),
              tanggal: String(getCol(r, 'Tanggal', 'tanggal') || new Date().toISOString().slice(0, 10)),
              pelangganId: String(getCol(r, 'ID Pelanggan', 'pelangganId') || ''),
              pelangganNama: String(getCol(r, 'Nama Pelanggan', 'pelangganNama') || 'Pelanggan'),

              biayaJasa: parseNum(getCol(r, 'Biaya Jasa (Rp)', 'biayaJasa', 'Biaya Jasa'), 0),
              spareparts: Array.isArray(sp) ? sp : [],
              totalBiaya: parseNum(getCol(r, 'Total Biaya (Rp)', 'totalBiaya', 'Total Biaya'), 0),
              statusBayar: String(getCol(r, 'Status Bayar', 'statusBayar') || 'Lunas'),

          rows.forEach((r, idx) => {

              metode: String(getCol(r, 'Metode Bayar', 'metode') || 'Tunai'),

            const id = getCol(r, 'ID Catatan', 'id', 'ID') || `HP-${Date.now()}-${idx}`;
            const totalTagihan = parseNum(getCol(r, 'Total Tagihan (Rp)', 'totalTagihan', 'Nominal (Rp)', 'jumlah'), 0);
            const terbayar = parseNum(getCol(r, 'Terbayar (Rp)', 'terbayar'), 0);
            const sisa = parseNum(getCol(r, 'Sisa (Rp)', 'jumlah'), Math.max(0, totalTagihan - terbayar));
            const status = String(getCol(r, 'Status', 'status') || (sisa <= 0 && totalTagihan > 0 ? 'Lunas' : (terbayar > 0 ? 'Dicicil' : 'Belum Lunas')));
            parsed.hutangpiutang.push({
              id: String(id).trim(),
              jenis: String(getCol(r, 'Jenis', 'jenis') || 'Hutang'),
              pihak: String(getCol(r, 'Pihak Terkait', 'pihak') || 'Pihak'),
              noRef: String(getCol(r, 'No Referensi', 'noRef') || ''),
              tanggal: String(getCol(r, 'Tanggal', 'tanggal') || ''),
              totalTagihan,
              terbayar,
              jumlah: sisa,
              jatuhTempo: String(getCol(r, 'Jatuh Tempo', 'jatuhTempo') || ''),
              status,
              keterangan: String(getCol(r, 'Keterangan', 'keterangan') || ''),
              riwayatCicilan: []
            });
          });
        } else if (sName.includes('dtf') || sName.includes('film')) {
          rows.forEach((r, idx) => {
            const id = getCol(r, 'ID Order', 'id', 'ID', 'No Order') || `DTF-${Date.now()}-${idx}`;
            const jumlahVal = parseNum(getCol(r, 'Jumlah / Ukuran', 'Jumlah (Ukuran)', 'Jumlah', 'jumlah', 'Ukuran', 'qty', 'Qty'), 1);
            const hargaVal = parseNum(getCol(r, 'Harga Satuan (Rp)', 'Harga Satuan', 'hargaSatuan', 'harga', 'Harga'), 0);
            const totalBiayaVal = parseNum(getCol(r, 'Total Biaya (Rp)', 'totalBiaya', 'Total', 'total'), Math.round(jumlahVal * hargaVal));
            const bayarVal = parseNum(getCol(r, 'Bayar / DP (Rp)', 'Bayar (Rp)', 'bayar', 'DP'), totalBiayaVal);
            const sisaVal = Math.max(0, totalBiayaVal - bayarVal);

            const stokId = String(getCol(r, 'Kode Barang (Stok)', 'Kode Barang', 'stokId', 'kodeBarang') || '').trim();
            const stokNama = String(getCol(r, 'Nama Bahan Stok', 'Nama Bahan', 'stokNama') || '').trim();
            const stokSatuan = String(getCol(r, 'Satuan Stok', 'stokSatuan') || '');
            const qtyStok = parseNum(getCol(r, 'Qty Potong Stok', 'qtyStok', 'Potong Stok'), 0);
            const hppSatuan = parseNum(getCol(r, 'Modal HPP Satuan (Rp)', 'Modal HPP Satuan', 'hppSatuan', 'Modal Satuan'), 0);
            const totalModalVal = parseNum(getCol(r, 'Total Modal HPP (Rp)', 'Total Modal HPP', 'totalModal', 'Total Modal'), Math.round(qtyStok * hppSatuan));
            const labaKotorVal = parseNum(getCol(r, 'Estimasi Laba (Rp)', 'labaKotor', 'Laba'), Math.max(0, totalBiayaVal - totalModalVal));
            const potongStok = Boolean(getCol(r, 'Potong Stok', 'potongStok') !== undefined ? getCol(r, 'Potong Stok', 'potongStok') : (stokId ? true : false));

            parsed.dtf.push({
              id: String(id).trim(),
              tanggal: String(getCol(r, 'Tanggal', 'tanggal') || new Date().toISOString().slice(0, 10)),
              pelangganId: String(getCol(r, 'ID Pelanggan', 'pelangganId') || ''),
              pelangganNama: String(getCol(r, 'Nama Pelanggan', 'Pelanggan', 'pelangganNama') || 'Pelanggan'),
              pelangganTelepon: String(getCol(r, 'No Telepon', 'pelangganTelepon') || ''),
              jasaPrint: String(getCol(r, 'Jasa Print', 'jasaPrint', 'jasa') || 'Cetak Film DTF Meteran'),
              satuan: String(getCol(r, 'Satuan', 'satuan') || 'meter').toLowerCase().includes('cm') ? 'cm' : 'meter',
              jumlah: jumlahVal,
              hargaSatuan: hargaVal,
              totalBiaya: totalBiayaVal,
              statusBayar: String(getCol(r, 'Status Bayar', 'statusBayar') || (sisaVal === 0 ? 'Lunas' : (bayarVal > 0 ? 'DP' : 'Belum Bayar'))),
              bayar: bayarVal,
              sisa: sisaVal,
              metode: String(getCol(r, 'Metode Bayar', 'Metode', 'metode') || 'Tunai'),
              statusPengerjaan: String(getCol(r, 'Status Pengerjaan', 'statusPengerjaan', 'status') || 'Selesai'),
              catatan: String(getCol(r, 'Catatan', 'catatan') || ''),
              stokId,
              stokNama,
              stokSatuan,
              qtyStok,
              hppSatuan,
              totalModal: totalModalVal,
              labaKotor: labaKotorVal,
              potongStok
            });
          });
        }
      });

      const totalRecords = Object.values(parsed).reduce((sum, arr) => sum + (arr ? arr.length : 0), 0);
      if (totalRecords === 0) {
        alert('Tidak ditemukan data yang sesuai dalam file Excel ini. Pastikan file berisikan sheet atau kolom yang sesuai format.');
        return;
      }

      window._pendingImportData = parsed;
      openImportPreviewModal(parsed, fileName);
    };

    window.executeImportData = async function () {
      if (!window._pendingImportData) return;
      const modeEl = document.querySelector('input[name="import-mode"]:checked');
      const mode = modeEl ? modeEl.value : 'merge';
      const data = window._pendingImportData;

      if (mode === 'replace') {
        if (data.stok.length > 0) state.stok = [...data.stok];
        if (data.pelanggan.length > 0) state.pelanggan = [...data.pelanggan];
        if (data.kategoriStok.length > 0) state.kategoriStok = [...data.kategoriStok];
        if (data.servis.length > 0) state.servis = [...data.servis];
        if (data.penjualan.length > 0) state.penjualan = [...data.penjualan];
        if (data.dtf && data.dtf.length > 0) state.dtf = [...data.dtf];
        if (data.pembelian.length > 0) state.pembelian = [...data.pembelian];
        if (data.kas.length > 0) state.kas = [...data.kas];
        if (data.operasional.length > 0) state.operasional = [...data.operasional];
        if (data.hutangpiutang.length > 0) state.hutangpiutang = [...data.hutangpiutang];
      } else {
        const mergeCollection = (currentList, newList) => {
          const map = new Map();
          (currentList || []).forEach(item => map.set(item.id, item));
          (newList || []).forEach(item => map.set(item.id, { ...(map.get(item.id) || {}), ...item }));
          return Array.from(map.values());
        };

        if (data.stok.length > 0) state.stok = mergeCollection(state.stok, data.stok);
        if (data.pelanggan.length > 0) state.pelanggan = mergeCollection(state.pelanggan, data.pelanggan);
        if (data.kategoriStok.length > 0) {
          state.kategoriStok = Array.from(new Set([...(state.kategoriStok || []), ...data.kategoriStok]));
        }
        if (data.servis.length > 0) state.servis = mergeCollection(state.servis, data.servis);
        if (data.penjualan.length > 0) state.penjualan = mergeCollection(state.penjualan, data.penjualan);
        if (data.dtf && data.dtf.length > 0) state.dtf = mergeCollection(state.dtf, data.dtf);
        if (data.pembelian.length > 0) state.pembelian = mergeCollection(state.pembelian, data.pembelian);
        if (data.kas.length > 0) state.kas = mergeCollection(state.kas, data.kas);
        if (data.operasional.length > 0) state.operasional = mergeCollection(state.operasional, data.operasional);
        if (data.hutangpiutang.length > 0) state.hutangpiutang = mergeCollection(state.hutangpiutang, data.hutangpiutang);
      }

      persistLocalStorageData();

      if (isFirebaseActive && db) {
        try {
          const syncCol = async (colName, list) => {
            for (const item of list) {
              await setDoc(getDocRef(colName, item.id), item);
            }
          };
          await syncCol('stok', state.stok);
          await syncCol('pelanggan', state.pelanggan);
          await syncCol('servis', state.servis);
          await syncCol('penjualan', state.penjualan);
          await syncCol('dtf', state.dtf || []);
          await syncCol('pembelian', state.pembelian);
          await syncCol('kas', state.kas);
          await syncCol('operasional', state.operasional);
          await syncCol('hutangpiutang', state.hutangpiutang);
        } catch (err) {
          console.warn('Firebase sync error during import:', err);
        }
      }

      window._pendingImportData = null;
      closeModal();
      showNotificationToast('Data dari file Excel berhasil diimpor & dipulihkan!');
      renderPage();
    };

                <div class="w-10 h-10 rounded-xl bg-cyan-600/10 text-cyan-600 flex items-center justify-center font-bold">
                  <i data-lucide="layers" class="w-5 h-5"></i>
                </div>
                <div>
                  <span class="text-[11px] text-slate-400 block font-medium">Cetak Film DTF</span>
                  <span class="text-lg font-black text-slate-800 dark:text-slate-100">${(state.dtf || []).length} Order</span>
                </div>
              </div>

              <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-500/10 text-indigo-500 flex items-center justify-center font-bold">
                  <i data-lucide="truck" class="w-5 h-5"></i>
                </div>
                <div>
                  <span class="text-[11px] text-slate-400 block font-medium">Pembelian Stok</span>
                  <span class="text-lg font-black text-slate-800 dark:text-slate-100">${state.pembelian.length} Faktur</span>
                </div>
              </div>

              <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-teal-500/10 text-teal-500 flex items-center justify-center font-bold">
                  <i data-lucide="wallet" class="w-5 h-5"></i>
                </div>
                <div>
                  <span class="text-[11px] text-slate-400 block font-medium">Buku Kas</span>
                  <span class="text-lg font-black text-slate-800 dark:text-slate-100">${state.kas.length} Mutasi</span>
                </div>
              </div>

              <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-500 flex items-center justify-center font-bold">
                  <i data-lucide="receipt" class="w-5 h-5"></i>
                </div>
                <div>
                  <span class="text-[11px] text-slate-400 block font-medium">Operasional</span>
                  <span class="text-lg font-black text-slate-800 dark:text-slate-100">${state.operasional.length} Catatan</span>
                </div>
              </div>

              <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-violet-500/10 text-violet-500 flex items-center justify-center font-bold">
                  <i data-lucide="file-text" class="w-5 h-5"></i>
                </div>
                <div>
                  <span class="text-[11px] text-slate-400 block font-medium">Hutang & Piutang</span>
                  <span class="text-lg font-black text-slate-800 dark:text-slate-100">${state.hutangpiutang.length} Data</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Dua Modul Aksi: Export & Import -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- 1. EXPORT EXCEL -->
            <div class="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 flex flex-col justify-between">
              <div class="space-y-3">
                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center font-bold">
                    <i data-lucide="download" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h4 class="font-bold text-base text-slate-800 dark:text-slate-100">Export & Download Data (Excel)</h4>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Download file spreadsheet Excel untuk backup atau arsip</p>
                  </div>
                </div>

                <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 space-y-2 text-xs text-slate-600 dark:text-slate-300">
                  <p class="font-semibold text-slate-800 dark:text-slate-100 flex items-center space-x-1.5">
                    <i data-lucide="layers" class="w-4 h-4 text-emerald-500"></i>
                    <span>Struktur Sheet yang Dihasilkan:</span>
                  </p>
                  <ul class="grid grid-cols-2 gap-1.5 text-[11px] text-slate-500 dark:text-slate-400 list-disc list-inside">
                    <li>Sheet 1: <strong>Stok_Barang</strong></li>
                    <li>Sheet 2: <strong>Data_Pelanggan</strong></li>
                    <li>Sheet 3: <strong>Kategori_Stok</strong></li>
                    <li>Sheet 4: <strong>Transaksi_Servis</strong></li>
                    <li>Sheet 5: <strong>Penjualan_POS</strong></li>
                    <li>Sheet 6: <strong>Cetak_Film_DTF</strong></li>
                    <li>Sheet 7: <strong>Pembelian_Stok</strong></li>
                    <li>Sheet 8: <strong>Kas_Masuk_Keluar</strong></li>
                    <li>Sheet 9: <strong>Pengeluaran_Operasional</strong></li>
                    <li>Sheet 10: <strong>Hutang_Piutang</strong></li>
                  </ul>
                </div>
              </div>

              <div class="space-y-2.5 pt-2">
                <button onclick="exportAllDataToExcel()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-sm shadow-md shadow-emerald-500/20 flex items-center justify-center space-x-2 transition">
                  <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                  <span>Download Backup Keseluruhan (.xlsx)</span>
                </button>

                <div class="grid grid-cols-2 gap-2 text-xs">
                  <button onclick="exportCollectionToExcel('stok')" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 hover:border-emerald-500 font-semibold text-slate-700 dark:text-slate-200 flex items-center justify-center space-x-1 transition">
                    <i data-lucide="boxes" class="w-3.5 h-3.5 text-emerald-500"></i>
                    <span>Export Stok Saja</span>
                  </button>
                  <button onclick="exportCollectionToExcel('pelanggan')" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 hover:border-emerald-500 font-semibold text-slate-700 dark:text-slate-200 flex items-center justify-center space-x-1 transition">
                    <i data-lucide="users" class="w-3.5 h-3.5 text-blue-500"></i>
                    <span>Export Pelanggan Saja</span>
                  </button>
                  <button onclick="exportCollectionToExcel('servis')" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 hover:border-emerald-500 font-semibold text-slate-700 dark:text-slate-200 flex items-center justify-center space-x-1 transition">
                    <i data-lucide="wrench" class="w-3.5 h-3.5 text-amber-500"></i>
                    <span>Export Servis Saja</span>
                  </button>
                  <button onclick="exportCollectionToExcel('penjualan')" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 hover:border-emerald-500 font-semibold text-slate-700 dark:text-slate-200 flex items-center justify-center space-x-1 transition">
                    <i data-lucide="shopping-bag" class="w-3.5 h-3.5 text-cyan-500"></i>
                    <span>Export POS Saja</span>
                  </button>
                  <button onclick="exportCollectionToExcel('dtf')" class="col-span-2 p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 hover:border-emerald-500 font-semibold text-slate-700 dark:text-slate-200 flex items-center justify-center space-x-1 transition">
                    <i data-lucide="layers" class="w-3.5 h-3.5 text-cyan-600"></i>
                    <span>Export Cetak Film DTF Saja</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- 2. IMPORT EXCEL -->
            <div class="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-5 flex flex-col justify-between">
              <div class="space-y-3">
                <div class="flex items-center space-x-3">
                  <div class="w-10 h-10 rounded-xl bg-cyan-500/10 text-cyan-500 flex items-center justify-center font-bold">
                    <i data-lucide="upload" class="w-5 h-5"></i>
                  </div>
                  <div>
                    <h4 class="font-bold text-base text-slate-800 dark:text-slate-100">Import & Pulihkan Data (Excel)</h4>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Pulihkan database dari file backup atau template Excel</p>
                  </div>
                </div>

                <!-- Dropzone Area -->
                <div onclick="document.getElementById('excel-file-importer').click()" class="border-2 border-dashed border-slate-300 dark:border-slate-600 hover:border-cyan-500 rounded-2xl p-6 text-center cursor-pointer transition bg-slate-50/60 dark:bg-slate-900/40 hover:bg-cyan-500/5 group">
                  <div class="w-12 h-12 mx-auto mb-2 rounded-2xl bg-cyan-500/10 text-cyan-500 flex items-center justify-center group-hover:scale-110 transition">
                    <i data-lucide="file-up" class="w-6 h-6"></i>
                  </div>
                  <h5 class="font-bold text-sm text-slate-800 dark:text-slate-100">Pilih File Excel (.xlsx / .xls)</h5>
                  <p class="text-xs text-slate-400 mt-1">Klik untuk memilih file backup Excel dari perangkat Anda</p>
                  <span class="inline-block mt-3 px-3 py-1 rounded-full bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 text-[11px] font-bold">Mendukung Multi-Sheet Backup</span>
                </div>
                <input type="file" id="excel-file-importer" accept=".xlsx, .xls" class="hidden" onchange="handleExcelFileUpload(event)" />
              </div>

              <div class="flex items-center justify-between pt-2 border-t border-slate-200 dark:border-slate-700">
                <span class="text-xs text-slate-400">Belum punya data backup?</span>
                <button type="button" onclick="downloadExcelTemplate()" class="text-xs text-cyan-600 dark:text-cyan-400 font-bold hover:underline flex items-center space-x-1">
                  <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                  <span>Download Template Excel Kosong</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Petunjuk Keamanan Data -->
          <div class="p-4 rounded-2xl bg-slate-100 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 flex items-start space-x-3 text-xs text-slate-600 dark:text-slate-300">
            <i data-lucide="shield-check" class="w-5 h-5 text-emerald-500 shrink-0 mt-0.5"></i>
            <div class="space-y-1">
              <strong class="text-slate-800 dark:text-slate-100 block">Panduan Penyimpanan & Cadangan Rutin:</strong>
              <p>Simpan file backup Excel Anda di media eksternal (Flashdisk, Harddisk Eksternal, atau Cloud Storage seperti Google Drive/OneDrive). Setiap file backup memuat seluruh ID transaksi dan riwayat sparepart secara aman sehingga dapat dipulihkan kapan saja saat ganti perangkat atau setelah instal ulang.</p>
            </div>
          </div>

          <!-- Zona Bahaya: Reset Seluruh Data (Mulai dari Awal) -->
          <div class="p-6 rounded-2xl bg-rose-500/5 dark:bg-rose-950/20 border-2 border-rose-300 dark:border-rose-900/60 shadow-sm space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <div class="flex items-start sm:items-center space-x-3.5">
                <div class="w-12 h-12 rounded-2xl bg-rose-500/10 text-rose-500 flex items-center justify-center shrink-0 border border-rose-500/20">
                  <i data-lucide="alert-octagon" class="w-6 h-6"></i>
                </div>
                <div>
                  <div class="flex items-center space-x-2">
                    <span class="px-2 py-0.5 rounded bg-rose-500/10 text-rose-600 dark:text-rose-400 font-black text-[10px] uppercase tracking-wider">Zona Bahaya • Danger Zone</span>
                    <span class="text-[11px] text-rose-500/80 font-bold flex items-center space-x-1">
                      <i data-lucide="lock" class="w-3 h-3"></i>
                      <span>Perlu Verifikasi Password Admin</span>
                    </span>
                  </div>
                  <h4 class="font-black text-lg text-rose-600 dark:text-rose-400 mt-0.5">Reset Data All (Mulai dari Awal)</h4>
                  <p class="text-xs text-slate-600 dark:text-slate-300 max-w-xl leading-relaxed">
                    Hapus catatan transaksi dan database untuk memulai pembukuan dari nol (fresh start). Dilengkapi proteksi password admin dan opsi unduh backup otomatis sebelum eksekusi.
                  </p>
                </div>
              </div>
              <button onclick="openResetAllDataModal()" class="px-5 py-3 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-700 hover:to-red-700 text-white font-black text-xs shadow-lg shadow-rose-600/25 flex items-center space-x-2 transition shrink-0">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>Reset Data All...</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Initialize sync on page load
    window.addEventListener('DOMContentLoaded', () => {
      const themeLabel = document.getElementById('theme-label');
      if (themeLabel) themeLabel.innerText = state.darkMode ? 'Dark' : 'Light';
      updateRoleUI();
      initFirebaseSync();
      initStorageAndSync();
      renderNav();
      renderPage();
    });
  </script>
</body>

</html>
